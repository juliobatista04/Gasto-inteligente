/* --------------------------------------------------------------------------
   RELATÓRIOS
   -------------------------------------------------------------------------- */
function pageReports() {
  const month = state.month;
  const months = Number(state.reportRange || 6);
  const series = monthlySeries(month, months);
  const from = `${addMonths(month, -(months - 1))}-01`;
  const { to } = monthRange(month);
  const list = txBetween(from, to);

  const expenses = byCategory(list, "expense");
  const incomes = byCategory(list, "income");
  const methods = byMethod(list, "expense");
  const totalExpense = sum(expenses, (c) => c.value);
  const totalIncome = sum(incomes, (c) => c.value);

  let running = 0;
  const cumulative = series.map((m) => {
    running = round2(running + m.balance);
    return { label: monthLabel(m.month, true), short: monthName(m.month, true), value: running };
  });

  const withData = series.filter((m) => m.count > 0);
  const avgIncome = withData.length ? sum(withData, (m) => m.income) / withData.length : 0;
  const avgExpense = withData.length ? sum(withData, (m) => m.expense) / withData.length : 0;
  const best = [...withData].sort((a, b) => b.balance - a.balance)[0];
  const worst = [...withData].sort((a, b) => a.balance - b.balance)[0];

  // ranking dos maiores gastos individuais
  const biggest = list.filter((tx) => tx.type === "expense").sort((a, b) => b.amount - a.amount).slice(0, 8);

  // comparação categoria a categoria: período atual x anterior
  const prevFrom = `${addMonths(month, -(months * 2 - 1))}-01`;
  const prevTo = `${addMonths(month, -months)}-${pad2(daysInMonth(addMonths(month, -months)))}`;
  const prevByCat = new Map(byCategory(txBetween(prevFrom, prevTo), "expense").map((c) => [c.id, c.value]));
  const comparison = expenses.slice(0, 8).map((c) => {
    const before = prevByCat.get(c.id) || 0;
    return { ...c, before, change: before > 0 ? ((c.value - before) / before) * 100 : null };
  });

  return `
    <div class="page-head">
      <div>
        <h1 class="page-title">${esc(t("reports"))}</h1>
        <p class="page-sub">${esc(monthLabel(addMonths(month, -(months - 1)), true))} — ${esc(monthLabel(month, true))}</p>
      </div>
      <div class="row gap-8">
        <div class="seg" data-range>
          ${[3, 6, 12].map((n) => `<button data-value="${n}" aria-pressed="${months === n}">${n}m</button>`).join("")}
        </div>
        ${monthNav(month)}
        <button class="btn btn-icon" data-action="print" title="Imprimir" aria-label="Imprimir">${icon("print", 16)}</button>
      </div>
    </div>

    <div class="grid grid-kpi keep-2 mb-16">
      ${kpiCard({ label: "Receita média", value: money(avgIncome), iconName: "arrowUp", tone: "pos", sub: `<span class="faint">por mês no período</span>`, spark: sparkline(series.map((m) => m.income), { color: "var(--income)" }) })}
      ${kpiCard({ label: "Despesa média", value: money(avgExpense), iconName: "arrowDown", tone: "neg", sub: `<span class="faint">por mês no período</span>`, spark: sparkline(series.map((m) => m.expense), { color: "var(--expense)" }) })}
      ${kpiCard({ label: "Sobra acumulada", value: money(running), iconName: "wallet", tone: running >= 0 ? "pos" : "neg", sub: `<span class="faint">soma do período</span>` })}
      ${kpiCard({ label: "Taxa de poupança", value: pctText(totalIncome ? ((totalIncome - totalExpense) / totalIncome) * 100 : 0, 1), iconName: "piggy", tone: "accent", sub: `<span class="faint">da renda total</span>` })}
    </div>

    <div class="col gap-16">
      ${sectionCard("Receitas x despesas",
        `<div class="chart-wrap">${barsChart(series, { height: 240 })}</div>
         ${legend([{ name: t("incomes"), color: "var(--income)" }, { name: t("expenses"), color: "var(--expense)" }])}`,
        { sub: best && worst ? `Melhor mês: ${monthLabel(best.month, true)} (${money(best.balance)}) · Pior: ${monthLabel(worst.month, true)} (${money(worst.balance)})` : "" })}

      ${sectionCard("Saldo acumulado",
        `<div class="chart-wrap">${areaChart(cumulative, { height: 220, color: running >= 0 ? "var(--income)" : "var(--expense)" })}</div>`,
        { sub: "Soma das sobras mês a mês" })}

      <div class="grid grid-2">
        ${sectionCard("Despesas por categoria",
          expenses.length ? `
            <div class="center mb-16">${donutChart(expenses.slice(0, 9), { size: 176, center: moneyShort(totalExpense), centerSub: "no período" })}</div>
            ${rankBars(expenses.slice(0, 8))}`
            : emptyState({ iconName: "chart", title: "Sem despesas", text: "Nenhuma despesa registrada no período." }))}

        ${sectionCard("Receitas por categoria",
          incomes.length ? `
            <div class="center mb-16">${donutChart(incomes.slice(0, 9), { size: 176, center: moneyShort(totalIncome), centerSub: "no período" })}</div>
            ${rankBars(incomes.slice(0, 8))}`
            : emptyState({ iconName: "chart", title: "Sem receitas", text: "Nenhuma receita registrada no período." }))}
      </div>

      ${methods.length ? sectionCard("Como você pagou",
        `<div class="row gap-16 wrap" style="align-items:center;justify-content:center">
          <div style="flex:none">${donutChart(methods, { size: 168, center: moneyShort(sum(methods, (m) => m.value)), centerSub: "no período" })}</div>
          <div class="grow" style="min-width:210px">
            <div class="col gap-12">${methods.map((m) => `
              <div>
                <div class="row-between mb-4">
                  <span class="row gap-8" style="min-width:0;color:${m.color}">${icon(m.icon, 15)}
                    <span class="f-13 w-600" style="color:var(--text)">${esc(m.name)}</span></span>
                  <span class="row gap-8" style="flex:none">
                    <span class="f-13 w-700 num">${esc(money(m.value))}</span>
                    <span class="f-11 faint num" style="min-width:34px;text-align:right">${esc(pctText(m.share))}</span>
                  </span>
                </div>
                <div class="bar"><div class="bar-fill" style="width:${m.share}%;background:${m.color}"></div></div>
              </div>`).join("")}</div>
          </div>
        </div>`,
        { sub: "Distribuição das despesas por meio de pagamento" }) : ""}

      ${comparison.length ? sectionCard("Você gastou mais ou menos?",
        `<div class="scroll-x"><table class="table">
          <thead><tr><th>Categoria</th><th class="right">Período anterior</th><th class="right">Período atual</th><th class="right">Variação</th></tr></thead>
          <tbody>${comparison.map((c) => `
            <tr>
              <td><span class="row gap-8"><span>${esc(c.emoji)}</span><span class="w-600">${esc(c.name)}</span></span></td>
              <td class="right num muted">${esc(money(c.before))}</td>
              <td class="right num w-700">${esc(money(c.value))}</td>
              <td class="right num">${c.change === null ? `<span class="badge badge-info">novo</span>`
                : `<span class="${c.change > 0 ? "neg" : "pos"} w-700">${c.change > 0 ? "+" : ""}${esc(pctText(c.change, 1))}</span>`}</td>
            </tr>`).join("")}</tbody>
        </table></div>`,
        { sub: `Comparado com os ${months} meses anteriores` }) : ""}

      ${biggest.length ? sectionCard("Maiores gastos do período",
        `<div class="list">${biggest.map((tx) => txRow(tx, { showDate: true })).join("")}</div>`) : ""}
    </div>`;
}

pageHandlers.reports = (root) => {
  delegate(root, "click", "[data-range] button", (event, node) => {
    state.reportRange = Number(node.dataset.value);
    render();
  });
  delegate(root, "click", "[data-action='print']", () => window.print());
};

/* --------------------------------------------------------------------------
   ANO EM REVIEW
   -------------------------------------------------------------------------- */
function pageYear() {
  const year = state.year || yearOf(state.month);
  const months = Array.from({ length: 12 }, (_, i) => monthSummary(`${year}-${pad2(i + 1)}`));
  const withData = months.filter((m) => m.count > 0);
  const income = sum(months, (m) => m.income);
  const expense = sum(months, (m) => m.expense);
  const balance = round2(income - expense);
  const list = txBetween(`${year}-01-01`, `${year}-12-31`);
  const categories = byCategory(list, "expense");
  const top = categories[0];

  const years = [...new Set(db().transactions.map((tx) => yearOf(tx.date)))].sort((a, b) => b - a);
  if (!years.includes(year)) years.unshift(year);

  const best = [...withData].sort((a, b) => b.balance - a.balance)[0];
  const worst = [...withData].sort((a, b) => a.balance - b.balance)[0];
  const busiest = [...withData].sort((a, b) => b.count - a.count)[0];
  const savingsRate = income > 0 ? (balance / income) * 100 : 0;

  const highlight = (label, value, sub, tone = "accent") => `
    <div class="card">
      <div class="eyebrow mb-8">${esc(label)}</div>
      <div class="f-24 w-800 num" style="color:var(--${tone === "accent" ? "text" : tone})">${esc(value)}</div>
      <div class="f-11 faint mt-4">${esc(sub)}</div>
    </div>`;

  return `
    <div class="page-head">
      <div>
        <h1 class="page-title">${year} em review</h1>
        <p class="page-sub">${withData.length} mês(es) com movimento · ${list.length} lançamento(s)</p>
      </div>
      <div class="row gap-8">
        <select class="select" data-year style="width:auto">
          ${years.map((y) => `<option value="${y}" ${y === year ? "selected" : ""}>${y}</option>`).join("")}
        </select>
        <button class="btn btn-icon" data-action="print" title="Imprimir" aria-label="Imprimir">${icon("print", 16)}</button>
      </div>
    </div>

    ${!withData.length ? `<div class="card">${emptyState({ iconName: "award", title: `Nada registrado em ${year}`, text: "Escolha outro ano ou comece a registrar seus lançamentos." })}</div>` : `
    <div class="col gap-16">
      <div class="card" style="background:linear-gradient(135deg, var(--accent-soft), transparent);border-color:var(--accent)">
        <div class="row gap-16 wrap" style="align-items:center">
          <span style="flex:none;color:var(--accent)">${icon("award", 34)}</span>
          <div class="grow" style="min-width:200px">
            <div class="eyebrow">Resultado do ano</div>
            <div class="f-34 w-800 num ${balance >= 0 ? "pos" : "neg"}" style="letter-spacing:-.045em">${esc(money(balance))}</div>
            <div class="f-13 muted mt-4">
              ${balance >= 0
                ? `Você guardou ${esc(pctText(savingsRate, 1))} de tudo que entrou. ${savingsRate >= 20 ? "Isso é ótimo." : savingsRate >= 10 ? "Dá para melhorar um pouco." : "Vale apertar os gastos supérfluos."}`
                : `Você gastou ${esc(money(Math.abs(balance)))} a mais do que recebeu no ano.`}
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-kpi keep-2">
        ${highlight("Total recebido", money(income), `média de ${money(income / Math.max(1, withData.length))}/mês`, "income")}
        ${highlight("Total gasto", money(expense), `média de ${money(expense / Math.max(1, withData.length))}/mês`, "expense")}
        ${highlight("Maior categoria", top ? top.name : "—", top ? `${money(top.value)} · ${pctText(top.share)} das despesas` : "sem dados")}
        ${highlight("Mês mais movimentado", busiest ? monthName(busiest.month) : "—", busiest ? `${busiest.count} lançamentos` : "sem dados")}
      </div>

      ${sectionCard("Mês a mês",
        `<div class="chart-wrap">${barsChart(months, { height: 250 })}</div>
         ${legend([{ name: t("incomes"), color: "var(--income)" }, { name: t("expenses"), color: "var(--expense)" }])}`)}

      <div class="grid grid-2">
        ${sectionCard("Onde o dinheiro foi",
          categories.length ? `
            <div class="center mb-16">${donutChart(categories.slice(0, 10), { size: 186, center: moneyShort(expense), centerSub: `em ${year}` })}</div>
            ${rankBars(categories.slice(0, 8))}` : emptyState({ iconName: "chart", title: "Sem despesas", text: "Nenhuma despesa no ano." }))}

        ${sectionCard("Destaques",
          `<div class="col gap-12">
            ${best ? `<div class="row gap-12">
              <span class="avatar-icon" style="background:var(--income-soft);color:var(--income)">${icon("trendUp", 17)}</span>
              <span class="grow"><span class="f-13 w-700" style="display:block">Melhor mês: ${esc(monthName(best.month))}</span>
              <span class="f-11 muted">sobrou ${esc(money(best.balance))}</span></span>
            </div>` : ""}
            ${worst ? `<div class="row gap-12">
              <span class="avatar-icon" style="background:var(--expense-soft);color:var(--expense)">${icon("trendDown", 17)}</span>
              <span class="grow"><span class="f-13 w-700" style="display:block">Mês mais apertado: ${esc(monthName(worst.month))}</span>
              <span class="f-11 muted">${worst.balance >= 0 ? `sobrou ${esc(money(worst.balance))}` : `faltou ${esc(money(Math.abs(worst.balance)))}`}</span></span>
            </div>` : ""}
            <div class="row gap-12">
              <span class="avatar-icon" style="background:var(--accent-soft);color:var(--accent)">${icon("layers", 17)}</span>
              <span class="grow"><span class="f-13 w-700" style="display:block">${list.length} lançamentos no ano</span>
              <span class="f-11 muted">${esc(num(list.length / Math.max(1, withData.length), 0))} por mês, em média</span></span>
            </div>
            <div class="row gap-12">
              <span class="avatar-icon" style="background:var(--info-soft);color:var(--info)">${icon("calendar", 17)}</span>
              <span class="grow"><span class="f-13 w-700" style="display:block">Gasto médio diário</span>
              <span class="f-11 muted">${esc(money(expense / (withData.length * 30 || 1)))}</span></span>
            </div>
            <div class="row gap-12">
              <span class="avatar-icon" style="background:var(--warn-soft);color:var(--warn)">${icon("flame", 17)}</span>
              <span class="grow"><span class="f-13 w-700" style="display:block">Meses no azul</span>
              <span class="f-11 muted">${withData.filter((m) => m.balance >= 0).length} de ${withData.length}</span></span>
            </div>
          </div>`)}
      </div>

      ${sectionCard("Resumo por mês",
        `<div class="scroll-x"><table class="table">
          <thead><tr><th>Mês</th><th class="right">Receitas</th><th class="right">Despesas</th><th class="right">Sobra</th><th class="right">Taxa</th></tr></thead>
          <tbody>${months.map((m) => `
            <tr style="${m.count ? "" : "opacity:.45"}">
              <td class="w-600">${esc(monthName(m.month))}</td>
              <td class="right num pos">${m.income ? esc(money(m.income)) : "—"}</td>
              <td class="right num neg">${m.expense ? esc(money(m.expense)) : "—"}</td>
              <td class="right num w-700 ${m.balance >= 0 ? "pos" : "neg"}">${m.count ? esc(money(m.balance)) : "—"}</td>
              <td class="right num muted">${m.income ? esc(pctText(m.savingsRate, 0)) : "—"}</td>
            </tr>`).join("")}
            <tr style="border-top:2px solid var(--border)">
              <td class="w-800">Total</td>
              <td class="right num w-800 pos">${esc(money(income))}</td>
              <td class="right num w-800 neg">${esc(money(expense))}</td>
              <td class="right num w-800 ${balance >= 0 ? "pos" : "neg"}">${esc(money(balance))}</td>
              <td class="right num w-800">${esc(pctText(savingsRate, 0))}</td>
            </tr>
          </tbody>
        </table></div>`)}
    </div>`}`;
}

pageHandlers.year = (root) => {
  delegate(root, "change", "[data-year]", (event, node) => {
    state.year = Number(node.value);
    render();

  delegate(root, "click", "[data-action='print']", () => window.print());

function pickFile(accept, handler) {
  const input = el("input", { type: "file", accept, style: { display: "none" } });
  input.addEventListener("change", async () => {
    const file = input.files?.[0];
    input.remove();
    if (!file) return;
    try {
      handler(await file.text(), file);
    } catch (error) {
      toast(`Não consegui ler o arquivo: ${error.message}`, "err", 6000);
    }
  });
  document.body.append(input);
  input.click();
}

function handleJsonImport(text) {
  let payload;
  try { payload = JSON.parse(text); }
  catch { return toast("Arquivo JSON inválido.", "err"); }

  let info;
  try { info = validateBackup(payload); }
  catch (error) { return toast(error.message, "err", 6000); }

  const body = `
    <div class="col gap-14">
      <div class="card card-pad-sm col gap-8" style="background:var(--surface-2)">
        <div class="row-between"><span class="muted f-12">Perfis no arquivo</span><b class="num">${info.users}</b></div>
        <div class="row-between"><span class="muted f-12">Lançamentos</span><b class="num">${info.transactions}</b></div>
        <div class="row-between"><span class="muted f-12">Data do backup</span><b class="f-12">${esc(info.exportedAt ? dateLabel(toKey(new Date(info.exportedAt)), { year: true }) : "desconhecida")}</b></div>
      </div>
      <div class="col gap-10 f-12" style="line-height:1.55">
        <div class="row gap-8" style="align-items:flex-start">
          <span style="color:var(--accent);flex:none;margin-top:1px">${icon("check", 14)}</span>
          <span><b>Juntar</b> soma os lançamentos dos dois lados. O que existe só no
          arquivo entra, o que existe só aqui fica, e o que foi editado nos dois
          vence pela alteração mais recente. É o jeito seguro de usar dois aparelhos.</span>
        </div>
        <div class="row gap-8" style="align-items:flex-start">
          <span style="color:var(--warn);flex:none;margin-top:1px">${icon("alert", 14)}</span>
          <span><b>Substituir</b> apaga o que está neste aparelho e deixa exatamente
          o conteúdo do arquivo. Use só quando quiser descartar o que há aqui.</span>
        </div>
      </div>
    </div>`;

  const footer = el("div", { class: "row gap-8 wrap", style: { width: "100%", justifyContent: "flex-end" } });
  const join = el("button", { class: "btn btn-primary", text: "Juntar com o que já tenho" });
  const merge = el("button", { class: "btn", text: "Substituir este perfil" });
  const replace = el("button", { class: "btn btn-danger", text: "Substituir tudo" });
  footer.append(replace, merge, join);

  const modal = openModal({ title: "Restaurar backup", iconName: "upload", size: "sm", body, footer });

  const run = async (mode) => {
    if (mode === "merge") {
      const okSub = await confirmDialog({
        title: "Substituir este perfil?",
        message: "Os lançamentos deste aparelho serão trocados pelos do arquivo."
          + "<br><br>Se você lançou algo aqui depois desse backup, <b>vai perder</b>."
          + " Para não perder nada, use <b>Juntar</b>.",
        confirmLabel: "Substituir", tone: "danger", iconName: "alert",
      });
      if (!okSub) return;
    }
    if (mode === "replace") {
      const ok = await confirmDialog({
        title: "Substituir tudo?",
        message: "Todos os perfis e dados atuais deste dispositivo serão apagados e trocados pelos do arquivo.",
        confirmLabel: "Substituir", tone: "danger", iconName: "alert",
      });
      if (!ok) return;
    }
    try {
      const result = importBackup(payload, mode);
      modal.close();
      toast(mode === "join"
        ? `${result.novos} novo(s), ${result.atualizados} atualizado(s), ${result.mantidos} mantido(s)`
        : `${result.users} perfil(is) restaurado(s)`, "ok", 6000);
      setTimeout(() => location.reload(), 1400);
    } catch (error) {
      toast(error.message, "err", 6000);
    }
  };
  join.addEventListener("click", () => run("join"));
  merge.addEventListener("click", () => run("merge"));
  replace.addEventListener("click", () => run("replace"));
}

/** Importador de CSV com mapeamento de colunas. */
function handleCsvImport(text) {
  const parsed = parseCsv(text);
  if (!parsed.rows.length) return toast("O arquivo não tem linhas de dados.", "err");

  const guess = (candidates) => {
    const index = parsed.headers.findIndex((h) => candidates.some((c) => normalize(h).includes(c)));
    return index >= 0 ? String(index) : "";
  };
  const columnOptions = parsed.headers.map((h, i) => ({ value: String(i), label: `${i + 1}. ${h || "(sem título)"}` }));

  const body = el("form", { class: "col gap-16", id: "csvForm", novalidate: true });
  body.innerHTML = `
    <div class="card card-pad-sm f-12 muted">
      ${parsed.rows.length} linha(s) encontradas · separador <b>"${esc(parsed.sep === "\t" ? "tab" : parsed.sep)}"</b>
    </div>
    <div class="form-grid">
      ${field("Coluna da data", selectInput("date", columnOptions, guess(["data", "date", "fecha"]), { placeholder: "—", required: true }))}
      ${field("Coluna do valor", selectInput("amount", columnOptions, guess(["valor", "amount", "importe", "montante"]), { placeholder: "—", required: true }))}
      ${field("Coluna da descrição", selectInput("description", columnOptions, guess(["desc", "histor", "lanç", "titulo", "title", "memo"]), { placeholder: "—" }))}
      ${field("Coluna da categoria", selectInput("category", columnOptions, guess(["categ", "class"]), { placeholder: "—" }))}
    </div>
    ${field("Lançar na conta", selectInput("accountId", activeAccounts().map((a) => ({ value: a.id, label: a.name })), activeAccounts()[0]?.id, { placeholder: "Nenhuma" }))}
    <div class="card card-pad-sm" style="background:var(--surface-2)">
      ${switchInput("negativeIsExpense", true, "Valor negativo = despesa", "Se o extrato usar sinal para separar entradas e saídas")}
    </div>
    <div id="csvPreview"></div>`;

  const footer = el("div", { class: "row gap-8", style: { width: "100%", justifyContent: "flex-end" } }, [
    el("button", { type: "button", class: "btn", text: t("cancel"), onclick: () => modal.close() }),
    el("button", { type: "submit", form: "csvForm", class: "btn btn-primary", text: "Importar" }),
  ]);

  const buildRows = (form) => {
    const out = [];
    for (const row of parsed.rows) {
      const date = parseDateLoose(row[Number(form.date)]);
      const rawAmount = row[Number(form.amount)];
      const value = parseMoney(rawAmount);
      if (!date || !value) continue;
      const negative = String(rawAmount).trim().startsWith("-") || value < 0;
      const type = form.negativeIsExpense ? (negative ? "expense" : "income") : "expense";
      const categoryName = form.category !== "" ? row[Number(form.category)] : "";
      const match = categoryName
        ? db().categories.find((c) => normalize(c.name) === normalize(categoryName))
        : null;
      out.push({
        type, amount: Math.abs(value), date,
        description: (form.description !== "" ? row[Number(form.description)] : "") || "Importado",
        categoryId: match?.id || null,
        accountId: form.accountId || null,
        paid: true,
      });
    }
    return out;
  };

  const modal = openModal({
    title: "Importar CSV", iconName: "sheet", size: "lg", body, footer,
    onMount: ({ close }) => {
      bindPickers(body);
      const preview = () => {
        const rows = buildRows(readForm(body));
        $("#csvPreview", body).innerHTML = rows.length ? `
          <div class="eyebrow mb-8">Prévia — ${rows.length} lançamento(s) válidos</div>
          <div class="card card-pad-sm scroll-x"><table class="table">
            <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th class="right">Valor</th></tr></thead>
            <tbody>${rows.slice(0, 6).map((r) => `<tr>
              <td class="num">${esc(dateLabel(r.date))}</td>
              <td class="truncate" style="max-width:200px">${esc(r.description)}</td>
              <td class="muted">${esc(catById(r.categoryId)?.name || "—")}</td>
              <td class="right num ${r.type === "income" ? "pos" : "neg"}">${r.type === "income" ? "+" : "−"}${esc(money(r.amount))}</td>
            </tr>`).join("")}</tbody>
          </table></div>`
          : `<div class="card card-pad-sm f-12 neg">Nenhuma linha válida com esse mapeamento. Confira as colunas de data e valor.</div>`;
      };
      preview();
      body.addEventListener("change", preview);

      body.addEventListener("submit", (event) => {
        event.preventDefault();
        const rows = buildRows(readForm(body));
        if (!rows.length) return toast("Nada para importar com esse mapeamento.", "err");
        for (const row of rows) db().transactions.push(normalizeTx(row));
        commit();
        close();
        toast(`${rows.length} lançamento(s) importado(s)`);
      });
    },
  });
}

/** Descrição curta do perfil na lista de escolha. */
function profileSummary(userId) {
  const data = store.get(KEYS.data(userId), null);
  if (!data) return "perfil novo";
  const count = (data.transactions || []).length;
  const last = data.meta?.lastOpen;
  return `${count} lançamento${count === 1 ? "" : "s"}${last ? ` · visto ${relativeDay(last)}` : ""}`;
}

/** Teclado numérico do PIN, com suporte a teclado físico. */
function bindPinPad(user) {
  const box = $("#authBox");
  const dots = $("#pinDots", box);
  const error = $("#pinError", box);
  let pin = "";
  let busy = false;

  const paint = () => {
    $$(".pin-dot", dots).forEach((dot, i) => {
      const visible = i < Math.max(4, pin.length);
      dot.style.display = visible ? "" : "none";
      dot.classList.toggle("on", i < pin.length);
    });
  };

  const fail = (message) => {
    error.textContent = message;
    dots.classList.add("shake");
    haptic([40, 60, 40]);
    setTimeout(() => dots.classList.remove("shake"), 400);
    pin = "";
    paint();
  };

  const submit = async () => {
    if (busy) return;
    busy = true;
    const ok = await checkPin(user, pin);
    busy = false;
    if (!ok) return fail("PIN incorreto. Tente de novo.");
    const remember = $("#remember", box)?.checked !== false;
    login(user, remember);
  };

  const push = (digit) => {
    if (pin.length >= 8) return;
    pin += digit;
    error.textContent = "";
    paint();
    haptic(8);
    if (pin.length >= 4) {
      // tenta assim que atinge o tamanho do PIN cadastrado
      setTimeout(() => { if (pin.length >= 4) submit(); }, 120);
    }
  };

  delegate(box, "click", "[data-key]", (event, node) => {
    const key = node.dataset.key;
    if (key === "clear") { pin = ""; error.textContent = ""; paint(); return; }
    if (key === "back") { pin = pin.slice(0, -1); paint(); return; }
    push(key);
  });

  const onKey = (event) => {
    if (!document.body.contains(box)) { document.removeEventListener("keydown", onKey); return; }
    if (/^\d$/.test(event.key)) { event.preventDefault(); push(event.key); }
    else if (event.key === "Backspace") { event.preventDefault(); pin = pin.slice(0, -1); paint(); }
    else if (event.key === "Enter" && pin.length >= 4) { event.preventDefault(); submit(); }
  };
  document.addEventListener("keydown", onKey);
  paint();
}

/* ---------- ações da tela de entrada ---------- */
function bindAuthActions() {
  const root = $("#app");

  delegate(root, "click", "[data-step]", (event, node) => showAuthStep(node.dataset.step));

  delegate(root, "click", "[data-user]", (event, node) => {
    const user = findUser(node.dataset.user);
    if (user) showAuthStep("pin", { user });
  });

  delegate(root, "click", "[data-action='restore-file']", () => {
    pickFile(".json,application/json", (text) => {
      try {
        const payload = JSON.parse(text);
        const info = validateBackup(payload);
        importBackup(payload, "merge");
        toast(`${info.users} perfil(is) restaurado(s)`);
        setTimeout(() => location.reload(), 800);
      } catch (error) {
        toast(error.message || "Arquivo inválido.", "err", 6000);
      }
    });
  });

  delegate(root, "submit", "#regForm", async (event) => {
    event.preventDefault();
    const form = event.target;
    const data = readForm(form);
    const ok = validate(form, {
      name: (v) => {
        if (!v.trim()) return "Digite seu nome.";
        if (getUsers().some((u) => normalize(u.name) === normalize(v))) return "Já existe um perfil com esse nome.";
        return "";
      },
      pin: (v) => (/^\d{4,8}$/.test(v) ? "" : "O PIN precisa ter de 4 a 8 dígitos."),
      confirm: (v) => (v === data.pin ? "" : "Os PINs não coincidem."),
    });
    if (!ok) return;

    const button = $("button[type=submit]", form);
    button.disabled = true;
    button.textContent = "Criando…";

    try {
      const user = await createUser({ name: data.name, pin: data.pin, color: data.color });
      const database = loadDb(user.id);
      database.profile.currency = data.currency;
      database.profile.displayName = user.name;
      if (data.demo) seedDemoData(database);
      store.set(KEYS.data(user.id), database);
      login(user, true);
    } catch (error) {
      button.disabled = false;
      button.innerHTML = `Criar perfil ${icon("arrowRight", 16)}`;
      toast(error.message, "err");
    }
  });
}

/* ---------- entrar e sair ---------- */
function login(user, remember = true) {
  session.write(user.id, remember);
  state.user = user;
  state.db = loadDb(user.id);
  state.month = thisMonth();
  state.page = "dashboard";
  state.filters = {};

  setCurrency(state.db.profile.currency);
  setLocale(state.db.profile.locale);
  document.documentElement.lang = state.db.profile.locale;
  fmtCache.clear();

  const created = materializeRecurring();
  commitNow();
  invalidate();

  stopCanvas?.();
  stopCanvas = null;

  renderShell();
  if (created) toast(`${created} lançamento(s) recorrente(s) programado(s)`, "info");
  else toast(`Bem-vindo de volta, ${user.name.split(" ")[0]}!`);
}

function logout() {
  commitNow();
  session.clear();
  state.user = null;
  state.db = null;
  renderAuth();
}

function seedDemoData(database) {
  const cat = (name) => database.categories.find((c) => c.name === name)?.id || null;
  const account = database.accounts[0];
  account.openingBalance = 2400;
  account.name = "Conta do dia a dia";
  account.bankId = "nubank";

    limit: 4500, closingDay: 22, dueDay: 1, accountId: account.id, archived: false,
  };
  database.cards.push(card);

  const push = (tx) => database.transactions.push(normalizeTx(tx));
  const salary = 5200;

  for (let back = 5; back >= 0; back--) {
    const month = addMonths(thisMonth(), -back);
    const jitter = (base, spread) => round2(base * (1 + (Math.random() - 0.5) * spread));

    push({ type: "income", amount: salary, date: dayInMonth(month, 5), description: "Salário", categoryId: cat("Salário"), accountId: account.id, method: "ted", paid: true });
    if (back % 3 === 0) push({ type: "income", amount: jitter(900, 0.5), date: dayInMonth(month, 18), description: "Freelance", categoryId: cat("Freelance"), accountId: account.id, method: "pix", paid: true });

    push({ type: "expense", amount: 1450, date: dayInMonth(month, 8), description: "Aluguel", categoryId: cat("Moradia"), accountId: account.id, method: "pix", paid: true });
    push({ type: "expense", amount: jitter(240, 0.4), date: dayInMonth(month, 12), description: "Luz e água", categoryId: cat("Contas de casa"), accountId: account.id, method: "boleto", paid: true });

    push({ type: "expense", amount: jitter(320, 0.4), date: dayInMonth(month, 15), description: "Combustível", categoryId: cat("Transporte"), cardId: card.id, accountId: account.id, method: "debito", paid: true });
    push({ type: "expense", amount: 55.9, date: dayInMonth(month, 10), description: "Streaming", categoryId: cat("Assinaturas"), cardId: card.id, accountId: account.id, method: "credito", paid: true });

    if (back % 2 === 0) push({ type: "expense", amount: jitter(180, 0.7), date: dayInMonth(month, 23), description: "Cinema e lazer", categoryId: cat("Lazer"), cardId: card.id, accountId: account.id, method: "credito", paid: true });

  // uma conta ainda em aberto, para o painel mostrar o alerta
  push({ type: "expense", amount: 189.9, date: addDays(todayKey(), 4), description: "Plano de celular", categoryId: cat("Assinaturas"), accountId: account.id, method: "boleto", paid: false });

  database.recurring.push({
    id: uid("rec"), type: "expense", amount: 1450, description: "Aluguel",
    categoryId: cat("Moradia"), accountId: account.id, cardId: null,
    // começa no mês seguinte: os meses passados já têm os lançamentos do exemplo
    method: "pix", frequency: "monthly", day: 8, startDate: `${addMonths(thisMonth(), 1)}-01`, endDate: null,
    active: true, autoPay: true, notes: "",
  });
  database.recurring.push({
    id: uid("rec"), type: "income", amount: salary, description: "Salário",
    categoryId: cat("Salário"), accountId: account.id, cardId: null,
    method: "ted", frequency: "monthly", day: 5, startDate: `${addMonths(thisMonth(), 1)}-01`, endDate: null,
    active: true, autoPay: true, notes: "",
  });

  database.budgets.push(
    { id: uid("bud"), categoryId: cat("Mercado"), amount: 900, month: null },
    { id: uid("bud"), categoryId: cat("Alimentação"), amount: 350, month: null },
    { id: uid("bud"), categoryId: cat("Lazer"), amount: 300, month: null },
    { id: uid("bud"), categoryId: cat("Transporte"), amount: 400, month: null },
  );

  const goal = { id: uid("goal"), name: "Reserva de emergência", target: 15000, deadline: null, accountId: account.id, color: "#25D39B", emoji: "🛡️", createdAt: new Date().toISOString() };

/* --------------------------------------------------------------------------
   Render principal
   -------------------------------------------------------------------------- */
let renderScheduled = false;
function render() {
  if (renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(() => {
    renderScheduled = false;
    if (!state.user || !$("#page")) return;

    renderSidebar();
    renderTopbar();
    renderTabbar();

    const page = $("#page");
    const scroll = window.scrollY;

    // Cada render usa um container novo. Os handlers de página registram
    // listeners com delegação no container que recebem; se o container fosse
    // o mesmo sempre, cada redesenho somaria mais um listener e um clique
    // passaria a disparar várias vezes — foi o que quebrava os menus "⋮".
    const view = el("div", { class: "page-view" });
    view.innerHTML = navItem(state.page).page();
    page.replaceChildren(view);
    pageHandlers[state.page]?.(view);
    bindPickers(view);
    // mantém a posição ao redesenhar depois de uma edição
    if (state.keepScroll) { window.scrollTo(0, scroll); state.keepScroll = false; }

    document.title = `${t(state.page)} · ${APP.name}`;
  });
}

/** Navega para uma página. */
function go(page) {
  if (!navItem(page)) return;
  state.page = page;
  closePopover();
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  history.replaceState(null, "", `#${page}`);
  render();
}

/* --------------------------------------------------------------------------
   Ações globais do shell
   -------------------------------------------------------------------------- */
function bindShellActions(root) {
  delegate(root, "click", "[data-nav]", (event, node) => { go(node.dataset.nav); haptic(6); });
  delegate(root, "click", "[data-goto]", (event, node) => go(node.dataset.goto));

  delegate(root, "click", "[data-action='new-tx']", () => openTransactionModal());
  delegate(root, "click", "[data-action='new-account']", () => openAccountModal());
  delegate(root, "click", "[data-action='new-card']", () => openCardModal());
  delegate(root, "click", "[data-action='new-budget']", () => openBudgetModal());
  delegate(root, "click", "[data-action='new-goal']", () => openGoalModal());
  delegate(root, "click", "[data-action='new-recurring']", () => openRecurringModal());
  delegate(root, "click", "[data-action='switch-user']", () => logout());

  delegate(root, "click", "[data-action='toggle-hide']", () => {
    db().profile.hideValues = !db().profile.hideValues;
    state.keepScroll = true;
    commit();
  });

  delegate(root, "click", "[data-action='toggle-theme']", () => {
    const current = prefs.read().theme;
    const next = current === "dark" ? "light" : "dark";
    applyPreferences(prefs.write({ theme: next }));
    state.keepScroll = true;
    render();
  });

  delegate(root, "click", "[data-action='more-menu']", () => openMoreMenu());
  delegate(root, "click", "[data-action='alerts']", (event, node) => openAlertsPanel(node));

  delegate(root, "click", "[data-action='user-menu']", (event, node) => {
    const others = getUsers().filter((u) => u.id !== state.user.id);
    showPopover(node, [
      { label: `Meu perfil — ${state.user.name}`, icon: "user", onClick: () => go("settings") },
      "-",
      // atalho direto para cada outro perfil do aparelho: ainda pede o PIN
      ...others.map((user) => ({
        label: `Entrar como ${user.name}`,
        icon: "users",
        onClick: () => switchToUser(user),
      })),
      ...(others.length ? ["-"] : []),
      { label: others.length ? "Ver todos os perfis" : "Trocar de usuário", icon: "logout", onClick: () => logout() },
      "-",
      { label: "Buscar atualização", icon: "refresh", badge: APP.build.slice(0, 6), onClick: () => checkForUpdate(true) },
    ]);
  });

  delegate(root, "click", "[data-action='month-prev']", () => { state.month = addMonths(state.month, -1); state.keepScroll = true; render(); });
  delegate(root, "click", "[data-action='month-next']", () => { state.month = addMonths(state.month, 1); state.keepScroll = true; render(); });
  delegate(root, "click", "[data-action='month-pick']", () => {
    openMonthPicker(state.month, (month) => { state.month = month; render(); });
  });

  // lançamento: clique curto abre edição; clique longo ou botão direito abre o menu
  delegate(root, "click", "[data-tx]", (event, node) => {
    const tx = findById(db().transactions, node.dataset.tx);
    if (tx) openTransactionModal(tx);
  });
  delegate(root, "contextmenu", "[data-tx]", (event, node) => {
    event.preventDefault();
    const tx = findById(db().transactions, node.dataset.tx);
    if (tx) openTxActions(tx, node);
  });
  let pressTimer = null;
  delegate(root, "pointerdown", "[data-tx]", (event, node) => {
    if (event.pointerType !== "touch") return;
    pressTimer = setTimeout(() => {
      const tx = findById(db().transactions, node.dataset.tx);
      if (tx) { haptic(18); openTxActions(tx, node); }
      pressTimer = null;
    }, 480);
  });
  const cancelPress = () => { clearTimeout(pressTimer); pressTimer = null; };
  root.addEventListener("pointerup", cancelPress);
  root.addEventListener("pointermove", cancelPress);
  root.addEventListener("pointercancel", cancelPress);

  // navegação por mês com as setas do teclado
  document.addEventListener("keydown", (event) => {
    if (modalStack.length || !state.user) return;
    const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
    if (typing) return;

    if (event.key === "ArrowLeft") { state.month = addMonths(state.month, -1); render(); }
    else if (event.key === "ArrowRight") { state.month = addMonths(state.month, 1); render(); }
    else if (event.key === "n" || event.key === "N") { event.preventDefault(); openTransactionModal(); }
    else if (event.key === "/") { event.preventDefault(); go("transactions"); setTimeout(() => $("#txSearch")?.focus(), 120); }
    else if (/^[1-9]$/.test(event.key)) {
      const target = ALL_NAV[Number(event.key) - 1];
      if (target) go(target.key);
    }
  });
}

/* --------------------------------------------------------------------------
   Preferências visuais
   -------------------------------------------------------------------------- */
function applyPreferences(preference = prefs.read()) {
  const html = document.documentElement;
  const dark = preference.theme === "dark" ||
    (preference.theme === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);

  html.dataset.theme = dark ? "dark" : "light";
  html.dataset.accent = preference.accent || "esmeralda";
  html.dataset.density = preference.density || "normal";

  const accent = ACCENTS.find((a) => a.id === preference.accent)?.hex || "#0F9D74";
  const themeColor = dark ? "#070B12" : "#F4F6F8";
  $$('meta[name="theme-color"]').forEach((meta) => meta.setAttribute("content", themeColor));

  // favicon acompanha a cor escolhida
  const link = $('link[rel="icon"]');
  if (link) link.href = logoDataUri(accent, "#ffffff");
}

window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => {
  if (prefs.read().theme === "auto") { applyPreferences(); render(); }
});

/* --------------------------------------------------------------------------
   Atualização automática (service worker) e instalação
   -------------------------------------------------------------------------- */
let swRegistration = null;
let deferredInstall = null;

function setupUpdates() {
  if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
  // dentro de um iframe (visualizadores incorporados) não existe sw.js ao lado
  // do documento: tentar registrar só geraria erro de console sem ganho nenhum
  if (window.top !== window.self) return;

  navigator.serviceWorker.register("./sw.js").then((registration) => {
    swRegistration = registration;

    registration.addEventListener("updatefound", () => {
      const installing = registration.installing;
      if (!installing) return;
      installing.addEventListener("statechange", () => {
        // já existe um SW controlando: a nova versão está pronta para assumir
        if (installing.state === "installed" && navigator.serviceWorker.controller) {
          showUpdateBanner(registration);
        }
      });
    });

    // procura versão nova ao abrir e a cada 30 minutos
    registration.update().catch(() => {});
    setInterval(() => registration.update().catch(() => {}), 30 * 60 * 1000);
  }).catch(() => {});

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      swRegistration?.update().catch(() => {});
      refreshOnNewDay();
    }
  });

  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });
}

function showUpdateBanner(registration) {
  if ($("#updateBanner")) return;
  const banner = el("div", { class: "update-banner", id: "updateBanner" });
  banner.innerHTML = `<span style="color:var(--accent)">${icon("sparkle", 17)}</span><span>Nova versão disponível</span>`;
  const apply = el("button", { class: "btn btn-primary btn-sm", text: "Atualizar" });
  const later = el("button", { class: "btn btn-ghost btn-icon btn-sm", html: icon("x", 15), "aria-label": "Depois" });
  apply.addEventListener("click", () => {
    commitNow();
    registration.waiting?.postMessage({ type: "SKIP_WAITING" });
    apply.disabled = true;
    apply.textContent = "Atualizando…";
    setTimeout(() => location.reload(), 1200);
  });
  later.addEventListener("click", () => banner.remove());
  banner.append(apply, later);
  document.body.append(banner);
}

async function checkForUpdate(verbose = false) {
  const status = $("#swStatus");
  if (!swRegistration) {
    if (verbose) toast("Atualização automática indisponível neste modo de abertura.", "info", 5000);
    if (status) status.textContent = "Rodando sem cache offline (arquivo local ou navegador sem suporte).";
    return;
  }
  if (status) status.textContent = "Procurando…";
  try {
    await swRegistration.update();
    if (swRegistration.waiting) {
      showUpdateBanner(swRegistration);
      if (verbose) toast("Nova versão encontrada!", "ok");
    } else if (verbose) {
      toast(`Você já está na versão mais recente (build ${APP.build}).`, "info", 5000);
    }
    if (status) status.textContent = `Última verificação: agora · versão ${APP.version}`;
  } catch {
    if (verbose) toast("Não consegui verificar agora. Tente com internet.", "err");
  }
}

/**
 * Descarta todo o cache do app e recarrega buscando do servidor.
 * Saída de emergência para quando o navegador insiste na cópia antiga.
 * Os dados do usuário ficam no localStorage e não são tocados.
 */
async function forceUpdate() {
  const ok = await confirmDialog({
    title: "Forçar atualização",
    message: "Vou apagar o cache do aplicativo e recarregar buscando a versão mais recente do servidor."
      + "<br><br><b>Seus lançamentos não serão afetados.</b>",
    confirmLabel: "Atualizar agora", iconName: "refresh",
  });
  if (!ok) return;

  commitNow();
  toast("Limpando cache…", "info");
  try {
    const registrations = await navigator.serviceWorker?.getRegistrations?.() || [];
    await Promise.all(registrations.map((r) => r.unregister()));
    const keys = await caches?.keys?.() || [];
    await Promise.all(keys.map((key) => caches.delete(key)));
  } catch {}
  // a query obriga o navegador a ignorar a própria cópia em cache do HTML
  location.replace(`${location.pathname}?v=${Date.now()}${location.hash}`);
}

/** Recarrega o painel quando o app fica aberto e o dia vira. */
let lastSeenDay = todayKey();
function refreshOnNewDay() {
  const today = todayKey();
  if (today === lastSeenDay) return;
  lastSeenDay = today;
  if (!state.user) return;
  const created = materializeRecurring();
  if (monthKey(today) !== monthKey(lastSeenDay)) state.month = thisMonth();
  invalidate();
  commit();
  if (created) toast(`${created} lançamento(s) recorrente(s) programado(s)`, "info");
}
setInterval(refreshOnNewDay, 60 * 1000);

/* ---------- instalação da PWA ---------- */
window.addEventListener("beforeinstallprompt", (event) => {

  deferredInstall = event;
});

async function promptInstall() {

  if (deferredInstall) {

    return;

    body: `<div class="col gap-14 f-13 muted" style="line-height:1.65">

        <ol style="padding-left:18px;list-style:decimal">

/* --------------------------------------------------------------------------
   Boot
   -------------------------------------------------------------------------- */
function boot() {
  applyPreferences();
  bindChartTips();
  setupUpdates();

  if (!canStore) {
    document.body.innerHTML = `
      <div style="min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center">
        <div style="max-width:420px">
          ${logoLockup(48)}
          <h1 class="display f-20 mt-24 mb-8">Armazenamento bloqueado</h1>
          <p class="f-14 muted" style="line-height:1.6">
            Este navegador está impedindo o app de salvar dados — normalmente por causa da navegação
            anônima ou de bloqueio de cookies. Abra em uma janela normal para usar o ${esc(APP.name)}.
          </p>
        </div>
      </div>`;
    return;
  }

  bindAuthActions();

  const saved = session.read();
  const user = saved?.remember ? findUser(saved.userId) : null;

  if (user) {
    // sessão lembrada: entra direto
    state.user = user;
    state.db = loadDb(user.id);
    setCurrency(state.db.profile.currency);
    setLocale(state.db.profile.locale);
    document.documentElement.lang = state.db.profile.locale;
    materializeRecurring();
    commitNow();
    invalidate();

    const hash = location.hash.replace("#", "");
    if (navItem(hash) && ALL_NAV.some((i) => i.key === hash)) state.page = hash;

    renderShell();
  } else {
    renderAuth();
  }

  // grava antes de fechar a aba
  window.addEventListener("pagehide", commitNow);
  window.addEventListener("beforeunload", commitNow);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}


window.addEventListener('load', function () {
  setTimeout(function () {
    var boot = document.getElementById('boot');
    if (boot) { boot.classList.add('done'); setTimeout(function () { boot.remove(); }, 350); }
  }, 60);
});
</script>
</body>
</html>
