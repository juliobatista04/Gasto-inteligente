  if (index >= 0) list.splice(index, 1);
}

/* ---------- lançamentos ---------- */

/**
 * Cria um lançamento. Se `installments > 1`, gera a série completa
 * amarrada por `groupId`, distribuindo centavos residuais na 1ª parcela.
 */
function addTransaction(input) {
  const installments = Math.max(1, Number(input.installments) || 1);
  const total = round2(Math.abs(input.amount));

  if (installments === 1) {
    const tx = normalizeTx({ ...input, amount: total });
    db().transactions.push(tx);
    return [tx];
  }

  const groupId = uid("grp");
  const each = Math.floor((total / installments) * 100) / 100;
  const residue = round2(total - each * installments);
  const created = [];
  for (let i = 0; i < installments; i++) {
    const due = shiftMonthKeepingDay(input.date, i);
    created.push(normalizeTx({
      ...input,
      amount: round2(i === 0 ? each + residue : each),
      date: due,
      installment: { index: i + 1, of: installments, groupId, total },
      paid: i === 0 ? input.paid !== false : false,
    }));
  }
  db().transactions.push(...created);
  return created;
}

/** Avança N meses preservando o dia (28 → 28; 31 → último dia do mês). */
function shiftMonthKeepingDay(dateKey, months) {
  const day = Number(String(dateKey).slice(8, 10));
  return dayInMonth(addMonths(monthKey(dateKey), months), day);
}

function normalizeTx(input) {
  return {
    id: input.id || uid("tx"),
    type: input.type === "income" ? "income" : input.type === "transfer" ? "transfer" : "expense",
    amount: round2(Math.abs(Number(input.amount) || 0)),
    date: input.date || todayKey(),
    description: String(input.description || "").trim(),
    categoryId: input.categoryId || null,
    accountId: input.accountId || null,
    toAccountId: input.toAccountId || null,
    toName: (input.toName || "").trim() || null,
    cardId: input.cardId || null,
    goalId: input.goalId || null,
    method: input.method || null,
    paid: input.paid !== false,
    installment: input.installment || null,
    recurringId: input.recurringId || null,
    tags: Array.isArray(input.tags) ? input.tags : [],
    notes: String(input.notes || ""),
    createdAt: input.createdAt || new Date().toISOString(),
    updatedAt: input.updatedAt || new Date().toISOString(),
  };
}

function updateTransaction(id, patch, scope = "one") {
  const list = db().transactions;
  const target = findById(list, id);
  if (!target) return;
  const groupId = target.installment?.groupId;

  if (scope === "one" || !groupId) {
    Object.assign(target, patch, { updatedAt: stamp() });
    if (patch.amount !== undefined) target.amount = round2(Math.abs(patch.amount));
    return;
  }
  const siblings = list.filter((tx) => tx.installment?.groupId === groupId);
  const affected = scope === "future"
    ? siblings.filter((tx) => tx.installment.index >= target.installment.index)
    : siblings;
  for (const tx of affected) {
    const { amount, date, installments, ...rest } = patch;
    Object.assign(tx, rest, { updatedAt: stamp() });
    if (amount !== undefined) tx.amount = round2(Math.abs(amount));
  }
}

function deleteTransaction(id, scope = "one") {
  const list = db().transactions;
  const target = findById(list, id);
  if (!target) return 0;
  const groupId = target.installment?.groupId;

  if (scope === "one" || !groupId) {
    removeFrom("transactions", id);
    return 1;
  }
  const doomed = list.filter((tx) =>
    tx.installment?.groupId === groupId &&
    (scope === "all" || tx.installment.index >= target.installment.index));
  db().transactions = list.filter((tx) => !doomed.includes(tx));
  return doomed.length;
}

/* ==========================================================================
   Recorrências — materialização automática
   ========================================================================== */

const FREQUENCIES = {
  weekly:    { label: "Semanal",     step: (key) => addDays(key, 7) },
  biweekly:  { label: "Quinzenal",   step: (key) => addDays(key, 14) },
  monthly:   { label: "Mensal",      step: (key, r) => dayInMonth(addMonths(monthKey(key), 1), r.day) },
  bimonthly: { label: "Bimestral",   step: (key, r) => dayInMonth(addMonths(monthKey(key), 2), r.day) },
  quarterly: { label: "Trimestral",  step: (key, r) => dayInMonth(addMonths(monthKey(key), 3), r.day) },
  semiannual:{ label: "Semestral",   step: (key, r) => dayInMonth(addMonths(monthKey(key), 6), r.day) },
  yearly:    { label: "Anual",       step: (key, r) => dayInMonth(addMonths(monthKey(key), 12), r.day) },
};

/**
 * Gera os lançamentos de todas as recorrências ativas até `horizon`.
 * Idempotente: usa a marca `recurringId + date` para nunca duplicar.
 * É isto que faz o app "se atualizar" sozinho a cada abertura.
 */
function materializeRecurring({ horizonDays = 62 } = {}) {
  const database = db();
  if (!database) return 0;
  const limit = addDays(todayKey(), horizonDays);
  const existing = new Set(
    database.transactions.filter((tx) => tx.recurringId).map((tx) => `${tx.recurringId}|${tx.date}`)
  );
  let created = 0;

  for (const rule of database.recurring) {
    if (!rule.active) continue;
    const freq = FREQUENCIES[rule.frequency] || FREQUENCIES.monthly;
    let cursor = rule.startDate;
    let guard = 0;

    while (cursor <= limit && guard++ < 600) {
      const stopped = rule.endDate && cursor > rule.endDate;
      const capped = rule.occurrences && created >= 0 && countOccurrences(database, rule.id) >= rule.occurrences;
      if (stopped || capped) break;

      const stamp = `${rule.id}|${cursor}`;
      if (!existing.has(stamp) && cursor >= rule.startDate) {
        database.transactions.push(normalizeTx({
          type: rule.type,
          amount: rule.amount,
          date: cursor,
          description: rule.description,
          categoryId: rule.categoryId,
          accountId: rule.accountId,
          cardId: rule.cardId,
          notes: rule.notes,
          tags: rule.tags,
          recurringId: rule.id,
          // já venceu = considerado pago se a regra for de débito automático
          paid: cursor <= todayKey() ? rule.autoPay !== false : false,
        }));
        existing.add(stamp);
        created++;
      }
      const next = freq.step(cursor, rule);
      if (next <= cursor) break; // trava de segurança contra loop infinito
      cursor = next;
    }
  }
  database.meta.recurringRunAt = new Date().toISOString();
  return created;
}

const countOccurrences = (database, ruleId) =>
  database.transactions.filter((tx) => tx.recurringId === ruleId).length;

/** Remove os lançamentos futuros ainda não pagos de uma regra. */
function detachRecurring(ruleId, { keepPast = true } = {}) {
  const today = todayKey();
  db().transactions = db().transactions.filter((tx) => {
    if (tx.recurringId !== ruleId) return true;
    if (keepPast && tx.date <= today && tx.paid) return true;
    return false;
  });
}

/* ==========================================================================
   Cálculos — memoizados por assinatura do banco
   ========================================================================== */

/*
 * Transferência tem dois significados bem diferentes:
 *   · entre contas suas  — o dinheiro continua com você, não é gasto
 *   · para outra pessoa  — o dinheiro foi embora, conta como gasto
 * Estas três funções são a única fonte de verdade sobre isso; todo cálculo
 * de despesa passa por `isOutflow` para os dois casos nunca divergirem.
 */
const isInternalTransfer = (tx) => tx.type === "transfer" && !!tx.toAccountId;
const isExternalTransfer = (tx) => tx.type === "transfer" && !tx.toAccountId;
const isOutflow = (tx) => tx.type === "expense" || isExternalTransfer(tx);

/** Para quem você já transferiu — alimenta as sugestões do formulário. */
function transferNames() {
  const seen = new Map();
  for (const tx of db().transactions) {
    if (!tx.toName) continue;
    const key = normalize(tx.toName);
    const entry = seen.get(key);
    if (!entry || tx.date > entry.date) seen.set(key, { name: tx.toName, date: tx.date, count: (entry?.count || 0) + 1 });
    else entry.count++;
  }
  return [...seen.values()].sort((a, b) => (b.count - a.count) || b.date.localeCompare(a.date));
}

let cacheToken = 0;
const memo = new Map();
const invalidate = () => { cacheToken++; memo.clear(); };

function cached(key, compute) {
  const full = `${cacheToken}|${key}`;
  if (!memo.has(full)) memo.set(full, compute());
  return memo.get(full);
}

/** Lançamentos do mês (exclui transferências dos totais de receita/despesa). */
function txOfMonth(monthStr) {
  return cached(`month:${monthStr}`, () =>
    db().transactions.filter((tx) => monthKey(tx.date) === monthStr)
      .sort((a, b) => (a.date === b.date ? (b.createdAt || "").localeCompare(a.createdAt || "") : b.date.localeCompare(a.date))));
}

function txBetween(from, to) {
  return db().transactions.filter((tx) => inRange(tx.date, from, to));
}

/** Resumo financeiro de um mês. */
function monthSummary(monthStr) {
  return cached(`sum:${monthStr}`, () => {
    const list = txOfMonth(monthStr);
    const income = sum(list.filter((tx) => tx.type === "income"), (tx) => tx.amount);
    const expense = sum(list.filter(isOutflow), (tx) => tx.amount);
    const paidExpense = sum(list.filter((tx) => isOutflow(tx) && tx.paid), (tx) => tx.amount);
    const receivedIncome = sum(list.filter((tx) => tx.type === "income" && tx.paid), (tx) => tx.amount);
    const pendingExpense = round2(expense - paidExpense);
    const pendingIncome = round2(income - receivedIncome);
    const essentialIds = new Set(db().categories.filter((c) => c.essential).map((c) => c.id));
    const essential = sum(list.filter((tx) => isOutflow(tx) && essentialIds.has(tx.categoryId)), (tx) => tx.amount);
    return {
      month: monthStr, income, expense, balance: round2(income - expense),
      paidExpense, receivedIncome, pendingExpense, pendingIncome,
      essential, discretionary: round2(expense - essential),
      savingsRate: income > 0 ? clamp(((income - expense) / income) * 100, -999, 100) : 0,
      count: list.length,
    };
  });
}

/** Saldo consolidado das contas até a data (inclui apenas o que foi pago). */
function accountBalance(accountId, untilKey = todayKey()) {
  const account = accById(accountId);
  if (!account) return 0;
  let total = Number(account.openingBalance) || 0;
  for (const tx of db().transactions) {
    if (!tx.paid || tx.date > untilKey) continue;
    if (tx.type === "transfer") {
      if (tx.accountId === accountId) total -= tx.amount;
      if (tx.toAccountId === accountId) total += tx.amount;
      continue;
    }
    if (tx.accountId !== accountId || tx.cardId) continue;
    total += tx.type === "income" ? tx.amount : -tx.amount;
  }
  return round2(total);
}

const totalBalance = (untilKey = todayKey()) =>
  cached(`bal:${untilKey}`, () => round2(sum(activeAccounts(), (a) => accountBalance(a.id, untilKey))));

/**
 * Fatura de um cartão: gastos entre o fechamento anterior e o atual.
 * `monthStr` identifica o mês de vencimento da fatura.
 */
function cardInvoice(cardId, monthStr) {
  const card = cardById(cardId);
  if (!card) return { total: 0, items: [], dueDate: null, closeDate: null };
  const closingDay = Number(card.closingDay) || 1;
  const dueDay = Number(card.dueDay) || 10;
  // fatura que vence em `monthStr` fecha no mês anterior se o vencimento vier antes do fechamento
  const closeMonth = dueDay > closingDay ? monthStr : addMonths(monthStr, -1);
  const closeDate = dayInMonth(closeMonth, closingDay);
  const prevClose = dayInMonth(addMonths(closeMonth, -1), closingDay);
  const items = db().transactions.filter((tx) =>
    tx.cardId === cardId && tx.type === "expense" && tx.date > prevClose && tx.date <= closeDate);
  return {
    total: round2(sum(items, (tx) => tx.amount)),
    items: items.sort((a, b) => b.date.localeCompare(a.date)),
    dueDate: dayInMonth(monthStr, dueDay),
    closeDate,
    paid: items.length > 0 && items.every((tx) => tx.paid),
  };
}

/** Limite usado hoje: tudo que ainda não foi pago no cartão. */
function cardUsage(cardId) {
  const open = db().transactions.filter((tx) => tx.cardId === cardId && tx.type === "expense" && !tx.paid);
  return round2(sum(open, (tx) => tx.amount));
}

/** Gastos por categoria no período, ordenados do maior para o menor. */
function byCategory(list, kind = "expense") {
  const totals = new Map();
  const matches = kind === "expense" ? isOutflow : (tx) => tx.type === kind;
  for (const tx of list) {
    if (!matches(tx)) continue;
    // dinheiro guardado em meta não é "sem categoria": aparece com o nome da meta
    const key = tx.goalId ? `goal:${tx.goalId}`
      : tx.categoryId || (isExternalTransfer(tx) ? "transfer" : "none");
    totals.set(key, round2((totals.get(key) || 0) + tx.amount));
  }
  const grand = sum([...totals.values()]);
  return [...totals.entries()]
    .map(([id, value]) => {
      const isGoal = id.startsWith("goal:");
      const goal = isGoal ? goalById(id.slice(5)) : null;
      const isTransfer = id === "transfer";
      const source = isGoal ? goal : (id === "none" || isTransfer ? null : catById(id));
      return {
        id,
        name: source?.name || (isGoal ? "Meta removida" : isTransfer ? "Transferências" : "Sem categoria"),
        emoji: source?.emoji || (isTransfer ? "🔁" : "📦"),
        color: source?.color || (isTransfer ? "#2E7CF6" : "#64748B"),
        value,
        share: grand > 0 ? (value / grand) * 100 : 0,
      };
    })
    .sort((a, b) => b.value - a.value);
}

/** Totais por forma de pagamento no período, do maior para o menor. */
function byMethod(list, kind = "expense") {
  const totals = new Map();
  const matches = kind === "expense" ? isOutflow : (tx) => tx.type === kind;
  for (const tx of list) {
    if (!matches(tx) || !tx.method) continue;
    totals.set(tx.method, round2((totals.get(tx.method) || 0) + tx.amount));
  }
  const grand = sum([...totals.values()]);
  return [...totals.entries()]
    .map(([id, value]) => ({
      id,
      name: methodLabel(id),
      color: methodById(id)?.color || "#64748B",
      icon: methodById(id)?.icon || "wallet",
      value,
      share: grand > 0 ? (value / grand) * 100 : 0,
    }))
    .sort((a, b) => b.value - a.value);
}

/** Série mensal dos últimos N meses terminando em `endMonth`. */
function monthlySeries(endMonth, count = 6) {
  return cached(`series:${endMonth}:${count}`, () =>
    Array.from({ length: count }, (_, i) => monthSummary(addMonths(endMonth, i - count + 1))));
}

/** Orçamento efetivo de uma categoria no mês (específico do mês, senão o padrão). */
function budgetFor(categoryId, monthStr) {
  const list = db().budgets.filter((b) => b.categoryId === categoryId);
  return list.find((b) => b.month === monthStr) || list.find((b) => !b.month) || null;
}

function budgetStatus(monthStr) {
  return cached(`budgets:${monthStr}`, () => {
    const spent = new Map();
    for (const tx of txOfMonth(monthStr)) {
      if (!isOutflow(tx) || !tx.categoryId) continue;
      spent.set(tx.categoryId, round2((spent.get(tx.categoryId) || 0) + tx.amount));
    }
    const seen = new Set();
    const rows = [];
    for (const budget of db().budgets) {
      if (budget.month && budget.month !== monthStr) continue;
      if (seen.has(budget.categoryId)) continue;
      const effective = budgetFor(budget.categoryId, monthStr);
      if (!effective) continue;
      seen.add(budget.categoryId);
      const category = catById(budget.categoryId);
      if (!category) continue;
      const used = spent.get(budget.categoryId) || 0;
      rows.push({
        id: effective.id, categoryId: budget.categoryId, category,
        limit: effective.amount, used, left: round2(effective.amount - used),
        share: pct(used, effective.amount),
        over: used > effective.amount,
      });
    }
    return rows.sort((a, b) => b.share - a.share);
  });
}

/** Progresso de metas: reserva guardada por meta. */
function goalProgress(goalId) {
  const goal = goalById(goalId);
  if (!goal) return { saved: 0, share: 0 };
  const moves = db().transactions.filter((tx) => tx.goalId === goalId && tx.paid);
  const saved = round2(sum(moves, (tx) => (tx.type === "income" ? -tx.amount : tx.amount)));
  return {
    saved, share: pct(saved, goal.target),
    left: round2(Math.max(0, goal.target - saved)),
    done: saved >= goal.target,
  };
}

const totalSaved = () => round2(sum(db().goals, (g) => goalProgress(g.id).saved));

/**
 * Score de saúde financeira (0–100), média ponderada de cinco sinais.
 * Cada sinal é normalizado para 0–100 antes da ponderação.
 */
function healthScore(monthStr) {
  return cached(`score:${monthStr}`, () => {
    const now = monthSummary(monthStr);
    const series = monthlySeries(monthStr, 6).filter((m) => m.count > 0);
    const parts = [];

    // 1. taxa de poupança (peso 30)
    parts.push({ key: "poupança", weight: 30, value: clamp((now.savingsRate / 25) * 100, 0, 100),
      hint: `Você guardou ${pctText(Math.max(0, now.savingsRate))} da renda` });

    // 2. despesas essenciais sob controle (peso 20) — ideal até 55% da renda
    const essentialShare = now.income > 0 ? (now.essential / now.income) * 100 : 100;
    parts.push({ key: "essenciais", weight: 20, value: clamp(100 - (essentialShare - 55) * 2.2, 0, 100),
      hint: `Essenciais consomem ${pctText(essentialShare)} da renda` });

    // 3. constância: meses no azul entre os últimos com dados (peso 20)
    const positives = series.filter((m) => m.balance >= 0).length;
    parts.push({ key: "constância", weight: 20, value: series.length ? (positives / series.length) * 100 : 50,
      hint: `${positives} de ${series.length || 0} meses no azul` });

    // 4. orçamentos respeitados (peso 15)
    const budgets = budgetStatus(monthStr);
    const within = budgets.filter((b) => !b.over).length;
    parts.push({ key: "orçamentos", weight: 15, value: budgets.length ? (within / budgets.length) * 100 : 60,
      hint: budgets.length ? `${within} de ${budgets.length} dentro do limite` : "Defina orçamentos para pontuar" });

    // 5. reserva de emergência (peso 15) — meta: 6 meses de despesa média
    const avgExpense = series.length ? sum(series, (m) => m.expense) / series.length : now.expense;
    const months = avgExpense > 0 ? totalSaved() / avgExpense : 0;
    parts.push({ key: "reserva", weight: 15, value: clamp((months / 6) * 100, 0, 100),
      hint: months > 0 ? `Reserva cobre ${num(months, 1)} meses` : "Sem reserva registrada" });

    const total = Math.round(sum(parts, (p) => (p.value * p.weight) / 100));
    const grade =
      total >= 85 ? { label: "Excelente", tone: "pos" } :
      total >= 70 ? { label: "Bom", tone: "pos" } :
      total >= 50 ? { label: "Atenção", tone: "warnc" } :
      { label: "Crítico", tone: "neg" };
    return { total: clamp(total, 0, 100), grade, parts };
  });
}

/** Projeção do saldo até o fim do mês, considerando o que ainda vai cair. */
function forecast(monthStr) {
  const { to } = monthRange(monthStr);
  const summary = monthSummary(monthStr);
  const remaining = Math.max(0, diffDays(to, todayKey()) + 1);
  const dayOfMonth = monthStr === thisMonth() ? Number(todayKey().slice(8)) : daysInMonth(monthStr);
  const burn = dayOfMonth > 0 ? summary.paidExpense / dayOfMonth : 0;
  const projectedExpense = round2(summary.expense + (monthStr === thisMonth() ? burn * remaining * 0.35 : 0));
  return {
    remaining, dailyBurn: round2(burn),
    projectedExpense,
    projectedBalance: round2(summary.income - projectedExpense),
    safeDaily: remaining > 0 ? round2(Math.max(0, summary.income - summary.expense) / remaining) : 0,
  };
}

/** Contas a pagar/receber nos próximos dias. */
function upcoming(days = 14) {
  const from = todayKey();
  const to = addDays(from, days);
  return db().transactions
    .filter((tx) => !tx.paid && !isInternalTransfer(tx) && inRange(tx.date, addDays(from, -60), to))
    .sort((a, b) => a.date.localeCompare(b.date));
}

/** Alertas acionáveis mostrados no sino e no painel. */
function alerts(monthStr) {
  const out = [];
  const database = db();
  if (!database.profile.alertsEnabled) return out;

  const late = upcoming(0).filter((tx) => tx.date < todayKey());
  if (late.length) {
    out.push({ tone: "err", icon: "alert", title: `${late.length} conta${late.length > 1 ? "s" : ""} em atraso`,
      text: `Total de ${money(sum(late, (tx) => tx.amount))} vencido.`, page: "transactions", filter: { status: "late" } });
  }
  const soon = upcoming(7).filter((tx) => tx.date >= todayKey());
  if (soon.length) {
    out.push({ tone: "warn", icon: "clock", title: `${soon.length} vencimento${soon.length > 1 ? "s" : ""} em 7 dias`,
      text: `${money(sum(soon, (tx) => tx.amount))} programado.`, page: "transactions", filter: { status: "pending" } });
  }
  for (const row of budgetStatus(monthStr)) {
    if (row.over) {
      out.push({ tone: "err", icon: "target", title: `Orçamento de ${row.category.name} estourou`,
        text: `${money(row.used)} de ${money(row.limit)}.`, page: "budgets" });
    } else if (row.share >= (database.profile.overspendAlert || 85)) {
      out.push({ tone: "warn", icon: "target", title: `${row.category.name} em ${pctText(row.share)} do orçamento`,
        text: `Restam ${money(row.left)}.`, page: "budgets" });
    }
  }
  for (const card of activeCards()) {
    if (!card.limit) continue;
    const used = cardUsage(card.id);
    if (used / card.limit >= 0.8) {
      out.push({ tone: "warn", icon: "card", title: `${card.name} em ${pctText(pct(used, card.limit))} do limite`,
        text: `${money(used)} de ${money(card.limit)}.`, page: "wallets" });
    }
  }
  const summary = monthSummary(monthStr);
  if (summary.income > 0 && summary.balance < 0) {
    out.push({ tone: "err", icon: "trendDown", title: "Mês no vermelho",
      text: `Você gastou ${money(Math.abs(summary.balance))} a mais do que recebeu.`, page: "reports" });
  }
  return out;
}

/* ==========================================================================
   Backup — exportar / importar
   ========================================================================== */

function exportPayload({ allUsers = false } = {}) {
  const users = allUsers ? getUsers() : [state.user];
  return {
    app: APP.ns,
    appName: APP.name,
    version: APP.version,
    exportedAt: new Date().toISOString(),
    users: users.map((u) => ({ ...u })),
    data: Object.fromEntries(users.map((u) => [u.id, u.id === state.user?.id ? state.db : loadDb(u.id)])),
  };
}

function validateBackup(payload) {
  if (!payload || typeof payload !== "object") throw new Error("Arquivo inválido.");
  if (payload.app !== APP.ns && !payload.users) throw new Error("Este backup não é do Gasto Esperto.");
  if (!Array.isArray(payload.users) || !payload.users.length) throw new Error("Backup sem perfis.");
  if (!payload.data || typeof payload.data !== "object") throw new Error("Backup sem dados.");
  return {
    users: payload.users.length,
    transactions: sum(Object.values(payload.data), (d) => (d.transactions || []).length),
    exportedAt: payload.exportedAt,
  };
}

/**
 * Junta duas bases do mesmo perfil, registro a registro.
 *
 * Une pelos ids: o que existe só de um lado entra, o que existe nos dois é
 * resolvido pelo carimbo `updatedAt` mais recente. É o que permite lançar no
 * celular e no computador sem que restaurar um backup apague o trabalho do
 * outro aparelho — antes disso, restaurar substituía a base inteira.
 *
 * Limite honesto: sem registro de exclusões, um item apagado num aparelho
 * volta ao mesclar com um backup anterior à exclusão. Apagar de novo resolve.
 */
function mergeDatabases(current, incoming) {
  const out = migrate({ ...current });
  const COLECOES = ["transactions", "accounts", "cards", "categories", "recurring", "budgets", "goals"];
  const relatorio = { novos: 0, atualizados: 0, mantidos: 0 };

  for (const colecao of COLECOES) {
    const porId = new Map((out[colecao] || []).map((r) => [r.id, r]));
    for (const chegando of incoming[colecao] || []) {
      const atual = porId.get(chegando.id);
      if (!atual) {
        porId.set(chegando.id, chegando);
        relatorio.novos++;
      } else if ((chegando.updatedAt || "") > (atual.updatedAt || "")) {
        porId.set(chegando.id, chegando);
        relatorio.atualizados++;
      } else {
        relatorio.mantidos++;
      }
    }
    out[colecao] = [...porId.values()];
  }
  // preferências ficam com o aparelho que está recebendo
  out.profile = { ...incoming.profile, ...current.profile };
  return { base: out, relatorio };
}

/** `mode`: "join" mescla registro a registro; "merge" e "replace" substituem. */
function importBackup(payload, mode = "merge") {
  validateBackup(payload);
  const current = getUsers();
  const incoming = payload.users;

  if (mode === "replace") {
    for (const user of current) store.remove(KEYS.data(user.id));
    saveUsers(incoming);
    for (const user of incoming) store.set(KEYS.data(user.id), migrate(payload.data[user.id] || seedDatabase(user)));
    return { users: incoming.length, mode };
  }

  if (mode === "join") {
    const merged = [...current];
    const total = { novos: 0, atualizados: 0, mantidos: 0 };
    for (const user of incoming) {
      // casa por id ou por nome: o mesmo perfil em dois aparelhos costuma
      // ter ids diferentes, já que cada um foi criado localmente
      const clash = merged.find((u) => u.id === user.id || normalize(u.name) === normalize(user.name));
      if (!clash) {
        merged.push(user);
        store.set(KEYS.data(user.id), migrate(payload.data[user.id] || seedDatabase(user)));
        continue;
      }
      const { base, relatorio } = mergeDatabases(loadDb(clash.id), migrate(payload.data[user.id] || seedDatabase(user)));
      store.set(KEYS.data(clash.id), base);
      for (const chave of Object.keys(total)) total[chave] += relatorio[chave];
    }
    saveUsers(merged);
    return { users: incoming.length, mode, ...total };
  }

  // "merge": substitui os dados do perfil correspondente. O mesmo perfil em
  // dois aparelhos tem ids diferentes (cada um foi criado localmente), então
  // o pareamento é por id OU por nome — senão nunca casaria e o resultado
  // seria um perfil duplicado, que não é o que o botão promete.
  const merged = [...current];
  for (const user of incoming) {
    const clash = merged.find((u) => u.id === user.id || normalize(u.name) === normalize(user.name));
    const targetId = clash ? clash.id : user.id;
    if (clash) Object.assign(clash, user, { id: clash.id, name: clash.name });
    else merged.push(user);
    store.set(KEYS.data(targetId), migrate(payload.data[user.id] || seedDatabase(user)));
  }
  saveUsers(merged);
  return { users: incoming.length, mode };
}

/* ---------- CSV ---------- */

function toCsv(rows) {
  const cell = (value) => {
    const text = String(value ?? "");
    return /[";\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
  };
  return rows.map((row) => row.map(cell).join(";")).join("\r\n");
}

function transactionsToCsv(list) {
  const head = ["Data", "Tipo", "Descrição", "Categoria", "Conta", "Destino", "Cartão", "Pagamento", "Valor", "Pago", "Parcela", "Observações"];
  const body = list.map((tx) => [
    tx.date,
    tx.type === "income" ? "Receita"
      : isExternalTransfer(tx) ? "Transferência enviada"
      : tx.type === "transfer" ? "Transferência entre contas" : "Despesa",
    tx.description,
    catById(tx.categoryId)?.name || "",
    accById(tx.accountId)?.name || "",
    tx.toName || accById(tx.toAccountId)?.name || "",
    cardById(tx.cardId)?.name || "",
    methodLabel(tx.method) || "",
    (isOutflow(tx) ? -tx.amount : tx.amount).toFixed(2).replace(".", ","),
    tx.paid ? "Sim" : "Não",
    tx.installment ? `${tx.installment.index}/${tx.installment.of}` : "",
    tx.notes || "",
  ]);
  return "﻿" + toCsv([head, ...body]);
}

/** Divide uma linha de CSV respeitando aspas. */
function splitCsvLine(line, sep) {
  const out = [];
  let field = "";
  let quoted = false;
  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    if (quoted) {
      if (char === '"' && line[i + 1] === '"') { field += '"'; i++; }
      else if (char === '"') quoted = false;
      else field += char;
    } else if (char === '"') quoted = true;
    else if (char === sep) { out.push(field); field = ""; }
    else field += char;
  }
  out.push(field);
  return out.map((f) => f.trim());
}

/** Lê um CSV genérico e devolve { headers, rows }. Detecta ; , ou tab. */
function parseCsv(text) {
  const clean = String(text).replace(/^﻿/, "").replace(/\r\n?/g, "\n").trim();
  const lines = clean.split("\n").filter((l) => l.trim());
  if (!lines.length) return { headers: [], rows: [] };
  const sep = [";", ",", "\t"]
    .map((s) => ({ s, n: (lines[0].match(new RegExp(`\\${s}`, "g")) || []).length }))
    .sort((a, b) => b.n - a.n)[0].s;
  const headers = splitCsvLine(lines[0], sep);
  const rows = lines.slice(1).map((line) => splitCsvLine(line, sep));
  return { headers, rows, sep };
}

/** Reconhece uma data em vários formatos comuns e devolve "yyyy-mm-dd". */
function parseDateLoose(text) {
  const raw = String(text || "").trim();
  if (!raw) return null;
  let m = raw.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = raw.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);
  if (m) {
    const year = m[3].length === 2 ? `20${m[3]}` : m[3];
    // dd/mm/yyyy é o padrão em pt/es; en-US usa mm/dd
    const [a, b] = currentLocale === "en-US" ? [m[2], m[1]] : [m[1], m[2]];
    return `${year}-${pad2(b)}-${pad2(a)}`;
  }
  const parsed = new Date(raw);
  return Number.isNaN(parsed.getTime()) ? null : toKey(parsed);
}


/* ===== 04-charts.js ===== */
/* ==========================================================================
   04 — gráficos em SVG puro
   Todos os renderizadores devolvem string de HTML e usam `data-tip` para
   alimentar um único tooltip global (ver bindChartTips).
   ========================================================================== */

const CHART = {
  grid: "var(--border)",
  axis: "var(--faint)",
  label: "var(--muted)",
};

/** Escala linear simples domínio -> intervalo. */
const scale = (value, dMin, dMax, rMin, rMax) =>
  dMax === dMin ? rMin : rMin + ((value - dMin) / (dMax - dMin)) * (rMax - rMin);

/** Escolhe uma "boa" marca de eixo (1, 2, 2.5 ou 5 x 10^n). */
function niceStep(range, targetTicks = 4) {
  if (range <= 0) return 1;
  const rough = range / targetTicks;
  const mag = 10 ** Math.floor(Math.log10(rough));
  const norm = rough / mag;
  const step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10;
  return step * mag;
}

/* --------------------------------------------------------------------------
   Rosca (donut) — composição por categoria
   -------------------------------------------------------------------------- */
function donutChart(slices, { size = 190, thickness = 26, center = null, centerSub = "" } = {}) {
  const total = sum(slices, (s) => s.value);
  const radius = (size - thickness) / 2;
  const cx = size / 2;
  const cy = size / 2;
  const circumference = 2 * Math.PI * radius;

  if (!total) {
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Sem dados">
      <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="var(--surface-3)" stroke-width="${thickness}"/>
      <text x="${cx}" y="${cy + 4}" text-anchor="middle" fill="${CHART.axis}" font-size="12">sem dados</text>
    </svg>`;
  }

  let offset = 0;
  const arcs = slices.map((slice, i) => {
    const share = slice.value / total;
    const length = circumference * share;
    // gap de 1.5px entre fatias, sem deixar fatia sumir
    const gap = slices.length > 1 ? Math.min(2, length * 0.06) : 0;
    const dash = `${Math.max(0.6, length - gap)} ${circumference - Math.max(0.6, length - gap)}`;
    const arc = `<circle class="donut-arc" cx="${cx}" cy="${cy}" r="${radius}" fill="none"
      stroke="${slice.color}" stroke-width="${thickness}" stroke-linecap="butt"
      stroke-dasharray="${dash}" stroke-dashoffset="${-offset}"
      transform="rotate(-90 ${cx} ${cy})"
      data-tip="${esc(`${slice.name}|${money(slice.value)} · ${pctText(share * 100, 1)}`)}"
      style="transition:opacity .15s;animation:donutIn .5s ease ${i * 0.05}s both"/>`;
    offset += length;
    return arc;
  }).join("");

  const label = center !== null ? `
    <text x="${cx}" y="${cy - 2}" text-anchor="middle" fill="var(--text)" font-size="${size > 170 ? 17 : 14}" font-weight="800" letter-spacing="-0.5">${esc(center)}</text>
    ${centerSub ? `<text x="${cx}" y="${cy + 15}" text-anchor="middle" fill="${CHART.label}" font-size="10.5" font-weight="600">${esc(centerSub)}</text>` : ""}` : "";

  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Distribuição por categoria">
    <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="var(--surface-3)" stroke-width="${thickness}" opacity=".55"/>
    ${arcs}${label}
  </svg>`;
}

/* --------------------------------------------------------------------------
   Barras agrupadas — receita x despesa por mês
   -------------------------------------------------------------------------- */
function barsChart(series, { height = 220, showAxis = true } = {}) {
  const width = 640;
  const padL = showAxis ? 46 : 8;
  const padR = 8;
  const padT = 12;
  const padB = 26;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;

  const peak = Math.max(1, ...series.flatMap((m) => [m.income, m.expense]));
  const step = niceStep(peak);
  const top = Math.ceil(peak / step) * step;

  const slot = plotW / Math.max(1, series.length);
  const barW = Math.min(20, slot * 0.3);
  const gap = 4;

  const gridLines = Array.from({ length: Math.round(top / step) + 1 }, (_, i) => {
    const value = i * step;
    const y = padT + plotH - (value / top) * plotH;
    return `<line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="${CHART.grid}" stroke-width="1" ${i ? 'stroke-dasharray="2 4"' : ""}/>
      ${showAxis ? `<text x="${padL - 7}" y="${y + 3.5}" text-anchor="end" fill="${CHART.axis}" font-size="9.5">${esc(moneyShort(value))}</text>` : ""}`;
  }).join("");

  const bars = series.map((m, i) => {
    const cx = padL + slot * i + slot / 2;
    const make = (value, color, tint, xOffset, label) => {
      const h = Math.max(value > 0 ? 2 : 0, (value / top) * plotH);
      const x = cx + xOffset;
      const y = padT + plotH - h;
      return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="${Math.min(4, barW / 2)}"
        fill="${color}" opacity=".95"
        data-tip="${esc(`${monthLabel(m.month, true)}|${label}: ${money(value)}`)}"
        style="animation:barIn .45s cubic-bezier(.2,1,.4,1) ${i * 0.04}s both;transform-origin:${x}px ${padT + plotH}px"/>`;
    };
    return make(m.income, "var(--income)", "", -barW - gap / 2, t("income")) +
           make(m.expense, "var(--expense)", "", gap / 2, t("expense")) +
      `<text x="${cx}" y="${height - 8}" text-anchor="middle" fill="${CHART.label}" font-size="9.5" font-weight="600">${esc(monthName(m.month, true))}</text>`;
  }).join("");

  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Receitas e despesas por mês"
    preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;max-height:${height}px">
    ${gridLines}${bars}
  </svg>`;
}

/* --------------------------------------------------------------------------
   Área + linha — evolução do saldo acumulado
   -------------------------------------------------------------------------- */
function areaChart(points, { height = 210, color = "var(--accent)", fill = true, labelEvery = 1, formatY = moneyShort } = {}) {
  const width = 640;
  const padL = 46;
  const padR = 10;
  const padT = 14;
  const padB = 24;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;

  if (points.length < 2) {
    return `<div class="empty" style="padding:28px"><div class="empty-text">Dados insuficientes para o gráfico.</div></div>`;
  }

  const values = points.map((p) => p.value);
  const rawMin = Math.min(...values, 0);
  const rawMax = Math.max(...values, 0);
  const step = niceStep(rawMax - rawMin || Math.abs(rawMax) || 1);
  const min = Math.floor(rawMin / step) * step;
  const max = Math.ceil(rawMax / step) * step || step;

  const px = (i) => padL + (i / (points.length - 1)) * plotW;
  const py = (v) => padT + plotH - scale(v, min, max, 0, plotH);

  const line = points.map((p, i) => `${i ? "L" : "M"}${px(i).toFixed(1)},${py(p.value).toFixed(1)}`).join(" ");
  const zeroY = py(0);
  const area = `${line} L${px(points.length - 1).toFixed(1)},${zeroY.toFixed(1)} L${px(0).toFixed(1)},${zeroY.toFixed(1)} Z`;

  const ticks = Array.from({ length: Math.round((max - min) / step) + 1 }, (_, i) => {
    const value = min + i * step;
    const y = py(value);
    return `<line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="${CHART.grid}" stroke-width="1" ${value === 0 ? "" : 'stroke-dasharray="2 4"'}/>
      <text x="${padL - 7}" y="${y + 3.5}" text-anchor="end" fill="${CHART.axis}" font-size="9.5">${esc(formatY(value))}</text>`;
  }).join("");

  const dots = points.map((p, i) => `<circle cx="${px(i).toFixed(1)}" cy="${py(p.value).toFixed(1)}" r="9" fill="transparent"
      data-tip="${esc(`${p.label}|${money(p.value)}`)}"/>
    <circle cx="${px(i).toFixed(1)}" cy="${py(p.value).toFixed(1)}" r="3" fill="${color}" stroke="var(--surface)" stroke-width="1.6" pointer-events="none"/>`).join("");

  const labels = points.map((p, i) => (i % labelEvery === 0 || i === points.length - 1)
    ? `<text x="${px(i).toFixed(1)}" y="${height - 7}" text-anchor="middle" fill="${CHART.label}" font-size="9.5" font-weight="600">${esc(p.short || p.label)}</text>`
    : "").join("");

  const gradId = `grad${Math.random().toString(36).slice(2, 8)}`;
  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Evolução do saldo"
    preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;max-height:${height}px">
    <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".32"/>
      <stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${ticks}
    ${fill ? `<path d="${area}" fill="url(#${gradId})"/>` : ""}
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
      style="stroke-dasharray:2000;animation:draw 1s ease forwards"/>
    ${dots}${labels}
  </svg>`;
}

/* --------------------------------------------------------------------------
   Sparkline — miniatura sem eixos, para KPIs
   -------------------------------------------------------------------------- */
function sparkline(values, { width = 130, height = 34, color = "var(--accent)", fill = true } = {}) {
  if (!values || values.length < 2) return "";
  const min = Math.min(...values);
  const max = Math.max(...values);
  const px = (i) => (i / (values.length - 1)) * width;
  const py = (v) => height - 3 - scale(v, min, max === min ? min + 1 : max, 0, height - 6);
  const line = values.map((v, i) => `${i ? "L" : "M"}${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
  const gradId = `sp${Math.random().toString(36).slice(2, 8)}`;
  return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true" style="width:100%;height:${height}px">
    <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${fill ? `<path d="${line} L${width},${height} L0,${height} Z" fill="url(#${gradId})"/>` : ""}
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

/* --------------------------------------------------------------------------
   Anel de score
   -------------------------------------------------------------------------- */
function scoreRing(value, { size = 138, thickness = 11, label = "", sub = "" } = {}) {
  const radius = (size - thickness) / 2;
  const circumference = 2 * Math.PI * radius;
  const filled = (clamp(value, 0, 100) / 100) * circumference;
  const tone = value >= 70 ? "var(--income)" : value >= 50 ? "var(--warn)" : "var(--expense)";
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Score ${value} de 100">
    <circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none" stroke="var(--surface-3)" stroke-width="${thickness}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none" stroke="${tone}" stroke-width="${thickness}"
      stroke-linecap="round" stroke-dasharray="${filled} ${circumference}"
      transform="rotate(-90 ${size / 2} ${size / 2})"
      style="transition:stroke-dasharray .9s cubic-bezier(.3,1,.4,1)"/>
    <text x="${size / 2}" y="${size / 2 + 2}" text-anchor="middle" fill="var(--text)" font-size="${size * 0.26}" font-weight="800" letter-spacing="-1.5">${value}</text>
    ${label ? `<text x="${size / 2}" y="${size / 2 + 21}" text-anchor="middle" fill="${tone}" font-size="10.5" font-weight="700">${esc(label)}</text>` : ""}
    ${sub ? `<text x="${size / 2}" y="${size / 2 + 34}" text-anchor="middle" fill="${CHART.label}" font-size="9">${esc(sub)}</text>` : ""}
  </svg>`;
}

/* --------------------------------------------------------------------------
   Barras horizontais — ranking de categorias
   -------------------------------------------------------------------------- */
function rankBars(rows, { max = null, showValue = true } = {}) {
  if (!rows.length) return "";
  const peak = max ?? Math.max(...rows.map((r) => r.value), 1);
  return `<div class="col gap-12">${rows.map((row) => `
    <div data-rank="${esc(row.id || "")}">
      <div class="row-between mb-4">
        <div class="row gap-8" style="min-width:0">
          <span style="font-size:14px;line-height:1">${row.emoji || "•"}</span>
          <span class="f-13 w-600 truncate">${esc(row.name)}</span>
        </div>
        <div class="row gap-8" style="flex:none">
          ${showValue ? `<span class="f-13 w-700 num">${esc(money(row.value))}</span>` : ""}
          <span class="f-11 faint num" style="min-width:34px;text-align:right">${esc(pctText(row.share))}</span>
        </div>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${(row.value / peak) * 100}%;background:${row.color}"></div></div>
    </div>`).join("")}</div>`;
}

/* --------------------------------------------------------------------------
   Mapa de calor por dia — intensidade de gasto no mês
   -------------------------------------------------------------------------- */
function heatCalendar(monthStr, dayTotals) {
  const days = daysInMonth(monthStr);
  const firstWeekday = fromKey(`${monthStr}-01`).getDay();
  const peak = Math.max(1, ...Object.values(dayTotals));
  const names = WEEKDAYS_SHORT[currentLocale];

  const head = names.map((n) => `<div class="center f-11 faint w-700" style="padding:2px 0">${esc(n[0])}</div>`).join("");
  const blanks = Array.from({ length: firstWeekday }, () => `<div></div>`).join("");
  const cells = Array.from({ length: days }, (_, i) => {
    const day = i + 1;
    const key = `${monthStr}-${pad2(day)}`;
    const value = dayTotals[key] || 0;
    const intensity = value > 0 ? 0.18 + (value / peak) * 0.82 : 0;
    const isToday = key === todayKey();
    return `<button class="heat-cell" data-day="${key}"
      data-tip="${esc(`${dateLabel(key)}|${value ? money(value) : "sem gastos"}`)}"
      style="aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:700;
        background:${value ? `color-mix(in srgb, var(--expense) ${intensity * 100}%, var(--surface-2))` : "var(--surface-2)"};
        color:${intensity > 0.55 ? "#fff" : "var(--muted)"};
        border:1px solid ${isToday ? "var(--accent)" : "transparent"}">${day}</button>`;
  }).join("");

  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${head}${blanks}${cells}</div>`;
}

/* --------------------------------------------------------------------------
   Barra empilhada de 1 linha — proporção essencial x supérfluo
   -------------------------------------------------------------------------- */
function stackBar(parts, { height = 10 } = {}) {
  const total = sum(parts, (p) => p.value) || 1;
  return `<div class="row" style="height:${height}px;border-radius:99px;overflow:hidden;background:var(--surface-3);gap:0">
    ${parts.map((p) => `<div data-tip="${esc(`${p.name}|${money(p.value)} · ${pctText((p.value / total) * 100)}`)}"
      style="width:${(p.value / total) * 100}%;height:100%;background:${p.color};transition:width .5s"></div>`).join("")}
  </div>`;
}

/* --------------------------------------------------------------------------
   Tooltip global — um único nó reaproveitado por todos os gráficos
   -------------------------------------------------------------------------- */
let tipNode = null;
function bindChartTips(root = document.body) {
  if (!tipNode) {
    tipNode = el("div", { class: "chart-tip", hidden: true });
    document.body.append(tipNode);
  }
  const show = (event) => {
    const target = event.target.closest("[data-tip]");
    if (!target) return hide();
    const [title, ...lines] = String(target.dataset.tip).split("|");
    tipNode.innerHTML = `<div class="f-11 faint w-700" style="margin-bottom:2px">${esc(title)}</div>
      ${lines.map((l) => `<div class="f-13 w-700 num">${esc(l)}</div>`).join("")}`;
    tipNode.hidden = false;
    const point = event.touches?.[0] || event;
    const box = tipNode.getBoundingClientRect();
    tipNode.style.left = `${clamp(point.clientX, box.width / 2 + 8, window.innerWidth - box.width / 2 - 8)}px`;
    tipNode.style.top = `${Math.max(box.height + 12, point.clientY - 6)}px`;
  };
  const hide = () => { if (tipNode) tipNode.hidden = true; };

  root.addEventListener("pointermove", show);
  root.addEventListener("pointerleave", hide);
  root.addEventListener("pointerdown", (e) => { if (isTouch()) show(e); });
  window.addEventListener("scroll", hide, true);
  window.addEventListener("pointerup", () => { if (isTouch()) setTimeout(hide, 1600); });
}

/* legendas reaproveitáveis */
const legend = (items) => `<div class="legend">${items.map((i) => `
  <span class="legend-item"><span class="legend-swatch" style="background:${i.color}"></span>${esc(i.name)}${i.value !== undefined ? ` <b class="num" style="color:var(--text)">${esc(money(i.value))}</b>` : ""}</span>`).join("")}</div>`;

   05 — componentes de interface: toasts, modais, popover, campos
   ========================================================================== */

/* ---------- toasts ---------- */
let toastHost = null;
function toast(message, tone = "ok", duration = 3200) {
  if (!toastHost) {
    toastHost = el("div", { class: "toasts", role: "status", "aria-live": "polite" });
    document.body.append(toastHost);
  }
  const glyph = { ok: "check", err: "alert", info: "info", warn: "alert" }[tone] || "info";
  const node = el("div", { class: `toast toast-${tone === "warn" ? "err" : tone}` });
  node.innerHTML = `<span style="color:var(--${tone === "ok" ? "income" : tone === "err" || tone === "warn" ? "expense" : "info"})">${icon(glyph, 17)}</span><span class="grow">${esc(message)}</span>`;
  toastHost.append(node);
  setTimeout(() => {
    node.style.transition = "opacity .2s, transform .2s";
    node.style.opacity = "0";
    node.style.transform = "translateY(6px)";
    setTimeout(() => node.remove(), 220);
  }, duration);
  return node;
}

/* ---------- modal ---------- */
const modalStack = [];

/**
 * Abre um modal.
 * @param {object} opts { title, icon, body (string|Node), footer, size, onMount, onClose, dismissable }
 * @returns {{close: Function, root: HTMLElement}}
 */
function openModal(opts = {}) {
  const {
    title = "", iconName = null, body = "", footer = null,
    size = "", onMount = null, onClose = null, dismissable = true,
  } = opts;

  const overlay = el("div", { class: "overlay", role: "dialog", "aria-modal": "true", "aria-label": title });
  const modal = el("div", { class: `modal ${size ? `modal-${size}` : ""}` });

  const head = el("div", { class: "modal-head" });
  head.innerHTML = `
    ${iconName ? `<span style="color:var(--accent)">${icon(iconName, 19)}</span>` : ""}
    <div class="modal-title grow">${esc(title)}</div>`;
  const closeBtn = el("button", { class: "btn btn-ghost btn-icon btn-sm", "aria-label": t("close"), html: icon("x", 17) });
  head.append(closeBtn);

  const bodyNode = el("div", { class: "modal-body" });
  if (typeof body === "string") bodyNode.innerHTML = body;
  else if (body) bodyNode.append(body);

  modal.append(head, bodyNode);

  let footNode = null;
  if (footer !== false) {
    footNode = el("div", { class: "modal-foot" });
    if (typeof footer === "string") footNode.innerHTML = footer;
    else if (footer) footNode.append(footer);
    else footNode.append(el("button", { class: "btn", text: t("close"), onclick: () => close() }));
    modal.append(footNode);
  }

  overlay.append(modal);
  document.body.append(overlay);
  document.body.style.overflow = "hidden";

  const entry = { overlay, close };
  modalStack.push(entry);

  function close(result) {
    const index = modalStack.indexOf(entry);
    if (index === -1) return;
    modalStack.splice(index, 1);
    overlay.remove();
    if (!modalStack.length) document.body.style.overflow = "";
    onClose?.(result);
  }

  // Fechar sem querer apaga tudo o que foi digitado. Guardamos o estado
  // inicial do formulário e só saímos direto se nada tiver mudado; caso
  // contrário, pergunta antes. Vale para o toque fora e para o Esc.
  const snapshot = () => {
    const form = bodyNode.querySelector("form");
    return form ? JSON.stringify(readForm(form)) : null;
  };
  let inicial = null;
  setTimeout(() => { inicial = snapshot(); }, 0);

  async function tryClose() {
    if (inicial !== null && snapshot() !== inicial) {
      const descartar = await confirmDialog({
        title: "Descartar o que você preencheu?",
        message: "Você começou a preencher este formulário. Fechar agora perde o que foi digitado.",
        confirmLabel: "Descartar", tone: "danger", iconName: "alert",
      });
      if (!descartar) return;
    }
    close();
  }
  entry.tryClose = tryClose;

  closeBtn.addEventListener("click", () => tryClose());
  overlay.addEventListener("mousedown", (event) => {
    if (event.target === overlay && dismissable) tryClose();
  });

  // foco inicial no primeiro campo útil, sem roubar foco no mobile
  const focusTarget = bodyNode.querySelector("input:not([type=hidden]), select, textarea, button");
  if (focusTarget && !isTouch()) setTimeout(() => focusTarget.focus(), 60);

  const api = { close, root: modal, body: bodyNode, footer: footNode, overlay };
  onMount?.(api);
  return api;
}

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && modalStack.length) {
    event.preventDefault();
    const top = modalStack[modalStack.length - 1];
    (top.tryClose || top.close)();
  }
  // trava o foco dentro do modal do topo
  if (event.key === "Tab" && modalStack.length) {
    const top = modalStack[modalStack.length - 1].overlay;
    const focusables = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', top)
      .filter((n) => !n.disabled && n.offsetParent !== null);
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
});

/** Confirmação com promessa. */
function confirmDialog({ title, message, confirmLabel = t("confirm"), tone = "primary", iconName = "alert" }) {
  return new Promise((resolve) => {
    let settled = false;
    const footer = el("div", { class: "row gap-8", style: { width: "100%", justifyContent: "flex-end" } });
    const cancel = el("button", { class: "btn", text: t("cancel") });
    const ok = el("button", { class: `btn btn-${tone === "danger" ? "danger" : "primary"}`, text: confirmLabel });
    footer.append(cancel, ok);

    const modal = openModal({
      title, iconName, size: "sm", footer,
      body: `<div class="f-14" style="line-height:1.6;color:var(--muted)">${message}</div>`,
      onClose: () => { if (!settled) { settled = true; resolve(false); } },
    });
    cancel.addEventListener("click", () => { settled = true; modal.close(); resolve(false); });
    ok.addEventListener("click", () => { settled = true; modal.close(); resolve(true); });
    setTimeout(() => ok.focus(), 60);
  });
}

/** Pergunta de escolha múltipla (usada para "esta parcela ou todas?"). */
function choiceDialog({ title, message, options, iconName = "info" }) {
  return new Promise((resolve) => {
    let settled = false;
    const list = el("div", { class: "col gap-8" });
    for (const option of options) {
      const button = el("button", { class: "user-card" });
      button.innerHTML = `
        <span class="avatar-icon" style="background:var(--accent-soft);color:var(--accent)">${icon(option.icon || "check", 17)}</span>
        <span class="grow" style="min-width:0">
          <span class="list-title" style="display:block">${esc(option.label)}</span>
          ${option.hint ? `<span class="list-meta">${esc(option.hint)}</span>` : ""}
        </span>`;
      button.addEventListener("click", () => { settled = true; modal.close(); resolve(option.value); });
      list.append(button);
    }
    const wrap = el("div", { class: "col gap-12" }, [
      message ? el("div", { class: "f-13 muted", style: { lineHeight: "1.55" }, text: message }) : null,
      list,
    ]);
    const modal = openModal({
      title, iconName, size: "sm", body: wrap, footer: false,
      onClose: () => { if (!settled) { settled = true; resolve(null); } },
    });
  });
}

/* ---------- popover / menu ---------- */
let openPopover = null;
function showPopover(anchor, items) {
  closePopover();
  const node = el("div", { class: "popover", role: "menu" });
  for (const item of items) {
    if (item === "-") { node.append(el("div", { class: "popover-sep" })); continue; }
    const button = el("button", { class: `popover-item ${item.danger ? "danger" : ""}`, role: "menuitem" });
    button.innerHTML = `${item.icon ? icon(item.icon, 16) : ""}<span class="grow">${esc(item.label)}</span>${item.badge ? `<span class="badge">${esc(item.badge)}</span>` : ""}`;
    button.addEventListener("click", () => { closePopover(); item.onClick?.(); });
    node.append(button);
  }
  document.body.append(node);

  const rect = anchor.getBoundingClientRect();
  const box = node.getBoundingClientRect();
  const left = clamp(rect.right - box.width, 10, window.innerWidth - box.width - 10);
  const below = rect.bottom + 6;
  const top = below + box.height > window.innerHeight - 10 ? Math.max(10, rect.top - box.height - 6) : below;
  node.style.left = `${left}px`;
  node.style.top = `${top}px`;

  openPopover = node;
  setTimeout(() => {
    document.addEventListener("pointerdown", onOutside, { once: true });
  }, 0);
  function onOutside(event) {
    // um ouvinte de um popover já descartado não pode fechar o atual
    if (openPopover !== node) return;
    if (!node.contains(event.target)) closePopover();
    else document.addEventListener("pointerdown", onOutside, { once: true });
  }
  return node;
}
function closePopover() {
  openPopover?.remove();
  openPopover = null;
}
window.addEventListener("resize", closePopover);

    ${opts.min !== undefined ? `min="${opts.min}"` : ""} ${opts.max !== undefined ? `max="${opts.max}"` : ""}

/** Ativa os seletores customizados dentro de um container. */
function bindPickers(root) {
  delegate(root, "click", "[data-colorpicker] .color-dot", (event, node) => {
    const wrap = node.closest("[data-colorpicker]");
    $$(".color-dot", wrap).forEach((d) => d.setAttribute("aria-pressed", "false"));
    node.setAttribute("aria-pressed", "true");
    $("input[type=hidden]", wrap).value = node.dataset.color;
  });
  delegate(root, "click", "[data-emojipicker] .icon-opt", (event, node) => {
    const wrap = node.closest("[data-emojipicker]");
    $$(".icon-opt", wrap).forEach((d) => d.setAttribute("aria-pressed", "false"));
    node.setAttribute("aria-pressed", "true");
    $("input[type=hidden]", wrap).value = node.dataset.emoji;
  });
  delegate(root, "click", "[data-methodpicker] .method-opt", (event, node) => {
    const wrap = node.closest("[data-methodpicker]");
    $$(".method-opt", wrap).forEach((b) => b.setAttribute("aria-pressed", "false"));
    node.setAttribute("aria-pressed", "true");
    $("input[type=hidden]", wrap).value = node.dataset.method;
  });
  delegate(root, "click", "[data-bankpicker] .bank-opt", (event, node) => {
    const wrap = node.closest("[data-bankpicker]");
    $$(".bank-opt", wrap).forEach((b) => b.setAttribute("aria-pressed", "false"));
    node.setAttribute("aria-pressed", "true");
    $("input[type=hidden]", wrap).value = node.dataset.bank;
    wrap.dispatchEvent(new CustomEvent("bankchange", { detail: node.dataset.bank, bubbles: true }));
  });
  delegate(root, "input", "[data-bankpicker] .bank-search", (event, node) => {
    const needle = normalize(node.value);
    for (const option of $$(".bank-opt", node.closest("[data-bankpicker]"))) {
      option.hidden = !!needle && !option.dataset.name.includes(needle);
    }
  });
  delegate(root, "click", "[data-dest]", (event, node) => {
    const input = $("[name='toName']", node.closest("form") || root);
    if (!input) return;
    input.value = node.dataset.dest;
    input.dispatchEvent(new Event("input", { bubbles: true }));
  });
  delegate(root, "click", "[data-seg] button", (event, node) => {
    const wrap = node.closest("[data-seg]");
    $$("button", wrap).forEach((b) => b.setAttribute("aria-pressed", "false"));
    node.setAttribute("aria-pressed", "true");
    $("input[type=hidden]", wrap).value = node.dataset.value;
    wrap.dispatchEvent(new CustomEvent("segchange", { detail: node.dataset.value, bubbles: true }));
  });
}

/** Lê um formulário como objeto simples. */
function readForm(root) {
  const out = {};
  for (const node of $$("input, select, textarea", root)) {
    if (!node.name) continue;
    if (node.type === "checkbox") out[node.name] = node.checked;
    else if (node.type === "radio") { if (node.checked) out[node.name] = node.value; }
    else out[node.name] = node.value;
  }
  return out;
}

/**
 * Marca campos inválidos e devolve true se estiver tudo certo.
 * Rola até o primeiro erro: num formulário longo o campo problemático
 * costuma estar fora da tela, e o usuário fica sem saber o que faltou.
 */
function validate(root, rules) {
  let ok = true;
  $$(".form-error", root).forEach((n) => n.remove());
  $$(".input-invalid", root).forEach((n) => n.classList.remove("input-invalid"));
  for (const [name, check] of Object.entries(rules)) {
    const node = root.querySelector(`[name="${name}"]`);
    if (!node) continue;
    const message = check(node.type === "checkbox" ? node.checked : node.value);
    if (!message) continue;
    ok = false;
    node.classList.add("input-invalid");
    const target = node.type === "hidden" ? node.parentElement : node;
    (target.closest(".field") || target.parentElement).append(el("div", { class: "form-error", text: message }));
  }
  const first = root.querySelector(".input-invalid");
  if (first) {
    const target = first.type === "hidden" ? first.parentElement : first;
    target.scrollIntoView({ block: "center", behavior: "smooth" });
    if (!isTouch()) first.focus({ preventScroll: true });
  }
  return ok;
}

function kpiCard({ label, value, sub, iconName, tone = "accent", spark = null, onClick = null }) {

  const soft = { accent: "var(--accent-soft)", pos: "var(--income-soft)", neg: "var(--expense-soft)", warn: "var(--warn-soft)", info: "var(--info-soft)" }[tone];
  return `<${onClick ? "button" : "div"} class="card kpi" ${onClick ? `data-action="${esc(onClick)}" style="text-align:left"` : ""}>
    <div class="kpi-top">
      <span class="kpi-icon" style="background:${soft};color:${color}">${icon(iconName, 16)}</span>
      <span class="eyebrow grow truncate">${esc(label)}</span>
    </div>
    <div class="kpi-value num" style="color:${tone === "accent" ? "var(--text)" : color}">${esc(value)}</div>
    ${sub ? `<div class="kpi-foot">${sub}</div>` : ""}
    ${spark ? `<div class="kpi-spark">${spark}</div>` : ""}
  </${onClick ? "button" : "div"}>`;
}

/** Linha de lançamento reutilizada em várias telas. */
function txRow(tx, { showDate = false, compact = false } = {}) {
  const category = catById(tx.categoryId);
  const account = accById(tx.accountId);
  const card = cardById(tx.cardId);
  const isIncome = tx.type === "income";
  const isTransfer = tx.type === "transfer";
  const external = isExternalTransfer(tx);
  const color = external ? "var(--expense)" : isTransfer ? "var(--info)" : isIncome ? "var(--income)" : "var(--expense)";
  const late = !tx.paid && tx.date < todayKey();

  const meta = [
    showDate ? dateLabel(tx.date) : null,
    isTransfer ? `${account?.name || "?"} → ${tx.toName || accById(tx.toAccountId)?.name || "?"}` : (category?.name || "Sem categoria"),
    card ? card.name : account?.name,
    !isTransfer && tx.method ? methodLabel(tx.method) : null,
    tx.installment ? `${tx.installment.index}/${tx.installment.of}` : null,
    tx.recurringId ? "recorrente" : null,
  ].filter(Boolean);

  return `<button class="list-row is-button" data-tx="${esc(tx.id)}">
    <span class="avatar-icon" style="background:${isTransfer ? "var(--info-soft)" : alpha(category?.color || "#64748B", 0.16)}">
      ${isTransfer ? `<span style="color:var(--info)">${icon("swap", 17)}</span>` : (category?.emoji || "📦")}
    </span>
    <span class="grow" style="min-width:0">
      <span class="list-title truncate" style="display:block">${esc(tx.description || category?.name || "Lançamento")}</span>
      <span class="list-meta">
        ${meta.map((m, i) => `<span class="${i ? "dot-sep" : ""}">${esc(m)}</span>`).join("")}
      </span>
    </span>
    <span style="text-align:right;flex:none">
      <span class="list-amount num" style="color:${color};display:block">${isIncome ? "+" : isTransfer && !external ? "" : "−"}${esc(money(tx.amount))}</span>
      ${!tx.paid ? `<span class="badge ${late ? "badge-neg" : "badge-warn"}" style="margin-top:3px">${late ? "atrasado" : t("pending")}</span>` : (compact ? "" : "")}
    </span>
  </button>`;
}

/** Agrupa lançamentos por dia com cabeçalho e total. */
function txListByDay(list, { emptyText = "Nenhum lançamento no período." } = {}) {
  if (!list.length) {
    return emptyState({ iconName: "layers", title: t("empty"), text: emptyText });
  }
  const groups = new Map();
  for (const tx of list) {
    if (!groups.has(tx.date)) groups.set(tx.date, []);
    groups.get(tx.date).push(tx);
  }
  return [...groups.entries()].map(([date, items]) => {
    const net = sum(items, (tx) => (tx.type === "income" ? tx.amount : isInternalTransfer(tx) ? 0 : -tx.amount));
    return `<div class="day-head">
        <span>${esc(dateLabel(date, { weekday: true }))} <span class="faint" style="font-weight:500">· ${esc(relativeDay(date))}</span></span>
        <span class="num ${net >= 0 ? "pos" : "neg"}">${esc(money(net, { sign: true }))}</span>
      </div>
      <div class="list">${items.map((tx) => txRow(tx)).join("")}</div>`;
  }).join("");
}

/* ---------- navegação de mês ---------- */
const monthNav = (monthStr) => `
  <div class="month-nav">
    <button data-action="month-prev" aria-label="Mês anterior">${icon("chevronLeft", 15)}</button>
    <button class="month-label" data-action="month-pick">${esc(monthLabel(monthStr, true))}</button>
    <button data-action="month-next" aria-label="Próximo mês">${icon("chevronRight", 15)}</button>
  </div>`;

/** Seletor rápido de mês em grade 4x3 por ano. */
function openMonthPicker(current, onPick) {
  let year = Number(current.slice(0, 4));
  const modal = openModal({
    title: "Escolher período", iconName: "calendar", size: "sm", footer: false,
    body: `<div id="mp"></div>`,
    onMount: ({ body, close }) => {
      const draw = () => {
        $("#mp", body).innerHTML = `
          <div class="row-between mb-16">
            <button class="btn btn-ghost btn-icon btn-sm" data-y="-1">${icon("chevronLeft", 16)}</button>
            <strong class="f-16 w-800">${year}</strong>
            <button class="btn btn-ghost btn-icon btn-sm" data-y="1">${icon("chevronRight", 16)}</button>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px">
            ${MONTHS_SHORT[currentLocale].map((name, i) => {
              const key = `${year}-${pad2(i + 1)}`;
              const active = key === current;
              const isNow = key === thisMonth();
              return `<button class="btn ${active ? "btn-primary" : ""}" data-m="${key}"
                style="height:42px;${isNow && !active ? "border-color:var(--accent);color:var(--accent)" : ""}">${name}</button>`;
            }).join("")}
          </div>
          <button class="btn btn-soft btn-block mt-16" data-m="${thisMonth()}">Ir para o mês atual</button>`;
      };
      draw();
      body.addEventListener("click", (event) => {
        const shift = event.target.closest("[data-y]");
        if (shift) { year += Number(shift.dataset.y); draw(); return; }
        const pick = event.target.closest("[data-m]");
        if (pick) { onPick(pick.dataset.m); close(); }
      });
    },
  });
  return modal;
}

/* ---------- fundo animado da tela de login ---------- */
function startAuthCanvas(canvas) {
  if (!canvas || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return () => {};
  const ctx = canvas.getContext("2d");
  let raf = 0;
  let particles = [];
  let width = 0;
  let height = 0;

  const resize = () => {
    const ratio = Math.min(2, window.devicePixelRatio || 1);
    width = canvas.offsetWidth;
    height = canvas.offsetHeight;
    canvas.width = width * ratio;
    canvas.height = height * ratio;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    const count = Math.round(clamp((width * height) / 16000, 22, 70));
    particles = Array.from({ length: count }, () => ({
      x: Math.random() * width, y: Math.random() * height,
      vx: (Math.random() - 0.5) * 0.22, vy: (Math.random() - 0.5) * 0.22,
      r: Math.random() * 1.7 + 0.6,
    }));
  };

  const accentColor = () => getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#0F9D74";

  const frame = () => {
    ctx.clearRect(0, 0, width, height);
    const color = accentColor();
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > width) p.vx *= -1;
      if (p.y < 0 || p.y > height) p.vy *= -1;
    }
    // conexões
    ctx.lineWidth = 1;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.hypot(dx, dy);
        if (dist > 120) continue;
        ctx.globalAlpha = (1 - dist / 120) * 0.22;
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = color;
    for (const p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(frame);
  };

  resize();
  frame();
  window.addEventListener("resize", resize);
  return () => {
    cancelAnimationFrame(raf);
    window.removeEventListener("resize", resize);
  };
}
