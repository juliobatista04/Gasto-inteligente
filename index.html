.boot-bar span { display: block; width: 40%; height: 100%; border-radius: 99px; background: #0F9D74; animation: bootSlide 1.1s ease-in-out infinite; }
@keyframes bootSlide { 0% { transform: translateX(-100%) } 100% { transform: translateX(320%) } }

/* ==========================================================================
   Gasto Esperto — design system
   Zero dependências. Tokens em :root, temas por [data-theme] e [data-accent].
   ========================================================================== */

/* ---------- reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  /* pilha nativa: o app precisa abrir instantâneo e offline, sem baixar fonte */
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    Ubuntu, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent); text-decoration: none; }
h1, h2, h3, h4, p, figure { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
svg { display: block; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* ---------- tokens: tema claro (base) ---------- */
:root {
  --accent:        #0F9D74;
  --accent-strong: #0B7D5C;
  --accent-soft:   rgba(15, 157, 116, 0.12);
  --accent-glow:   rgba(15, 157, 116, 0.30);
  --accent-ink:    #ffffff;

  --bg:        #F4F6F8;
  --bg-tint:   #EAEEF3;
  --surface:   #FFFFFF;
  --surface-2: #F7F9FB;
  --surface-3: #EDF1F5;
  --border:    #E1E7EE;
  --border-strong: #CBD5E1;

  --text:   #0D1520;
  --muted:  #5B6B7F;
  --faint:  #90A0B3;

  --income:  #0F9D74;
  --expense: #E23D5B;
  --warn:    #E08A16;
  --info:    #2E7CF6;
  --income-soft:  rgba(15, 157, 116, 0.12);
  --expense-soft: rgba(226, 61, 91, 0.12);
  --warn-soft:    rgba(224, 138, 22, 0.14);
  --info-soft:    rgba(46, 124, 246, 0.12);

  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px; --r-full: 999px;
  --shadow-sm: 0 1px 2px rgba(13, 21, 32, 0.06), 0 1px 3px rgba(13, 21, 32, 0.04);
  --shadow-md: 0 4px 14px rgba(13, 21, 32, 0.08);
  --shadow-lg: 0 18px 48px rgba(13, 21, 32, 0.16);
  --ring: 0 0 0 3px var(--accent-soft);

  --sidebar-w: 236px;
  --topbar-h: 60px;
  --tabbar-h: 62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --scale: 1;
}

/* ---------- tema escuro ---------- */
[data-theme="dark"] {
  --bg:        #070B12;
  --bg-tint:   #0A101A;
  --surface:   #101825;
  --surface-2: #16202F;
  --surface-3: #1D293B;
  --border:    #1E2B3D;
  --border-strong: #2B3B52;

  --text:  #EAF1FA;
  --muted: #8FA3BC;
  --faint: #5D708A;

  --income-soft:  rgba(37, 211, 155, 0.14);
  --expense-soft: rgba(255, 92, 122, 0.14);
  --warn-soft:    rgba(255, 176, 46, 0.15);
  --info-soft:    rgba(90, 158, 255, 0.14);
  --income:  #25D39B;
  --expense: #FF5C7A;
  --warn:    #FFB02E;
  --info:    #5A9EFF;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.6);
}

/* ---------- paletas de destaque ---------- */
[data-accent="esmeralda"] { --accent:#0F9D74; --accent-strong:#0B7D5C; --accent-soft:rgba(15,157,116,.12); --accent-glow:rgba(15,157,116,.32); --accent-ink:#fff; }

/* ---------- densidade ---------- */
[data-density="compacto"] { --scale: .92; }
[data-density="amplo"]    { --scale: 1.08; }

/* ---------- utilidades ---------- */
.num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.display { font-weight: 800; letter-spacing: -0.035em; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.pos { color: var(--income); }
.neg { color: var(--expense); }
.warnc { color: var(--warn); }
.center { text-align: center; }
.right { text-align: right; }
.row { display: flex; align-items: center; gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.col { display: flex; flex-direction: column; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.gap-4 { gap: 4px; } .gap-6 { gap: 6px; } .gap-8 { gap: 8px; }
.gap-10 { gap: 10px; } .gap-12 { gap: 12px; } .gap-14 { gap: 14px; }
.gap-16 { gap: 16px; } .gap-18 { gap: 18px; } .gap-20 { gap: 20px; }
.mt-4{margin-top:4px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}.mt-24{margin-top:24px}
.mb-4{margin-bottom:4px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}
.f-11{font-size:11px}.f-12{font-size:12px}.f-13{font-size:13px}.f-14{font-size:14px}.f-15{font-size:15px}
.f-16{font-size:16px}.f-18{font-size:18px}.f-20{font-size:20px}.f-24{font-size:24px}.f-28{font-size:28px}.f-34{font-size:34px}
.w-600{font-weight:600}.w-700{font-weight:700}.w-800{font-weight:800}
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eyebrow {
  font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--faint);
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
.scroll-x { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
.scroll-x::-webkit-scrollbar { height: 6px; }
.scroll-x::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }

/* ---------- foco visível ---------- */
:where(button, a, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* ---------- cartões ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: calc(16px * var(--scale));
  box-shadow: var(--shadow-sm);
}
.card-flat { box-shadow: none; }
.card-pad-sm { padding: calc(12px * var(--scale)); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.card-title { font-size: calc(14px * var(--scale)); font-weight: 700; letter-spacing: -0.01em; }
.card-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* ---------- botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 38px; padding: 0 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 13px; font-weight: 600;
  transition: background .15s, border-color .15s, transform .1s, box-shadow .15s, opacity .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-primary {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  box-shadow: 0 4px 14px var(--accent-glow);
}
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.btn-soft:hover { background: var(--accent-soft); border-color: var(--accent); }
.btn-danger { background: var(--expense-soft); border-color: transparent; color: var(--expense); }
.btn-danger:hover { border-color: var(--expense); background: var(--expense-soft); }
.btn-sm { height: 31px; padding: 0 10px; font-size: 12px; border-radius: var(--r-sm); }
.btn-lg { height: 46px; padding: 0 20px; font-size: 15px; border-radius: var(--r-lg); }
.btn-block { width: 100%; }
.btn-icon { width: 38px; padding: 0; }
.btn-icon.btn-sm { width: 31px; }

/* ---------- formulários ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.input, .select, .textarea {
  width: 100%; height: 40px;
  padding: 0 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-size: 14px;
  transition: border-color .15s, box-shadow .15s, background .15s;
  appearance: none;
}
.textarea { height: auto; min-height: 76px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus {
  outline: none; border-color: var(--accent); box-shadow: var(--ring); background: var(--surface);
}
.input::placeholder, .textarea::placeholder { color: var(--faint); }
.select {
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 16px) 17px, calc(100% - 11px) 17px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 32px;
}
.input-money { font-size: 20px; font-weight: 800; height: 52px; letter-spacing: -0.02em; }
.input-invalid { border-color: var(--expense) !important; }
.form-error { font-size: 11px; color: var(--expense); font-weight: 600; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid .span-2 { grid-column: 1 / -1; }
@media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } .form-grid .span-2 { grid-column: auto; } }

.switch { position: relative; width: 42px; height: 24px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 2; }
.switch-track {
  position: absolute; inset: 0; border-radius: 99px;
  background: var(--surface-3); border: 1px solid var(--border);
  transition: background .18s, border-color .18s;
}
.switch-thumb {
  position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
  border-radius: 99px; background: var(--faint);
  transition: transform .18s cubic-bezier(.3,1.4,.5,1), background .18s;
}
.switch input:checked ~ .switch-track { background: var(--accent); border-color: var(--accent); }
.switch input:checked ~ .switch-thumb { transform: translateX(18px); background: var(--accent-ink); }

.seg {
  display: inline-flex; padding: 3px; gap: 2px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md);
}
.seg button {
  padding: 0 12px; height: 30px; border-radius: 9px;
  font-size: 12px; font-weight: 600; color: var(--muted);
  transition: background .15s, color .15s;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.seg-fill { display: flex; width: 100%; }
.seg-fill button { flex: 1; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 11px; border-radius: var(--r-full);
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: 12px; font-weight: 600; color: var(--muted);
  transition: all .15s;
}
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip-dot { width: 8px; height: 8px; border-radius: 99px; flex: none; }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px; border-radius: var(--r-full);
  font-size: 10.5px; font-weight: 700; letter-spacing: .01em;
  background: var(--surface-3); color: var(--muted);
}
.badge-pos { background: var(--income-soft); color: var(--income); }
.badge-neg { background: var(--expense-soft); color: var(--expense); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-info { background: var(--info-soft); color: var(--info); }
.badge-accent { background: var(--accent-soft); color: var(--accent); }

/* ---------- shell / layout ---------- */
#app { min-height: 100%; }
.shell { display: flex; min-height: 100vh; min-height: 100dvh; }

.sidebar {
  position: fixed; inset: 0 auto 0 0; z-index: 60;
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 14px 10px calc(14px + var(--safe-b));
  display: flex; flex-direction: column; gap: 12px;
  overflow-y: auto; overscroll-behavior: contain;
}
.sidebar::-webkit-scrollbar { width: 5px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group-label { font-size: 9.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 10px 10px 5px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: var(--r-md);
  font-size: 13px; font-weight: 600; color: var(--muted);
  transition: background .15s, color .15s;
  position: relative;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.nav-item.active::before {
  content: ""; position: absolute; left: -10px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 18px; border-radius: 0 3px 3px 0; background: var(--accent);
}
.nav-item svg { flex: none; }
.nav-badge { margin-left: auto; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 99px; background: var(--expense); color: #fff; }

.main {
  flex: 1; min-width: 0;
  margin-left: var(--sidebar-w);
  display: flex; flex-direction: column;
}
.topbar {
  position: sticky; top: 0; z-index: 50;
  height: var(--topbar-h);
  padding: 0 clamp(14px, 3vw, 26px);
  display: flex; align-items: center; gap: 12px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
}
.page {
  padding: clamp(14px, 2.4vw, 24px) clamp(14px, 3vw, 26px) 40px;
  max-width: 1440px; width: 100%; margin: 0 auto;
  flex: 1;
}
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.page-title { font-size: calc(23px * var(--scale)); font-weight: 800; letter-spacing: -0.035em; }
.page-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

.tabbar { display: none; }

@media (max-width: 900px) {
  .sidebar { display: none; }
  .main { margin-left: 0; }
  .page { padding-bottom: calc(var(--tabbar-h) + var(--safe-b) + 26px); }
  .tabbar {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
    height: calc(var(--tabbar-h) + var(--safe-b));
    padding-bottom: var(--safe-b);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: saturate(180%) blur(18px);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
    border-top: 1px solid var(--border);
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 9.5px; font-weight: 700; color: var(--faint);
    transition: color .15s;
    position: relative;
  }
  .tab-item.active { color: var(--accent); }
  .tab-item.active::after {
    content: ""; position: absolute; top: 5px; width: 30px; height: 26px;
    border-radius: 9px; background: var(--accent-soft); z-index: -1;
  }
  .page-title { font-size: calc(20px * var(--scale)); }
}

/* botão flutuante de novo lançamento (mobile) */
.fab {
  position: fixed; right: 16px; z-index: 65;
  bottom: calc(var(--tabbar-h) + var(--safe-b) + 14px);
  width: 54px; height: 54px; border-radius: var(--r-full);
  background: var(--accent); color: var(--accent-ink);
  display: none; align-items: center; justify-content: center;
  box-shadow: 0 10px 26px var(--accent-glow);
  transition: transform .15s;
}
.fab:active { transform: scale(.93); }
@media (max-width: 900px) { .fab { display: flex; } }

/* ---------- marca ---------- */
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 2px; }
.brand-name { font-size: 16px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
.brand-tag { font-size: 9.5px; color: var(--faint); letter-spacing: .01em; margin-top: 3px; }

/* ---------- grids ---------- */
.grid { display: grid; gap: clamp(10px, 1.4vw, 14px); }
.grid-kpi { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-main { grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 1180px) { .grid-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-main { grid-template-columns: 1fr; } .grid-3 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 640px)  { .grid-kpi, .grid-2, .grid-3 { grid-template-columns: 1fr; } }
@media (max-width: 640px)  { .grid-kpi.keep-2 { grid-template-columns: repeat(2, minmax(0,1fr)); } }

/* ---------- KPI ---------- */
.kpi { position: relative; overflow: hidden; }
.kpi-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.kpi-icon {
  width: 30px; height: 30px; border-radius: 9px; flex: none;
  display: grid; place-items: center;
}
.kpi-value { font-size: calc(25px * var(--scale)); font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; }
.kpi-foot { font-size: 11px; color: var(--muted); margin-top: 7px; display: flex; align-items: center; gap: 5px; }
.kpi-spark { position: absolute; right: 0; bottom: 0; left: 0; opacity: .5; pointer-events: none; }

/* ---------- listas ---------- */
.list { display: flex; flex-direction: column; }
.list-row {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 4px;
  border-bottom: 1px solid var(--border);
  transition: background .12s;
  text-align: left; width: 100%;
}
.list-row:last-child { border-bottom: 0; }
.list-row:hover { background: var(--surface-2); }
.list-row.is-button { cursor: pointer; }
.avatar-icon {
  width: 36px; height: 36px; border-radius: var(--r-md); flex: none;
  display: grid; place-items: center; font-size: 15px;
}
.list-title { font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; }
.list-meta { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dot-sep::before { content: "·"; margin-right: 6px; color: var(--faint); }
.list-amount { font-size: 14px; font-weight: 700; white-space: nowrap; }

.day-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 4px 6px; font-size: 11px; font-weight: 700; color: var(--muted);
  position: sticky; top: var(--topbar-h); background: var(--bg); z-index: 5;
}

/* ---------- barra de progresso ---------- */
.bar { height: 7px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; transition: width .5s cubic-bezier(.4,0,.2,1); }

/* ---------- estado vazio ---------- */
.empty { padding: 34px 18px; text-align: center; color: var(--muted); }
.empty-icon {
  width: 52px; height: 52px; border-radius: var(--r-lg); margin: 0 auto 12px;
  display: grid; place-items: center; background: var(--surface-2); color: var(--faint);
}
.empty-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.empty-text { font-size: 12.5px; max-width: 320px; margin: 0 auto; line-height: 1.55; }

/* ---------- modal ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(4, 8, 14, .55);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: fade .16s ease;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg);
  width: 100%; max-width: 520px;
  max-height: min(88vh, 860px);
  display: flex; flex-direction: column;
  animation: pop .2s cubic-bezier(.2,1.1,.4,1);
  overflow: hidden;
}
.modal-lg { max-width: 720px; }
.modal-sm { max-width: 400px; }
.modal-head {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 18px; border-bottom: 1px solid var(--border); flex: none;
}
.modal-title { font-size: 15.5px; font-weight: 800; letter-spacing: -0.02em; }
.modal-body { padding: 18px; overflow-y: auto; flex: 1; }
.modal-foot {
  display: flex; gap: 9px; justify-content: flex-end;
  padding: 14px 18px; border-top: 1px solid var(--border); flex: none;
  background: var(--surface-2);
}
@media (max-width: 620px) {
  .overlay { padding: 0; align-items: flex-end; }
  .modal {
    max-width: 100%; max-height: 94dvh;
    border-radius: var(--r-xl) var(--r-xl) 0 0;
    animation: slideup .24s cubic-bezier(.2,.9,.3,1);
    padding-bottom: var(--safe-b);
  }
  .modal-foot { padding-bottom: calc(14px + var(--safe-b)); }
  .modal-foot .btn { flex: 1; }
}
@keyframes fade { from { opacity: 0 } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98) } }
@keyframes slideup { from { transform: translateY(100%) } }

/* ---------- toasts ---------- */
.toasts {
  position: fixed; z-index: 300; right: 16px; bottom: 16px;
  display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
  pointer-events: none;
}
/* acima do botão flutuante: no celular o aviso ficava exatamente sobre o
   "+", e como ele captura o toque, o botão morria enquanto o aviso durasse */
@media (max-width: 900px) {
  .toasts {
    right: 12px; left: 12px; align-items: stretch;
    bottom: calc(var(--tabbar-h) + var(--safe-b) + 80px);
  }
}
.toast {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; border-radius: var(--r-md);
  background: var(--surface); border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  font-size: 13px; font-weight: 600;
  animation: toastin .22s cubic-bezier(.2,1.1,.4,1);
  /* aviso é informativo e some sozinho: não deve interceptar toque nenhum */
  pointer-events: none; max-width: 380px;
}
.toast-ok  { border-left: 3px solid var(--income); }
.toast-err { border-left: 3px solid var(--expense); }
.toast-info{ border-left: 3px solid var(--info); }
@keyframes toastin { from { opacity: 0; transform: translateY(10px) } }

/* ---------- popover ---------- */
.popover {
  position: fixed; z-index: 210;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
  padding: 6px; min-width: 190px; max-height: 60vh; overflow-y: auto;
  animation: pop .14s ease;
}
.popover-item {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 9px 10px; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 600; color: var(--text); text-align: left;
}
.popover-item:hover { background: var(--surface-2); }
.popover-item.danger { color: var(--expense); }
.popover-sep { height: 1px; background: var(--border); margin: 5px 2px; }

/* ---------- login ---------- */
.auth {
  min-height: 100vh; min-height: 100dvh;
  display: grid; grid-template-columns: 1.05fr .95fr;
  background: var(--bg);
}
.auth-art {
  position: relative; overflow: hidden;
  background:
    radial-gradient(1100px 640px at 12% 8%, var(--accent-glow), transparent 62%),
    radial-gradient(760px 520px at 88% 92%, var(--accent-soft), transparent 66%),
    var(--bg-tint);
  padding: clamp(28px, 5vw, 60px);
  display: flex; flex-direction: column; justify-content: space-between;
}
.auth-art canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; }
.auth-art > * { position: relative; z-index: 1; }
.auth-panel {
  display: flex; align-items: center; justify-content: center;
  padding: clamp(22px, 4vw, 46px);
  background: var(--surface);
  border-left: 1px solid var(--border);
}
.auth-box { width: 100%; max-width: 372px; }
@media (max-width: 940px) {
  .auth { grid-template-columns: 1fr; }
  .auth-art { display: none; }
  .auth-panel { border-left: 0; padding-top: calc(28px + var(--safe-t)); align-items: flex-start; }
  .auth-box { margin-top: 4vh; }
}
.auth-feature { display: flex; gap: 12px; align-items: flex-start; }
.auth-feature-icon {
  width: 34px; height: 34px; border-radius: 10px; flex: none;
  display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--border); color: var(--accent);
}

.pin-dots { display: flex; gap: 11px; justify-content: center; margin: 22px 0; }
.pin-dot {
  width: 13px; height: 13px; border-radius: 99px;
  background: var(--surface-3); border: 1px solid var(--border);
  transition: transform .16s, background .16s, border-color .16s;
}
.pin-dot.on { background: var(--accent); border-color: var(--accent); transform: scale(1.16); }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 280px; margin: 0 auto; }
.pin-key {
  height: 56px; border-radius: var(--r-lg);
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: 20px; font-weight: 700; letter-spacing: -0.02em;
  transition: background .12s, transform .08s;
}
.pin-key:hover { background: var(--surface-3); }
.pin-key:active { transform: scale(.95); background: var(--accent-soft); }
.pin-key.util { font-size: 13px; font-weight: 700; color: var(--muted); }
.shake { animation: shake .38s; }
@keyframes shake {
  10%, 90% { transform: translateX(-2px) } 20%, 80% { transform: translateX(4px) }
  30%, 50%, 70% { transform: translateX(-7px) } 40%, 60% { transform: translateX(7px) }
}

.user-card {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 11px 13px; border-radius: var(--r-lg);
  background: var(--surface-2); border: 1px solid var(--border);
  transition: border-color .15s, transform .1s, background .15s;
}
.user-card:hover { border-color: var(--accent); background: var(--surface-3); }
.user-card:active { transform: scale(.99); }
.avatar {
  width: 40px; height: 40px; border-radius: var(--r-md); flex: none;
  display: grid; place-items: center;
  font-size: 14px; font-weight: 800; letter-spacing: -0.02em;
  background: var(--accent-soft); color: var(--accent);
}
.avatar-lg { width: 60px; height: 60px; border-radius: var(--r-lg); font-size: 21px; }
.avatar-sm { width: 30px; height: 30px; border-radius: 9px; font-size: 11px; }

/* ---------- seletor de cor ---------- */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 9px; }
.swatch {
  /* o item da grade é o <div> em volta, não o botão: sem width o botão
     encolhe até o conteúdo (vazio) e vira um quadrado de 4px */
  width: 100%;
  aspect-ratio: 1; border-radius: var(--r-md);
  border: 2px solid transparent; position: relative;
  transition: transform .12s, border-color .15s;
  display: grid; place-items: center;
}
.swatch:hover { transform: translateY(-2px); }
.swatch[aria-pressed="true"] { border-color: var(--text); }
.swatch-name { font-size: 9px; font-weight: 700; text-align: center; margin-top: 4px; color: var(--muted); }

.color-dots { display: flex; flex-wrap: wrap; gap: 7px; }
.color-dot {
  width: 27px; height: 27px; border-radius: 8px;
  border: 2px solid transparent; transition: transform .12s;
}
.color-dot:hover { transform: scale(1.1); }
.color-dot[aria-pressed="true"] { border-color: var(--text); }

.icon-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; max-height: 168px; overflow-y: auto; padding: 2px; }
.icon-opt {
  aspect-ratio: 1; border-radius: var(--r-sm); font-size: 17px;
  background: var(--surface-2); border: 1px solid var(--border);
  display: grid; place-items: center; transition: all .12s;
}
.icon-opt:hover { border-color: var(--accent); }
.icon-opt[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }

/* ---------- cartão de crédito visual ---------- */
.credit-card {
  position: relative; overflow: hidden;
  border-radius: var(--r-lg);
  padding: 15px 16px; color: #fff; min-height: 132px;
  display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: var(--shadow-md);
}
.credit-card::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(500px 220px at 105% -18%, rgba(255,255,255,.28), transparent 60%);
  pointer-events: none;
}
.credit-card > * { position: relative; z-index: 1; }
.cc-chip {
  width: 30px; height: 22px; border-radius: 5px;
  background: linear-gradient(135deg, rgba(255,255,255,.85), rgba(255,255,255,.42));
}

/* ---------- tabela ---------- */
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th {
  text-align: left; padding: 9px 10px; font-size: 10.5px; font-weight: 800;
  letter-spacing: .06em; text-transform: uppercase; color: var(--faint);
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
.table td { padding: 10px; border-bottom: 1px solid var(--border); }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr:hover { background: var(--surface-2); }

/* ---------- gráficos ---------- */
.chart-wrap { position: relative; width: 100%; }
.chart-tip {
  position: fixed; z-index: 220; pointer-events: none;
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: var(--r-md); box-shadow: var(--shadow-lg);
  padding: 8px 11px; font-size: 12px; min-width: 120px;
  transform: translate(-50%, -110%);
}
.legend { display: flex; flex-wrap: wrap; gap: 9px 14px; margin-top: 12px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(node.style, v);
    else if (k === "html") node.innerHTML = v;
    else if (k === "text") node.textContent = v;

    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);

function formatter(kind, options) {
  const key = kind + currentCurrency + currentLocale + JSON.stringify(options);

/** Valor monetário completo: R$ 1.234,56 */
function money(value, { sign = false, cents = true } = {}) {
  const n = Number(value) || 0;
  const text = formatter("cur", {
    style: "currency", currency: currentCurrency,
    minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0,
  }).format(Math.abs(n));
  if (sign && n !== 0) return `${n > 0 ? "+" : "−"}${text}`;
  return n < 0 ? `−${text}` : text;
}

/** Valor curto para gráficos e KPIs apertados: R$ 12,4 mil */
function moneyShort(value) {
  const n = Number(value) || 0;
  const abs = Math.abs(n);
  const symbol = CURRENCIES[currentCurrency]?.symbol || "";
  const scale = (v, suffix) => `${n < 0 ? "−" : ""}${symbol} ${formatter("s" + suffix, { maximumFractionDigits: v >= 100 ? 0 : 1 }).format(v)}${suffix}`;
  if (abs >= 1e9) return scale(abs / 1e9, "B");
  if (abs >= 1e6) return scale(abs / 1e6, "M");
  if (abs >= 1e3) return scale(abs / 1e3, "k");
  return money(n, { cents: abs % 1 !== 0 });

/** Converte texto digitado ("1.234,56", "1234.56", "12,5") em número. */
function parseMoney(text) {
  if (typeof text === "number") return round2(text);
  let raw = String(text ?? "").replace(/[^\d,.-]/g, "").trim();
  if (!raw) return 0;
  const lastComma = raw.lastIndexOf(",");
  const lastDot = raw.lastIndexOf(".");
  if (lastComma > -1 && lastDot > -1) {
    // o separador decimal é o que aparece por último
    raw = lastComma > lastDot
      ? raw.replace(/\./g, "").replace(",", ".")
      : raw.replace(/,/g, "");
  } else if (lastComma > -1) {
    // "1,234" com 3 dígitos após a vírgula é milhar; caso contrário é decimal
    raw = /,\d{3}$/.test(raw) ? raw.replace(/,/g, "") : raw.replace(",", ".");

  "pt-BR": ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"],
  "en-US": ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
  "es-ES": ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"],
};
const monthName = (monthStr, short = false) =>
  (short ? MONTHS_SHORT : MONTHS_LONG)[currentLocale][Number(String(monthStr).slice(5, 7)) - 1];
const monthLabel = (monthStr, short = false) => `${monthName(monthStr, short)} ${String(monthStr).slice(0, 4)}`;

function dateLabel(key, { weekday = false, year = false } = {}) {
  const date = fromKey(key);
  const parts = [`${date.getDate()} ${MONTHS_SHORT[currentLocale][date.getMonth()]}`];
  if (year) parts[0] += ` ${date.getFullYear()}`;
  if (weekday) parts.unshift(WEEKDAYS_SHORT[currentLocale][date.getDay()]);
  return parts.join(", ");
}

/** "Hoje", "Ontem", "em 3 dias", "há 5 dias" */
function relativeDay(key) {
  const delta = diffDays(key, todayKey());
  if (delta === 0) return t("today");
  if (delta === 1) return t("tomorrow");
  if (delta === -1) return t("yesterday");
  const unit = { "pt-BR": ["em", "dias", "há"], "en-US": ["in", "days", ""], "es-ES": ["en", "días", "hace"] }[currentLocale];
  return delta > 0 ? `${unit[0]} ${delta} ${unit[1]}` : `${unit[2]} ${Math.abs(delta)} ${unit[1]}`.trim();
}

/* ---------- armazenamento ---------- */
const KEYS = {
  users: `${APP.ns}.users.v1`,
  session: `${APP.ns}.session.v1`,
  prefs: `${APP.ns}.prefs.v1`,
  data: (userId) => `${APP.ns}.data.${userId}.v1`,
};

let storageWarned = false;
const store = {
  get(key, fallback = null) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch { return fallback; }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (err) {
      if (!storageWarned) {
        storageWarned = true;
        const full = err && (err.name === "QuotaExceededError" || err.code === 22);
        toast(full
          ? "Armazenamento cheio. Exporte um backup e limpe lançamentos antigos."
          : "Não consegui salvar neste navegador. Verifique se a navegação privada está ativa.", "err", 9000);
      }
      return false;
    }
  },
  remove(key) { try { localStorage.removeItem(key); } catch {} },
};

/* ---------- descoberta de recursos ---------- */
const canStore = (() => {
  try {
    const probe = `${APP.ns}.probe`;
    localStorage.setItem(probe, "1");
    localStorage.removeItem(probe);
    return true;
  } catch { return false; }
})();

const isStandalone = () =>
  window.matchMedia?.("(display-mode: standalone)").matches || window.navigator.standalone === true;

const isTouch = () => window.matchMedia?.("(hover: none)").matches ?? false;

function haptic(ms = 12) {
  try { navigator.vibrate?.(ms); } catch {}
}

/** Baixa um arquivo gerado em memória. */
function download(filename, content, mime = "application/json") {
  const blob = content instanceof Blob ? content : new Blob([content], { type: `${mime};charset=utf-8` });
  const url = URL.createObjectURL(blob);
  const link = el("a", { href: url, download: filename });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const area = el("textarea", { value: text, style: { position: "fixed", opacity: "0" } });
    document.body.append(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch {}
    area.remove();
    return ok;
  }
}

/* --------------------------------------------------------------------------
   LOGO — carteira com lâmpada.
   A silhueta da carteira forma a base; o bulbo emerge da aba superior como
   se a ideia saísse do bolso. Desenhada em viewBox 64x64 para escalar bem
   de 16px (favicon) até 128px (tela de login).
   -------------------------------------------------------------------------- */

/** Marca só o símbolo. `tone` = "brand" (fundo colorido) ou "flat" (traço). */
function logoMark(size = 36, { tone = "brand", radius = 13 } = {}) {
  const stroke = tone === "brand" ? "var(--accent-ink)" : "var(--accent)";
  const bg = tone === "brand"
    ? `<rect width="64" height="64" rx="${radius * (64 / size)}" fill="url(#geGrad)"/>`
    : "";
  return `
<svg viewBox="0 0 64 64" width="${size}" height="${size}" role="img" aria-label="${esc(APP.name)}" fill="none">
  <defs>
    <linearGradient id="geGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--accent)"/>
      <stop offset="1" stop-color="var(--accent-strong)"/>
    </linearGradient>
  </defs>
  ${bg}
  <!-- corpo da carteira -->
  <path d="M14 27.5c0-3 2.4-5.4 5.4-5.4h25.2c3 0 5.4 2.4 5.4 5.4v15.1c0 3-2.4 5.4-5.4 5.4H19.4c-3 0-5.4-2.4-5.4-5.4V27.5Z"
        stroke="${stroke}" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- aba / compartimento do cartão -->
  <path d="M50 32.6h-8.2a3.6 3.6 0 0 0 0 7.2H50" stroke="${stroke}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- lâmpada saindo da carteira -->
  <path d="M32 6.5a8.6 8.6 0 0 0-5.1 15.5c.8.6 1.3 1.5 1.3 2.5v.8h7.6v-.8c0-1 .5-1.9 1.3-2.5A8.6 8.6 0 0 0 32 6.5Z"
        stroke="${stroke}" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- filamento: cifrão dentro do bulbo -->
  <path d="M32 11.4v8.4M34.3 13.4c-.6-.7-1.5-1-2.5-1-1.5 0-2.6.8-2.6 2s1 1.7 2.6 2c1.7.3 2.7.8 2.7 2s-1.1 2-2.7 2c-1.1 0-2-.4-2.6-1.1"
        stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <!-- raios de luz -->
  <path d="M17.5 12.4 20 14.6M46.5 12.4 44 14.6M12.6 24.2h3.2M51.4 24.2h-3.2"
        stroke="${stroke}" stroke-width="2.6" stroke-linecap="round" opacity=".55"/>
</svg>`;
}

/** Logotipo por extenso, para o cabeçalho e a tela de login. */
function logoLockup(size = 36, { tagline = true, tone = "brand" } = {}) {
  return `
<div class="brand">
  ${logoMark(size, { tone })}
  <div>
    <div class="brand-name" style="font-size:${Math.round(size * 0.44)}px">
      Gasto <span style="color:var(--accent)">Esperto</span>
    </div>
    ${tagline ? `<div class="brand-tag">${esc(APP.tagline)}</div>` : ""}
  </div>
</div>`;
}

/** Versão data-URI, usada como favicon e ícone da PWA. */
function logoDataUri(bgHex = "#0F9D74", inkHex = "#FFFFFF") {
  const svg = logoMark(64, { tone: "brand" })
    .replace(/var\(--accent-ink\)/g, inkHex)
    .replace(/url\(#geGrad\)/g, bgHex)
    .replace(/\n\s*/g, " ");
  return `data:image/svg+xml,${encodeURIComponent(svg)}`;
}

/** Cor de texto legível (preto ou branco) sobre um fundo hex. */
function readableInk(hex) {
  const clean = String(hex).replace("#", "");
  const full = clean.length === 3 ? clean.split("").map((c) => c + c).join("") : clean;
  const r = parseInt(full.slice(0, 2), 16) / 255;
  const g = parseInt(full.slice(2, 4), 16) / 255;
  const b = parseInt(full.slice(4, 6), 16) / 255;
  const lin = (c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
  const luminance = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  return luminance > 0.45 ? "#10161f" : "#ffffff";
}

/** Mistura uma cor com transparência, para fundos suaves. */
const alpha = (hex, a) => {
  const clean = String(hex).replace("#", "");
  const full = clean.length === 3 ? clean.split("").map((c) => c + c).join("") : clean;
  const [r, g, b] = [0, 2, 4].map((i) => parseInt(full.slice(i, i + 2), 16));
  return `rgba(${r}, ${g}, ${b}, ${a})`;
};

/** Iniciais para o avatar: "Júlio Batista" -> "JB". */
function initialsOf(name) {
  const parts = String(name).trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return "?";
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
}

/** Hash leve do PIN. Não é criptografia: só evita PIN em texto puro no disco. */
async function hashPin(pin, salt) {
  const text = `${APP.ns}|${salt}|${pin}`;
  if (globalThis.crypto?.subtle) {
    const bytes = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  let h = 5381;
  for (let i = 0; i < text.length; i++) h = ((h << 5) + h + text.charCodeAt(i)) >>> 0;
  return `fb${h.toString(16)}`;
}

async function createUser({ name, pin, color = PALETTE[0] }) {
  const users = getUsers();
  if (users.some((u) => normalize(u.name) === normalize(name))) {
    throw new Error("Já existe um perfil com esse nome neste dispositivo.");
  }
  const salt = uid("s");
  const user = {
    id: uid("user"),
    name: String(name).trim(),
    salt,
    pinHash: await hashPin(pin, salt),
    avatar: initialsOf(name),
    color,
    createdAt: new Date().toISOString(),
  };
  saveUsers([...users, user]);
  store.set(KEYS.data(user.id), seedDatabase(user));
  return user;
}

async function checkPin(user, pin) {
  return (await hashPin(pin, user.salt)) === user.pinHash;
}

async function changePin(user, pin) {
  const salt = uid("s");
  const patch = { salt, pinHash: await hashPin(pin, salt) };
  saveUsers(getUsers().map((u) => (u.id === user.id ? { ...u, ...patch } : u)));
  Object.assign(user, patch);
}

/** Estrutura inicial de um usuário novo. */
function seedDatabase(user) {
  const categories = DEFAULT_CATEGORIES.map((c) => ({ id: uid("cat"), archived: false, ...c }));
  const account = {
    id: uid("acc"), name: "Conta principal", type: "checking", bankId: "outro",
    color: "#0F9D74", openingBalance: 0, openingDate: `${thisMonth()}-01`, archived: false, primary: true,
  };
  return {
    schema: 2,
    profile: {
      displayName: user?.name || "",
      currency: "BRL",
      locale: "pt-BR",
      monthStartDay: 1,
      hideValues: false,
      alertsEnabled: true,
      overspendAlert: 85,
    },
    accounts: [account],
    cards: [],
    categories,
    transactions: [],
    recurring: [],
    budgets: [],
    goals: [],
    tags: [],
    meta: { createdAt: new Date().toISOString(), lastOpen: todayKey(), recurringRunAt: null },
  };
}

/** Preenche campos ausentes ao carregar bases antigas. */
function migrate(db) {
  const base = seedDatabase(null);
  const next = { ...base, ...db };
  next.profile = { ...base.profile, ...(db.profile || {}) };
  next.meta = { ...base.meta, ...(db.meta || {}) };
  for (const key of ["accounts", "cards", "categories", "transactions", "recurring", "budgets", "goals", "tags"]) {
    next[key] = Array.isArray(db[key]) ? db[key] : base[key];
  }
  next.transactions = next.transactions.map((tx) => ({
    paid: true, tags: [], notes: "", ...tx,
    amount: round2(Math.abs(Number(tx.amount) || 0)),
    // bases anteriores não tinham forma de pagamento: deduz do que dá
    method: tx.method ?? (tx.cardId ? "credito" : tx.type === "transfer" ? "ted" : null),
  }));
  // contas antigas guardavam só o nome da instituição em texto
  next.accounts = next.accounts.map((acc) => ({
    ...acc,
    bankId: acc.bankId ?? guessBank(acc.institution || acc.name),
  }));
  next.cards = next.cards.map((card) => ({ ...card, bankId: card.bankId ?? guessBank(card.name) }));
  next.schema = 2;
  return next;
}

/** Tenta reconhecer o banco pelo nome digitado ("meu nubank" -> nubank). */
function guessBank(text) {
  const needle = normalize(text);
  if (!needle) return "outro";
  const hit = BANKS.find((b) => b.id !== "outro" && needle.includes(normalize(b.name).split(" ")[0]));
  return hit?.id || "outro";
}

function loadDb(userId) {
  const raw = store.get(KEYS.data(userId), null);
  return migrate(raw || seedDatabase(findUser(userId)));
}

  state.db.meta.lastOpen = todayKey();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => store.set(KEYS.data(state.user.id), state.db), 60);
  invalidate();

  if (!silent) state.dirty = true;
}

  clearTimeout(saveTimer);

/** Carimbo de última alteração — usado para decidir quem vence na mesclagem. */

function upsert(collection, record) {
  const list = db()[collection];
  const index = list.findIndex((x) => x.id === record.id);
  if (index >= 0) list[index] = { ...list[index], ...record, updatedAt: stamp() };
  else list.push({ id: uid(collection.slice(0, 3)), ...record, updatedAt: stamp() });
  return list[index >= 0 ? index : list.length - 1];
}

function removeFrom(collection, id) {
  const list = db()[collection];
