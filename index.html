/* --------------------------------------------------------------------------
   Lançamento
   -------------------------------------------------------------------------- */
function openTransactionModal(existing = null, defaults = {}) {
  const isEdit = !!existing;
  const tx = existing || {
    type: defaults.type || "expense",
    amount: "", date: defaults.date || todayKey(), description: "",
    categoryId: defaults.categoryId || "", accountId: defaults.accountId || activeAccounts()[0]?.id || "",
    cardId: defaults.cardId || "", method: defaults.method || "pix", paid: true, notes: "", tags: [],
  };

  const accountOptions = activeAccounts().map((a) => ({ value: a.id, label: a.name }));
  const cardOptions = activeCards().map((c) => ({ value: c.id, label: c.name }));

  const body = el("form", { class: "col gap-16", id: "txForm", novalidate: true, autocomplete: "off" });
  const footer = el("div", { class: "row gap-8", style: { width: "100%", justifyContent: "space-between" } });

  const render = (type) => {
    const cats = categoriesOf(type === "income" ? "income" : "expense");
    const isTransfer = type === "transfer";
    body.innerHTML = `
      ${segInput("type", [
        { value: "expense", label: t("expense"), icon: "arrowDown" },
        { value: "income", label: t("income"), icon: "arrowUp" },
        { value: "transfer", label: t("transfer"), icon: "swap" },
      ], type)}

      ${field(t("amount"), moneyInput("amount", tx.amount === "" ? "" : num(tx.amount, 2), { required: true }))}

      ${isTransfer ? "" : field("Forma de pagamento", methodPicker("method", tx.method))}

      ${isTransfer ? field("Para quem", destinationInput(tx), {
        hint: "Digite um nome (Pix para alguém) ou escolha uma conta sua na lista",
      }) : ""}

      <div class="form-grid">
        ${field(t("description"), textInput("description", tx.description, { placeholder: isTransfer ? "Ex.: aluguel do mês" : "Ex.: mercado do mês", maxlength: 90 }), { span: isTransfer })}
        ${isTransfer ? "" : field(t("category"), selectInput("categoryId", [
          ...cats.map((c) => ({ value: c.id, label: `${c.emoji} ${c.name}` })),
          { value: "__new__", label: "➕ Criar nova categoria…" },
        ], tx.categoryId, { placeholder: "Sem categoria" }))}

        ${field(t("date"), textInput("date", tx.date, { type: "date", required: true }))}
        ${isTransfer
          ? field("Sai da conta", selectInput("accountId", accountsWithNew(), tx.accountId, { required: true }))
          : field(t("account"), selectInput("accountId", accountsWithNew(), tx.accountId, { placeholder: "Nenhuma" }))}

        ${isTransfer ? field(t("category"), selectInput("categoryId", [
          ...categoriesOf("expense").map((c) => ({ value: c.id, label: `${c.emoji} ${c.name}` })),
          { value: "__new__", label: "➕ Criar nova categoria…" },
        ], tx.categoryId, { placeholder: "Sem categoria" }), { span: true, hint: "Só usada quando o dinheiro vai para fora" }) : ""}
        ${isTransfer ? "" : field(t("card"), selectInput("cardId", [
          ...activeCards().map((c) => ({ value: c.id, label: c.name })),
          { value: "__new__", label: "➕ Cadastrar cartão…" },
        ], tx.cardId, { placeholder: "Sem cartão" }))}

        ${!isEdit && type === "expense" ? field("Parcelas", textInput("installments", "1", { type: "number", min: 1, max: 72, inputmode: "numeric" }), { hint: "Acima de 1 gera a série completa" }) : ""}
      </div>

      ${isTransfer ? `<div class="card card-pad-sm f-12 muted row gap-8" id="transferHint" style="background:var(--surface-2);line-height:1.55;align-items:flex-start"></div>` : ""}

      <div class="card card-pad-sm" style="background:var(--surface-2)">
        ${switchInput("paid", tx.paid !== false, type === "income" ? "Já recebi" : "Já foi pago", "Desmarque para virar uma conta a pagar")}
      </div>

      <details ${tx.notes ? "open" : ""}>
        <summary class="f-12 w-600 muted" style="cursor:pointer;padding:4px 0">Mais opções</summary>
        <div class="mt-12">${field(t("notes"), `<textarea class="textarea" name="notes" placeholder="Anotações internas">${esc(tx.notes || "")}</textarea>`)}</div>
      </details>`;
  };

  render(tx.type);

  const cancel = el("button", { type: "button", class: "btn", text: t("cancel") });
  const save = el("button", { type: "submit", form: "txForm", class: "btn btn-primary", text: t("save") });
  const left = el("div", { class: "row gap-8" });
  if (isEdit) {
    const remove = el("button", { type: "button", class: "btn btn-danger btn-icon", html: icon("trash", 16), "aria-label": t("delete") });
    remove.addEventListener("click", async () => {
      if (await confirmTxDelete(existing)) modal.close();
    });
    left.append(remove);
  }
  footer.append(left, el("div", { class: "row gap-8" }, [cancel, save]));

  const modal = openModal({
    title: isEdit ? t("editTransaction") : t("newTransaction"),
    iconName: isEdit ? "pencil" : "plus",
    body, footer,
    onMount: ({ close }) => {
      bindPickers(body);
      body.addEventListener("segchange", (event) => {
        const current = readForm(body);
        Object.assign(tx, {
          amount: current.amount ? parseMoney(current.amount) : "",
          description: current.description || "",
          date: current.date || todayKey(),
          accountId: current.accountId || tx.accountId,
          toName: current.toName ?? tx.toName,
          paid: current.paid,
        });
        render(event.detail);
      });
      cancel.addEventListener("click", () => close());

      // guarda o que já foi digitado antes de redesenhar o formulário
      const keepValues = () => {
        const form = readForm(body);
        // "__new__" é só um gatilho de menu: se o cadastro for cancelado
        // ele não pode sobrar guardado como se fosse uma escolha real
        for (const key of Object.keys(form)) if (form[key] === "__new__") form[key] = "";
        Object.assign(tx, {
          ...form,
          amount: form.amount ? parseMoney(form.amount) : "",
          paid: form.paid,
        });
      };

      // "➕ Criar…" nos seletores abre o cadastro e já volta com ele escolhido
      body.addEventListener("change", (event) => {
        const select = event.target;
        if (select.value !== "__new__") return;
        const type = readForm(body).type;
        keepValues();
        select.value = "";

        if (select.name === "categoryId") {
          const kind = type === "income" ? "income" : "expense";
          openCategoryModal(null, kind, { onCreated: (cat) => { tx.categoryId = cat.id; render(type); } });
        } else if (select.name === "accountId") {
          openAccountModal(null, { onCreated: (acc) => { tx.accountId = acc.id; render(type); } });
        } else if (select.name === "cardId") {
          openCardModal(null, { onCreated: (card) => { tx.cardId = card.id; render(type); } });
        }
      });

      // explica, enquanto a pessoa digita, se aquilo vai contar como gasto
      const updateTransferHint = () => {
        const hint = $("#transferHint", body);
        if (!hint) return;
        const typed = $("[name='toName']", body)?.value || "";
        const target = matchAccountByName(typed);
        // o texto vai inteiro dentro de um span: senão cada <b> vira uma
        // coluna do flex e a frase quebra em pedaços
        const [glyph, tone, text] = !typed.trim()
          ? ["info", "var(--muted)", "Nome livre para um Pix a outra pessoa, ou o nome de uma conta sua para mover dinheiro entre contas."]
          : target
            ? ["swap", "var(--info)", `<b>Entre contas suas.</b> Sai de uma e entra em <b>${esc(target.name)}</b> — não conta como gasto do mês.`]
            : ["arrowRight", "var(--warn)", `<b>Sai para fora.</b> O dinheiro vai para <b>${esc(typed.trim())}</b> e entra no total de gastos do mês.`];
        hint.innerHTML = `<span style="color:${tone};flex:none;margin-top:1px">${icon(glyph, 14)}</span><span>${text}</span>`;
      };
      updateTransferHint();
      body.addEventListener("input", (event) => {
        if (event.target.name === "toName") updateTransferHint();
      });

      body.addEventListener("submit", (event) => {
        event.preventDefault();
        const form = readForm(body);
        const amount = parseMoney(form.amount);
        const ok = validate(body, {
          amount: () => (amount > 0 ? "" : "Informe um valor maior que zero."),
          date: (v) => (v ? "" : "Escolha a data."),
          ...(form.type === "transfer" ? {
            toName: (v) => {
              if (!v.trim()) return "Diga para quem vai o dinheiro.";
              const match = matchAccountByName(v);
              if (match && match.id === form.accountId) return "A origem e o destino são a mesma conta.";
              return "";
            },
            accountId: (v) => (v ? "" : "Escolha a conta de origem."),
          } : {}),
        });
        if (!ok) return;

        // no destino, texto que casa com uma conta sua vira transferência
        // interna; qualquer outro texto é dinheiro saindo para fora
        const target = form.type === "transfer" ? matchAccountByName(form.toName) : null;
        const payload = {
          type: form.type,
          amount,
          date: form.date,
          description: form.description?.trim(),
          categoryId: form.categoryId || null,
          accountId: form.accountId || null,
          toAccountId: target?.id || null,
          toName: form.type === "transfer" ? (target ? null : form.toName.trim()) : null,
          cardId: form.type === "transfer" ? null : (form.cardId || null),
          method: form.type === "transfer" ? "ted" : (form.method || null),
          paid: !!form.paid,
          notes: form.notes || "",
        };

        if (isEdit) {
          applyTxEdit(existing, payload);
        } else {
          const created = addTransaction({ ...payload, installments: Number(form.installments) || 1 });
          const what = payload.type === "income" ? "Receita"
            : payload.type !== "transfer" ? "Despesa"
            : target ? `Transferência para ${target.name}` : `Transferência para ${payload.toName}`;
          toast(created.length > 1
            ? `${created.length} parcelas criadas — ${money(sum(created, (c) => c.amount))}`
            : `${what} de ${money(amount)} registrada`);
        }
        commit();
        close();
        haptic();
      });
    },
  });
  return modal;
}

/** Contas do usuário mais a opção de cadastrar outra na hora. */
const accountsWithNew = () => [
  ...activeAccounts().map((a) => ({ value: a.id, label: a.name })),
  { value: "__new__", label: "➕ Cadastrar outra conta…" },
];

/**
 * Campo "Para quem": texto livre com sugestões das contas do usuário e de
 * quem já recebeu transferência antes. Aceitar texto é o ponto — a maioria
 * das transferências vai para uma pessoa, não para outra conta sua.
 */
function destinationInput(tx) {
  const current = tx.toName || (tx.toAccountId ? accById(tx.toAccountId)?.name : "") || "";
  const recent = transferNames().slice(0, 12);
  return `
    <input class="input" name="toName" list="destOptions" autocomplete="off" maxlength="60"
      placeholder="Ex.: João da padaria, Maria, minha poupança" value="${esc(current)}">
    <datalist id="destOptions">
      ${activeAccounts().map((a) => `<option value="${esc(a.name)}">minha conta</option>`).join("")}
      ${recent.map((r) => `<option value="${esc(r.name)}">já usado ${r.count}x</option>`).join("")}
    </datalist>
    ${recent.length ? `<div class="row gap-6 wrap mt-8">
      ${recent.slice(0, 5).map((r) => `<button type="button" class="chip" data-dest="${esc(r.name)}">${esc(r.name)}</button>`).join("")}
    </div>` : ""}`;
}

/** Casa o texto digitado com uma conta do usuário, ignorando acento e caixa. */
function matchAccountByName(text) {
  const needle = normalize(text);
  if (!needle) return null;
  return activeAccounts().find((a) => normalize(a.name) === needle) || null;
}

/** Edição respeitando séries de parcelas. */
async function applyTxEdit(existing, payload) {
  if (!existing.installment) {
    updateTransaction(existing.id, payload, "one");
    toast("Lançamento atualizado");
    return;
  }
  const scope = await choiceDialog({
    title: "Esta compra é parcelada",
    message: `Parcela ${existing.installment.index} de ${existing.installment.of}. O que você quer alterar?`,
    options: [
      { value: "one", label: "Somente esta parcela", hint: "As outras ficam como estão", icon: "check" },
      { value: "future", label: "Esta e as próximas", hint: `Afeta ${existing.installment.of - existing.installment.index + 1} parcelas`, icon: "arrowRight" },
      { value: "all", label: "Todas as parcelas", hint: `Afeta as ${existing.installment.of} parcelas`, icon: "layers" },
    ],
  });
  if (!scope) return;
  updateTransaction(existing.id, payload, scope);
  toast("Lançamento atualizado");
  commit();
}

async function confirmTxDelete(tx) {
  if (tx.installment) {
    const scope = await choiceDialog({
      title: "Excluir parcelamento",
      message: `Parcela ${tx.installment.index} de ${tx.installment.of}.`,
      options: [
        { value: "one", label: "Somente esta parcela", icon: "check" },
        { value: "future", label: "Esta e as próximas", icon: "arrowRight" },
        { value: "all", label: "Todas as parcelas", icon: "trash" },
      ],
    });
    if (!scope) return false;
    const count = deleteTransaction(tx.id, scope);
    commit();
    toast(`${count} lançamento${count > 1 ? "s" : ""} excluído${count > 1 ? "s" : ""}`);
    return true;
  }
  const ok = await confirmDialog({
    title: "Excluir lançamento",
    message: `Remover <b>${esc(tx.description || "este lançamento")}</b> de ${money(tx.amount)}? Não dá para desfazer.`,
    confirmLabel: t("delete"), tone: "danger", iconName: "trash",
  });
  if (!ok) return false;
  deleteTransaction(tx.id, "one");
  commit();
  toast("Lançamento excluído");
  return true;
}

/** Menu de ações rápidas de um lançamento. */
function openTxActions(tx, anchor) {
  const items = [
    { label: t("edit"), icon: "pencil", onClick: () => openTransactionModal(tx) },
    { label: tx.paid ? t("markPending") : t("markPaid"), icon: tx.paid ? "clock" : "check",
      onClick: () => { updateTransaction(tx.id, { paid: !tx.paid }); commit(); toast(tx.paid ? "Marcado como pendente" : "Marcado como pago"); } },
    { label: t("duplicate"), icon: "copy",
      onClick: () => { openTransactionModal(null, { type: tx.type, categoryId: tx.categoryId, accountId: tx.accountId }); } },
    "-",
    { label: t("delete"), icon: "trash", danger: true, onClick: () => confirmTxDelete(tx) },
  ];
  showPopover(anchor, items);
}

/** Ao escolher o banco, a cor da conta/cartão passa a ser a da marca. */
function syncColorToBank(root, { onChange = null } = {}) {
  root.addEventListener("bankchange", (event) => {
    const bank = bankById(event.detail);
    if (!bank || bank.id === "outro") return;
    const wrap = $("[data-colorpicker]", root);
    if (wrap) {
      $("input[type=hidden]", wrap).value = bank.color;
      // a paleta fixa pode não ter a cor exata da marca: só realça se houver
      $$(".color-dot", wrap).forEach((dot) => dot.setAttribute("aria-pressed",
        String(dot.dataset.color.toLowerCase() === bank.color.toLowerCase())));
    }
    const nameField = $("[name='name']", root);
    if (nameField && !nameField.value.trim()) nameField.value = bank.name;
    onChange?.(bank);
  });
}

/* --------------------------------------------------------------------------
   Conta
   -------------------------------------------------------------------------- */
const ACCOUNT_TYPES = [
  { value: "checking", label: "Conta corrente" },
  { value: "savings", label: "Poupança" },
  { value: "cash", label: "Dinheiro" },
  { value: "wallet", label: "Carteira digital" },
  { value: "investment", label: "Investimento" },
];

function openAccountModal(existing = null, { onCreated = null } = {}) {
  const account = existing || {
    name: "", type: "checking", bankId: "", color: PALETTE[0],
    openingBalance: 0, openingDate: `${thisMonth()}-01`, archived: false,
  };
  const body = el("form", { class: "col gap-16", id: "accForm", novalidate: true });
  body.innerHTML = `
    ${field("Banco", bankPicker("bankId", account.bankId), { span: true })}
    <div class="form-grid">
      ${field("Nome da conta", textInput("name", account.name, { placeholder: "Ex.: Conta do dia a dia", required: true, maxlength: 40 }), { span: true })}
      ${field("Tipo", selectInput("type", ACCOUNT_TYPES, account.type))}
      ${field("Saldo inicial", moneyInput("openingBalance", account.openingBalance ? num(account.openingBalance, 2) : ""))}
      ${field("A partir de", textInput("openingDate", account.openingDate, { type: "date" }))}
      ${field("Cor de destaque", colorPicker("color", account.color))}
    </div>
    ${existing ? `<div class="card card-pad-sm" style="background:var(--surface-2)">${switchInput("archived", account.archived, "Arquivar conta", "Some das listas, mas o histórico continua")}</div>` : ""}`;

  const save = el("button", { type: "submit", form: "accForm", class: "btn btn-primary", text: t("save") });
  const footer = el("div", { class: "row gap-8", style: { width: "100%", justifyContent: "space-between" } });
  const left = el("div", {});
  if (existing) {
    const remove = el("button", { type: "button", class: "btn btn-danger btn-icon", html: icon("trash", 16), "aria-label": t("delete") });
    remove.addEventListener("click", async () => {
      const used = db().transactions.filter((tx) => tx.accountId === existing.id || tx.toAccountId === existing.id).length;
      const ok = await confirmDialog({
        title: "Excluir conta",
        message: used
          ? `<b>${esc(existing.name)}</b> tem ${used} lançamento(s) vinculado(s). Eles ficam sem conta. Prefere arquivar?`
          : `Remover <b>${esc(existing.name)}</b>?`,
        confirmLabel: "Excluir mesmo assim", tone: "danger", iconName: "trash",
      });
      if (!ok) return;
      for (const tx of db().transactions) {
        if (tx.accountId === existing.id) tx.accountId = null;
        if (tx.toAccountId === existing.id) tx.toAccountId = null;
      }
      removeFrom("accounts", existing.id);
      commit();
      toast("Conta excluída");
      modal.close();
    });
    left.append(remove);
  }
  footer.append(left, el("div", { class: "row gap-8" }, [
    el("button", { type: "button", class: "btn", text: t("cancel"), onclick: () => modal.close() }), save,
  ]));

  const modal = openModal({
    title: existing ? "Editar conta" : "Nova conta", iconName: "bank", body, footer,
    onMount: ({ close }) => {
      bindPickers(body);
      syncColorToBank(body);
      body.addEventListener("submit", (event) => {
        event.preventDefault();
        const form = readForm(body);
        if (!validate(body, { name: (v) => (v.trim() ? "" : "Dê um nome para a conta.") })) return;
        const saved = upsert("accounts", {
          ...(existing ? { id: existing.id } : {}),
          name: form.name.trim(), type: form.type, bankId: form.bankId || "outro",
          color: form.color, openingBalance: parseMoney(form.openingBalance),
          openingDate: form.openingDate || `${thisMonth()}-01`,
          archived: !!form.archived,
        });
        commit();
        toast(existing ? "Conta atualizada" : "Conta criada");
        close();
        if (!existing) onCreated?.(saved);
      });
    },
  });
}

    closingDay: 1, dueDay: 10, accountId: activeAccounts()[0]?.id || "", archived: false,

  body.innerHTML = `
    <div id="cardPreview"></div>
    ${field("Banco emissor", bankPicker("bankId", card.bankId), { span: true })}
    <div class="form-grid">
      ${field("Apelido do cartão", textInput("name", card.name, { placeholder: "Ex.: Nubank Roxinho", required: true, maxlength: 32 }), { span: true })}
      ${field("Bandeira", selectInput("brand", CARD_BRANDS, card.brand))}
      ${field("Limite", moneyInput("limit", card.limit ? num(card.limit, 2) : ""))}
      ${field("Fecha no", selectInput("closingDay", dayOptions, card.closingDay))}
      ${field("Vence no", selectInput("dueDay", dayOptions, card.dueDay))}
      ${field("Conta que paga a fatura", selectInput("accountId", accountsWithNew(), card.accountId, { placeholder: "Nenhuma" }), { span: true, hint: "Vincule para saber de onde sai o dinheiro no vencimento" })}
      ${field("Cor", colorPicker("color", card.color), { span: true })}
    </div>
    ${existing ? `<div class="card card-pad-sm" style="background:var(--surface-2)">${switchInput("archived", card.archived, "Arquivar cartão")}</div>` : ""}`;

  const drawPreview = () => {
    const form = readForm(body);
    $("#cardPreview", body).innerHTML = creditCardVisual({
      name: form.name || "Seu cartão", brand: form.brand, color: form.color, bankId: form.bankId,
      limit: parseMoney(form.limit), used: existing ? cardUsage(existing.id) : 0,
      closingDay: form.closingDay, dueDay: form.dueDay,
    });
  };

  const footer = el("div", { class: "row gap-8", style: { width: "100%", justifyContent: "space-between" } });
  const left = el("div", {});
  if (existing) {
    const remove = el("button", { type: "button", class: "btn btn-danger btn-icon", html: icon("trash", 16), "aria-label": t("delete") });
    remove.addEventListener("click", async () => {
      const used = db().transactions.filter((tx) => tx.cardId === existing.id).length;
      const ok = await confirmDialog({
        title: "Excluir cartão",
        message: used ? `<b>${esc(existing.name)}</b> tem ${used} lançamento(s). Eles perdem o vínculo com o cartão.` : `Remover <b>${esc(existing.name)}</b>?`,
        confirmLabel: "Excluir", tone: "danger", iconName: "trash",
      });
      if (!ok) return;
      for (const tx of db().transactions) if (tx.cardId === existing.id) tx.cardId = null;
      removeFrom("cards", existing.id);
      commit();
      toast("Cartão excluído");
      modal.close();
    });
    left.append(remove);
  }
  footer.append(left, el("div", { class: "row gap-8" }, [
    el("button", { type: "button", class: "btn", text: t("cancel"), onclick: () => modal.close() }),
    el("button", { type: "submit", form: "cardForm", class: "btn btn-primary", text: t("save") }),
  ]));

  const modal = openModal({
    title: existing ? "Editar cartão" : "Novo cartão", iconName: "card", body, footer,
    onMount: ({ close }) => {
      bindPickers(body);
      syncColorToBank(body, { onChange: () => setTimeout(drawPreview, 0) });
      drawPreview();
      body.addEventListener("input", debounce(drawPreview, 120));
      body.addEventListener("click", (event) => { if (event.target.closest(".color-dot")) setTimeout(drawPreview, 0); });
      body.addEventListener("submit", (event) => {
        event.preventDefault();
        const form = readForm(body);
        if (!validate(body, { name: (v) => (v.trim() ? "" : "Dê um apelido ao cartão.") })) return;
        const saved = upsert("cards", {
          ...(existing ? { id: existing.id } : {}),

          limit: parseMoney(form.limit),

          accountId: form.accountId || null, archived: !!form.archived,
        });
        commit();
        toast(existing ? "Cartão atualizado" : "Cartão criado");
        close();
        if (!existing) onCreated?.(saved);
      });
    },
  });
}

/** Cartão desenhado, usado no preview e na página de carteiras. */
function creditCardVisual(card) {
  const ink = readableInk(card.color);
  const used = card.used || 0;
  const share = card.limit ? pct(used, card.limit) : 0;
  return `<div class="credit-card" style="background:linear-gradient(135deg, ${card.color}, ${alpha(card.color, 0.72)});color:${ink}">
    <div class="row-between">
      <div class="row gap-10" style="min-width:0">
        ${card.bankId && card.bankId !== "outro" ? bankLogo(card.bankId, 34, { radius: 9 }) : `<span class="cc-chip"></span>`}
        <div style="min-width:0">
          <div class="f-14 w-700 truncate" style="max-width:150px">${esc(card.name)}</div>
          ${card.bankId && card.bankId !== "outro" ? `<div class="f-11" style="opacity:.85">${esc(bankById(card.bankId)?.name || "")}</div>` : ""}
        </div>
      </div>
      <div class="right">
        <div class="f-11" style="opacity:.8">${esc(card.brand || "")}</div>
        <div class="f-11" style="opacity:.8;margin-top:2px">fecha ${esc(card.closingDay)} · vence ${esc(card.dueDay)}</div>
      </div>
    </div>
    <div>
      ${card.limit ? `
        <div class="row-between f-11 mb-4" style="opacity:.9">
          <span>${esc(money(used))} em aberto</span>
          <span>${esc(pctText(share))} de ${esc(moneyShort(card.limit))}</span>
        </div>
        <div class="bar" style="background:${alpha(ink, 0.22)}">
          <div class="bar-fill" style="width:${share}%;background:${ink}"></div>
        </div>` : `<div class="f-11" style="opacity:.85">Sem limite cadastrado</div>`}
    </div>
  </div>`;
}

/** Depósito ou retirada de uma meta. */
function openGoalMoveModal(goal, direction = "deposit") {
  const isDeposit = direction === "deposit";
  const progress = goalProgress(goal.id);
  const body = el("form", { class: "col gap-16", id: "moveForm", novalidate: true });
  body.innerHTML = `
    <div class="card card-pad-sm row gap-12" style="background:var(--surface-2)">
      <span class="avatar-icon" style="background:${alpha(goal.color, 0.18)};font-size:17px">${esc(goal.emoji)}</span>
      <span class="grow">
        <span class="f-13 w-700" style="display:block">${esc(goal.name)}</span>
        <span class="f-11 muted">${esc(money(progress.saved))} de ${esc(money(goal.target))}</span>
      </span>
      <span class="f-14 w-800 num" style="color:${goal.color}">${esc(pctText(progress.share))}</span>
    </div>
    ${field(isDeposit ? "Quanto guardar" : "Quanto retirar", moneyInput("amount", "", { required: true }))}
    ${field(t("date"), textInput("date", todayKey(), { type: "date" }))}
    ${field("De qual conta", selectInput("accountId", activeAccounts().map((a) => ({ value: a.id, label: a.name })), goal.accountId || activeAccounts()[0]?.id, { placeholder: "Nenhuma" }))}
    ${!isDeposit && progress.saved > 0 ? `<div class="f-11 faint">Disponível para retirada: ${esc(money(progress.saved))}</div>` : ""}`;

  const footer = el("div", { class: "row gap-8", style: { width: "100%", justifyContent: "flex-end" } }, [
    el("button", { type: "button", class: "btn", text: t("cancel"), onclick: () => modal.close() }),
    el("button", { type: "submit", form: "moveForm", class: `btn btn-primary`, text: isDeposit ? "Guardar" : "Retirar" }),
  ]);

  const modal = openModal({
    title: isDeposit ? "Guardar na meta" : "Retirar da meta", iconName: "piggy", body, footer, size: "sm",
    onMount: ({ close }) => {
      body.addEventListener("submit", (event) => {
        event.preventDefault();
        const form = readForm(body);
        const amount = parseMoney(form.amount);
        if (!validate(body, {
          amount: () => {
            if (amount <= 0) return "Informe um valor maior que zero.";
            if (!isDeposit && amount > progress.saved) return `Você só tem ${money(progress.saved)} guardado.`;
            return "";
          },
        })) return;
        db().transactions.push(normalizeTx({
          type: isDeposit ? "expense" : "income",
          amount, date: form.date || todayKey(),
          description: `${isDeposit ? "Guardado em" : "Retirado de"} ${goal.name}`,
          accountId: form.accountId || null,
          goalId: goal.id, paid: true,
        }));
        commit();
        toast(isDeposit ? `${money(amount)} guardado em ${goal.name}` : `${money(amount)} retirado de ${goal.name}`);
        close();
        haptic();
      });
    },
  });
}

      ${field(t("description"), textInput("description", rule.description, { placeholder: "Ex.: aluguel", required: true, maxlength: 60 }))}
      ${field(t("amount"), moneyInput("amount", rule.amount ? num(rule.amount, 2) : "", { required: true }))}
      ${field("Forma de pagamento", methodPicker("method", rule.method || "pix"))}
      <div class="form-grid">
        ${field("Frequência", selectInput("frequency", Object.entries(FREQUENCIES).map(([value, f]) => ({ value, label: f.label })), rule.frequency))}
        ${field("Dia do mês", selectInput("day", Array.from({ length: 31 }, (_, i) => ({ value: i + 1, label: `Dia ${i + 1}` })), rule.day), { hint: "Usado nas frequências mensais" })}
        ${field(t("category"), selectInput("categoryId", [
          ...cats.map((c) => ({ value: c.id, label: `${c.emoji} ${c.name}` })),
          { value: "__new__", label: "➕ Criar nova categoria…" },
        ], rule.categoryId, { placeholder: "Sem categoria" }))}
        ${field(t("account"), selectInput("accountId", accountsWithNew(), rule.accountId, { placeholder: "Nenhuma" }))}
        ${activeCards().length && type === "expense" ? field(t("card"), selectInput("cardId", activeCards().map((c) => ({ value: c.id, label: c.name })), rule.cardId, { placeholder: "Sem cartão" })) : ""}
        ${field("Começa em", textInput("startDate", rule.startDate, { type: "date", required: true }))}
        ${field("Termina em", textInput("endDate", rule.endDate || "", { type: "date" }), { hint: "Deixe vazio para não ter fim" })}
      </div>
      <div class="card card-pad-sm col gap-12" style="background:var(--surface-2)">
        ${switchInput("autoPay", rule.autoPay !== false, "Débito automático", "Marca como pago assim que a data chega")}
        ${switchInput("active", rule.active !== false, "Ativa", "Pausar interrompe a geração de novos lançamentos")}
      </div>`;
  };
  render(rule.type);

  const footer = el("div", { class: "row gap-8", style: { width: "100%", justifyContent: "space-between" } });
  const left = el("div", {});
  if (existing) {
    const remove = el("button", { type: "button", class: "btn btn-danger btn-icon", html: icon("trash", 16), "aria-label": t("delete") });
    remove.addEventListener("click", async () => {
      const scope = await choiceDialog({
        title: "Excluir recorrência",
        message: "O que fazer com os lançamentos já gerados?",
        options: [
          { value: "keep", label: "Manter o histórico", hint: "Remove só os futuros em aberto", icon: "check" },
          { value: "purge", label: "Apagar tudo", hint: "Remove todos os lançamentos desta regra", icon: "trash" },
        ],
      });
      if (!scope) return;
      detachRecurring(existing.id, { keepPast: scope === "keep" });
      removeFrom("recurring", existing.id);
      commit();
      toast("Recorrência excluída");
      modal.close();
    });
    left.append(remove);
  }
  footer.append(left, el("div", { class: "row gap-8" }, [
    el("button", { type: "button", class: "btn", text: t("cancel"), onclick: () => modal.close() }),
    el("button", { type: "submit", form: "recForm", class: "btn btn-primary", text: t("save") }),
  ]));

  const modal = openModal({
    title: existing ? "Editar recorrência" : "Nova recorrência", iconName: "repeat", body, footer,
    onMount: ({ close }) => {
      bindPickers(body);
      body.addEventListener("segchange", (event) => {
        Object.assign(rule, readForm(body), { amount: parseMoney(readForm(body).amount) || "" });
        render(event.detail);
      });
      body.addEventListener("change", (event) => {
        const select = event.target;
        if (select.value !== "__new__") return;
        const form = readForm(body);
        for (const key of Object.keys(form)) if (form[key] === "__new__") form[key] = "";
        Object.assign(rule, form, { amount: parseMoney(form.amount) || "" });
        select.value = "";
        const kind = form.type === "income" ? "income" : "expense";
        if (select.name === "categoryId") {
          openCategoryModal(null, kind, { onCreated: (cat) => { rule.categoryId = cat.id; render(form.type); } });
        } else if (select.name === "accountId") {
          openAccountModal(null, { onCreated: (acc) => { rule.accountId = acc.id; render(form.type); } });
        }
      });
      body.addEventListener("submit", (event) => {
        event.preventDefault();
        const form = readForm(body);
        const amount = parseMoney(form.amount);
        if (!validate(body, {
          description: (v) => (v.trim() ? "" : "Descreva a recorrência."),
          amount: () => (amount > 0 ? "" : "Informe um valor maior que zero."),
          startDate: (v) => (v ? "" : "Escolha a data de início."),
          endDate: (v) => (!v || v >= form.startDate ? "" : "O fim precisa vir depois do início."),
        })) return;

        const saved = upsert("recurring", {
          ...(existing ? { id: existing.id } : {}),
          type: form.type, amount, description: form.description.trim(),
          categoryId: form.categoryId || null, accountId: form.accountId || null, cardId: form.cardId || null,
          method: form.method || null,
          frequency: form.frequency, day: Number(form.day),
          startDate: form.startDate, endDate: form.endDate || null,
          active: !!form.active, autoPay: !!form.autoPay, notes: form.notes || "",
        });
        // regenera para refletir a alteração imediatamente
        if (existing) detachRecurring(saved.id, { keepPast: true });
        const created = materializeRecurring();
        commit();
        toast(existing ? "Recorrência atualizada" : `Recorrência criada — ${created} lançamento(s) programado(s)`);
        close();
      });
    },
  });
}

function pageDashboard() {

  return "Boa noite.";
}

/* --------------------------------------------------------------------------

   -------------------------------------------------------------------------- */
function pageTransactions() {
  const filters = state.filters;
  const scopeAll = filters.scope === "all";
  const base = scopeAll ? db().transactions : txOfMonth(state.month);

  const filtered = base.filter((tx) => {
    if (filters.type && filters.type !== "all" && tx.type !== filters.type) return false;
    if (filters.categoryId && tx.categoryId !== filters.categoryId) return false;
    if (filters.accountId && tx.accountId !== filters.accountId) return false;
    if (filters.cardId && tx.cardId !== filters.cardId) return false;
    if (filters.status === "pending" && tx.paid) return false;
    if (filters.status === "paid" && !tx.paid) return false;
    if (filters.status === "late" && (tx.paid || tx.date >= todayKey())) return false;
    if (filters.method && tx.method !== filters.method) return false;
    if (filters.q) {
      const needle = normalize(filters.q);
      const haystack = normalize([tx.description, catById(tx.categoryId)?.name, accById(tx.accountId)?.name, cardById(tx.cardId)?.name, tx.notes].join(" "));
      if (!haystack.includes(needle)) return false;
    }
    return true;
  }).sort((a, b) => (a.date === b.date ? (b.createdAt || "").localeCompare(a.createdAt || "") : b.date.localeCompare(a.date)));

  const income = sum(filtered.filter((tx) => tx.type === "income"), (tx) => tx.amount);
  const expense = sum(filtered.filter((tx) => tx.type === "expense"), (tx) => tx.amount);
  const activeFilters = ["type", "categoryId", "accountId", "cardId", "status", "method"].filter((k) => filters[k] && filters[k] !== "all").length;

  return `
    <div class="page-head">
      <div>
        <h1 class="page-title">${esc(t("transactions"))}</h1>
        <p class="page-sub">${filtered.length} lançamento(s) · ${esc(scopeAll ? "todo o histórico" : monthLabel(state.month))}</p>
      </div>
      <div class="row gap-8">
        ${scopeAll ? "" : monthNav(state.month)}
        <button class="btn btn-primary" data-action="new-tx">${icon("plus", 15)} <span class="hide-sm">Novo</span></button>
      </div>
    </div>

    <div class="card card-pad-sm mb-16 col gap-12">
      <div class="row gap-8 wrap">
        <div class="grow" style="position:relative;min-width:180px">
          <span style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none">${icon("search", 16)}</span>
          <input class="input" id="txSearch" placeholder="${esc(t("search"))} descrição, categoria, conta…" value="${esc(filters.q || "")}" style="padding-left:36px">
        </div>
        <button class="btn ${activeFilters ? "btn-soft" : ""}" data-action="filters">
          ${icon("filter", 15)} ${esc(t("filter"))}${activeFilters ? ` (${activeFilters})` : ""}
        </button>
        <button class="btn btn-icon" data-action="export-csv" title="Exportar CSV" aria-label="Exportar CSV">${icon("download", 16)}</button>
      </div>
      <div class="seg seg-fill" data-scope>
        <button data-value="month" aria-pressed="${!scopeAll}">${esc(monthLabel(state.month, true))}</button>
        <button data-value="all" aria-pressed="${scopeAll}">Todo o histórico</button>
      </div>
      ${activeFilters || filters.q ? `
        <div class="row gap-6 wrap">
          ${filters.q ? `<button class="chip" aria-pressed="true" data-clear="q">"${esc(filters.q)}" ${icon("x", 12)}</button>` : ""}
          ${filters.type && filters.type !== "all" ? `<button class="chip" aria-pressed="true" data-clear="type">${esc(t(filters.type))} ${icon("x", 12)}</button>` : ""}
          ${filters.categoryId ? `<button class="chip" aria-pressed="true" data-clear="categoryId">${esc(catById(filters.categoryId)?.name || "")} ${icon("x", 12)}</button>` : ""}
          ${filters.accountId ? `<button class="chip" aria-pressed="true" data-clear="accountId">${esc(accById(filters.accountId)?.name || "")} ${icon("x", 12)}</button>` : ""}
          ${filters.cardId ? `<button class="chip" aria-pressed="true" data-clear="cardId">${esc(cardById(filters.cardId)?.name || "")} ${icon("x", 12)}</button>` : ""}
          ${filters.status ? `<button class="chip" aria-pressed="true" data-clear="status">${esc({ paid: "Pagos", pending: "Pendentes", late: "Atrasados" }[filters.status])} ${icon("x", 12)}</button>` : ""}
          ${filters.method ? `<button class="chip" aria-pressed="true" data-clear="method">${esc(methodLabel(filters.method))} ${icon("x", 12)}</button>` : ""}
          <button class="btn btn-ghost btn-sm" data-clear="all">limpar tudo</button>
        </div>` : ""}
      <div class="row gap-16 f-12" style="padding-top:2px">
        <span class="row gap-6"><span class="chip-dot" style="background:var(--income)"></span>${esc(money(income))}</span>
        <span class="row gap-6"><span class="chip-dot" style="background:var(--expense)"></span>${esc(money(expense))}</span>
        <span class="grow right w-700 num ${income - expense >= 0 ? "pos" : "neg"}">${esc(money(income - expense, { sign: true }))}</span>
      </div>
    </div>

    <div class="card card-pad-sm">${txListByDay(filtered)}</div>`;
}

pageHandlers.transactions = (root) => {
  const search = $("#txSearch", root);
  if (search) {
    search.addEventListener("input", debounce((event) => {
      state.filters.q = event.target.value;
      render();
      const next = $("#txSearch");
      if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); }
    }, 260));
  }
  delegate(root, "click", "[data-scope] button", (event, node) => {
    state.filters.scope = node.dataset.value;
    render();
  });
  delegate(root, "click", "[data-clear]", (event, node) => {
    const key = node.dataset.clear;
    if (key === "all") state.filters = { scope: state.filters.scope };
    else delete state.filters[key];
    render();
  });
  delegate(root, "click", "[data-action='filters']", () => openFiltersModal());
  delegate(root, "click", "[data-action='export-csv']", () => {
    const list = state.filters.scope === "all" ? db().transactions : txOfMonth(state.month);
    download(`gasto-esperto-${state.filters.scope === "all" ? "historico" : state.month}.csv`, transactionsToCsv(list), "text/csv");

  });
};

function openFiltersModal() {
  const filters = state.filters;
  const body = el("form", { class: "col gap-16", id: "filtForm", novalidate: true });
  body.innerHTML = `
    ${field("Tipo", segInput("type", [
      { value: "all", label: t("all") }, { value: "expense", label: t("expense") },
      { value: "income", label: t("income") }, { value: "transfer", label: t("transfer") },
    ], filters.type || "all"))}
    ${field("Situação", segInput("status", [
      { value: "", label: t("all") }, { value: "paid", label: "Pagos" },
      { value: "pending", label: "Pendentes" }, { value: "late", label: "Atrasados" },
    ], filters.status || ""))}
    <div class="form-grid">
      ${field(t("category"), selectInput("categoryId", db().categories.map((c) => ({ value: c.id, label: `${c.emoji} ${c.name}` })), filters.categoryId, { placeholder: "Todas" }))}
      ${field(t("account"), selectInput("accountId", db().accounts.map((a) => ({ value: a.id, label: a.name })), filters.accountId, { placeholder: "Todas" }))}
      ${activeCards().length ? field(t("card"), selectInput("cardId", db().cards.map((c) => ({ value: c.id, label: c.name })), filters.cardId, { placeholder: "Todos" }), { span: true }) : ""}
      ${field("Forma de pagamento", selectInput("method", Object.keys(PAYMENT_METHODS).map((id) => ({ value: id, label: methodLabel(id) })), filters.method, { placeholder: "Todas" }), { span: true })}
    </div>`;

  const footer = el("div", { class: "row gap-8", style: { width: "100%", justifyContent: "space-between" } }, [
    el("button", { type: "button", class: "btn btn-ghost", text: "Limpar", onclick: () => { state.filters = { scope: state.filters.scope }; modal.close(); render(); } }),
    el("button", { type: "submit", form: "filtForm", class: "btn btn-primary", text: "Aplicar" }),
  ]);

  const modal = openModal({
    title: "Filtrar lançamentos", iconName: "filter", body, footer, size: "sm",
    onMount: ({ close }) => {
      bindPickers(body);
      body.addEventListener("submit", (event) => {
        event.preventDefault();
        const form = readForm(body);
        Object.assign(state.filters, {
          type: form.type === "all" ? null : form.type,
          status: form.status || null,
          categoryId: form.categoryId || null,
          accountId: form.accountId || null,
          cardId: form.cardId || null,
          method: form.method || null,
        });
        close();
        render();
      });
    },
  });
}

/* --------------------------------------------------------------------------
   RECORRÊNCIAS
   -------------------------------------------------------------------------- */
function pageRecurring() {
  const rules = db().recurring;
  const active = rules.filter((r) => r.active);
  const monthlyExpense = sum(active.filter((r) => r.type === "expense"), (r) => normalizeToMonthly(r));
  const monthlyIncome = sum(active.filter((r) => r.type === "income"), (r) => normalizeToMonthly(r));

  const card = (rule) => {
    const category = catById(rule.categoryId);
    const nextDate = nextOccurrence(rule);
    return `<div class="card ${rule.active ? "" : "card-flat"}" style="${rule.active ? "" : "opacity:.6"}">
      <div class="row gap-12 mb-12">
        <span class="avatar-icon" style="background:${alpha(category?.color || "#64748B", 0.16)};font-size:16px">${esc(category?.emoji || "🔁")}</span>
        <span class="grow" style="min-width:0">
          <span class="f-14 w-700 truncate" style="display:block">${esc(rule.description)}</span>
          <span class="f-11 muted">${esc(FREQUENCIES[rule.frequency]?.label || "Mensal")}${rule.frequency.includes("month") || rule.frequency === "yearly" ? ` · dia ${rule.day}` : ""}</span>
        </span>
        <button class="btn btn-ghost btn-icon btn-sm" data-rec-menu="${esc(rule.id)}" aria-label="Ações">${icon("more", 16)}</button>
      </div>
      <div class="row-between">
        <div>
          <div class="f-20 w-800 num" style="color:var(--${rule.type === "income" ? "income" : "expense"})">${esc(money(rule.amount))}</div>
          <div class="f-11 faint mt-4">${esc(category?.name || "Sem categoria")}${rule.cardId ? ` · ${esc(cardById(rule.cardId)?.name || "")}` : ""}</div>
        </div>
        <div class="right">
          ${rule.active
            ? `<span class="badge badge-accent">próxima ${esc(nextDate ? dateLabel(nextDate) : "—")}</span>`
            : `<span class="badge">pausada</span>`}
          ${rule.autoPay ? `<div class="f-11 faint mt-4">débito automático</div>` : ""}
        </div>
      </div>
      ${rule.endDate ? `<div class="f-11 faint mt-8">Termina em ${esc(dateLabel(rule.endDate, { year: true }))}</div>` : ""}
    </div>`;
  };

  return `
    <div class="page-head">
      <div>
        <h1 class="page-title">${esc(t("recurring"))}</h1>
        <p class="page-sub">Lançamentos que se repetem sozinhos, sem você lembrar</p>
      </div>
      <button class="btn btn-primary" data-action="new-recurring">${icon("plus", 15)} Nova recorrência</button>
    </div>

    <div class="grid grid-kpi keep-2 mb-16">
      ${kpiCard({ label: "Compromissos fixos", value: money(monthlyExpense), iconName: "repeat", tone: "neg", sub: `<span class="faint">por mês, equivalente</span>` })}
      ${kpiCard({ label: "Receitas fixas", value: money(monthlyIncome), iconName: "arrowUp", tone: "pos", sub: `<span class="faint">por mês, equivalente</span>` })}
      ${kpiCard({ label: "Sobra fixa", value: money(monthlyIncome - monthlyExpense), iconName: "wallet", tone: monthlyIncome - monthlyExpense >= 0 ? "pos" : "neg", sub: `<span class="faint">antes dos gastos variáveis</span>` })}
      ${kpiCard({ label: "Regras ativas", value: `${active.length}/${rules.length}`, iconName: "zap", tone: "accent", sub: `<span class="faint">geradas até 2 meses à frente</span>` })}
    </div>

    ${rules.length ? `<div class="grid grid-3">${rules.map(card).join("")}</div>` : `
      <div class="card">${emptyState({
        iconName: "repeat", title: "Nenhuma recorrência ainda",
        text: "Cadastre aluguel, salário, assinaturas e mensalidades. O app gera os lançamentos automaticamente todo período.",
        action: `<button class="btn btn-primary" data-action="new-recurring">${icon("plus", 15)} Criar a primeira</button>`,
      })}</div>`}`;
}

/** Converte qualquer frequência em valor mensal equivalente. */
function normalizeToMonthly(rule) {
  const factor = { weekly: 4.345, biweekly: 2.17, monthly: 1, bimonthly: 0.5, quarterly: 1 / 3, semiannual: 1 / 6, yearly: 1 / 12 };
  return round2(rule.amount * (factor[rule.frequency] ?? 1));
}

/** Próxima data futura ainda não paga de uma regra. */
function nextOccurrence(rule) {
  const future = db().transactions
    .filter((tx) => tx.recurringId === rule.id && tx.date >= todayKey())
    .sort((a, b) => a.date.localeCompare(b.date));
  return future[0]?.date || null;
}

pageHandlers.recurring = (root) => {
  delegate(root, "click", "[data-rec-menu]", (event, node) => {
    event.stopPropagation();
    const rule = findById(db().recurring, node.dataset.recMenu);
    if (!rule) return;
    showPopover(node, [
      { label: t("edit"), icon: "pencil", onClick: () => openRecurringModal(rule) },
      { label: rule.active ? "Pausar" : "Reativar", icon: rule.active ? "clock" : "zap", onClick: () => {
        rule.active = !rule.active;
        if (!rule.active) detachRecurring(rule.id, { keepPast: true });
        else materializeRecurring();
        commit();
        toast(rule.active ? "Recorrência reativada" : "Recorrência pausada");
      } },
      { label: "Ver lançamentos", icon: "layers", onClick: () => {
        state.filters = { scope: "all", q: rule.description };
        go("transactions");
      } },
    ]);
  });
};

   CARTÕES E CONTAS

function pageWallets() {
  const accounts = db().accounts.filter((a) => !a.archived);

    const balance = accountBalance(account.id);

    return `<button class="list-row is-button" data-account="${esc(account.id)}">
      ${bankLogo(account.bankId, 36)}
      <span class="grow" style="min-width:0">
        <span class="list-title truncate" style="display:block">${esc(account.name)}</span>
        <span class="list-meta">${bank && bank.id !== "outro" ? `<span>${esc(bank.name)}</span><span class="dot-sep">${esc(typeLabel)}</span>` : `<span>${esc(typeLabel)}</span>`}<span class="dot-sep">${movements} mov.</span></span>
      </span>

    const invoice = cardInvoice(card.id, state.month);
    const usage = cardUsage(card.id);
    return `<div class="col gap-10">
      <button data-card="${esc(card.id)}" style="text-align:left;width:100%">

      </button>
      <div class="card card-pad-sm">
        <div class="row-between mb-8">
          <span class="eyebrow">Fatura de ${esc(monthLabel(state.month, true))}</span>
          ${invoice.paid && invoice.items.length ? `<span class="badge badge-pos">paga</span>` : invoice.total ? `<span class="badge badge-warn">em aberto</span>` : ""}
        </div>
        <div class="row-between">
          <span class="f-20 w-800 num">${esc(money(invoice.total))}</span>
          <span class="right f-11 faint">
            fecha ${esc(dateLabel(invoice.closeDate))}<br>vence ${esc(dateLabel(invoice.dueDate))}
          </span>
        </div>
        ${invoice.items.length ? `
          <button class="btn btn-ghost btn-sm btn-block mt-12" data-invoice="${esc(card.id)}">
            ver ${invoice.items.length} lançamento(s) ${icon("chevronRight", 13)}
          </button>` : `<div class="f-11 faint mt-8">Nenhuma compra nesta fatura.</div>`}
      </div>

  };

  return `
    <div class="page-head">
      <div>
        <h1 class="page-title">${esc(t("wallets"))}</h1>
        <p class="page-sub">Saldo consolidado: <b class="num ${total >= 0 ? "pos" : "neg"}">${esc(money(total))}</b></p>
      </div>
      <div class="row gap-8">
        ${monthNav(state.month)}
        <button class="btn" data-action="new-account">${icon("bank", 15)} <span class="hide-sm">Conta</span></button>
        <button class="btn btn-primary" data-action="new-card">${icon("card", 15)} <span class="hide-sm">Cartão</span></button>
      </div>
    </div>

    <div class="grid grid-main">
      <div class="col gap-16">
        ${sectionCard("Cartões de crédito",
          cards.length ? `<div class="grid grid-2">${cards.map(cardBlock).join("")}</div>`
            : emptyState({ iconName: "card", title: "Nenhum cartão cadastrado", text: "Cadastre seus cartões para acompanhar faturas, limites e datas de fechamento.",
              action: `<button class="btn btn-primary" data-action="new-card">${icon("plus", 15)} Novo cartão</button>` }),
          { action: cards.length ? `<button class="btn btn-ghost btn-sm" data-action="new-card">${icon("plus", 14)} adicionar</button>` : "" })}
      </div>
      <div class="col gap-16">
        ${sectionCard("Contas",
          `<div class="list">${accounts.map(accountRow).join("")}</div>
           <div class="row-between mt-12" style="padding-top:12px;border-top:1px solid var(--border)">
             <span class="f-12 w-700">Total</span>
             <span class="f-16 w-800 num ${total >= 0 ? "pos" : "neg"}">${esc(money(total))}</span>
           </div>`,
          { action: `<button class="btn btn-ghost btn-sm" data-action="new-account">${icon("plus", 14)} adicionar</button>` })}

        ${archived.length ? sectionCard("Arquivadas",
          `<div class="list">${archived.map(accountRow).join("")}</div>`, { sub: "Não entram no saldo consolidado" }) : ""}

        ${sectionCard("Distribuição do saldo",
          accounts.length && total !== 0
            ? `<div class="center">${donutChart(accounts.map((a) => ({ name: a.name, value: Math.max(0, accountBalance(a.id)), color: a.color })).filter((s) => s.value > 0),

pageHandlers.wallets = (root) => {
  delegate(root, "click", "[data-account]", (event, node) => {
    const account = accById(node.dataset.account);
    if (account) openAccountModal(account);
  });
  delegate(root, "click", "[data-card]", (event, node) => {
    const card = cardById(node.dataset.card);
    if (card) openCardModal(card);
  });
  delegate(root, "click", "[data-invoice]", (event, node) => {
    event.stopPropagation();
    const card = cardById(node.dataset.invoice);
    if (!card) return;
    const invoice = cardInvoice(card.id, state.month);
    const footer = el("div", { class: "row gap-8", style: { width: "100%", justifyContent: "space-between" } });
    const close = el("button", { class: "btn", text: t("close") });
    const pay = el("button", { class: "btn btn-primary", text: invoice.paid ? "Marcar como em aberto" : "Marcar fatura como paga", disabled: !invoice.items.length });
    footer.append(close, pay);

    const modal = openModal({
      title: `Fatura ${card.name}`, iconName: "card", size: "lg", footer,
      body: `
        <div class="card card-pad-sm mb-16 row-between" style="background:var(--surface-2)">
          <div>
            <div class="eyebrow">Total da fatura</div>
            <div class="f-24 w-800 num">${esc(money(invoice.total))}</div>
          </div>
          <div class="right f-12 muted">
            Fecha ${esc(dateLabel(invoice.closeDate, { year: true }))}<br>
            Vence ${esc(dateLabel(invoice.dueDate, { year: true }))}
          </div>
        </div>
        ${invoice.items.length
          ? `<div class="list">${invoice.items.map((tx) => txRow(tx, { showDate: true })).join("")}</div>`
          : emptyState({ iconName: "card", title: "Fatura vazia", text: "Nenhuma compra neste ciclo de fechamento." })}`,
    });

    close.addEventListener("click", () => modal.close());
    pay.addEventListener("click", () => {
      for (const tx of invoice.items) updateTransaction(tx.id, { paid: !invoice.paid }, "one");
      commit();
      toast(invoice.paid ? "Fatura reaberta" : "Fatura marcada como paga");
      modal.close();
    });
  });
};

/* --------------------------------------------------------------------------
   ORÇAMENTOS
   -------------------------------------------------------------------------- */
function pageBudgets() {
  const month = state.month;
  const rows = budgetStatus(month);
  const summary = monthSummary(month);
  const planned = sum(rows, (r) => r.limit);
  const used = sum(rows, (r) => r.used);
  const uncovered = round2(summary.expense - used);
  const over = rows.filter((r) => r.over);

  const row = (item) => {
    const tone = item.over ? "expense" : item.share >= 85 ? "warn" : "income";
    return `<button class="list-row is-button" data-budget="${esc(item.id)}" style="align-items:flex-start;padding:13px 4px">
      <span class="avatar-icon" style="background:${alpha(item.category.color, 0.16)};font-size:16px">${esc(item.category.emoji)}</span>
      <span class="grow" style="min-width:0">
        <span class="row-between mb-6">
          <span class="list-title truncate">${esc(item.category.name)}</span>
          <span class="f-12 num w-700" style="color:var(--${tone})">${esc(pctText(item.share))}</span>
        </span>
        <span class="bar" style="display:block"><span class="bar-fill" style="display:block;width:${item.share}%;background:var(--${tone})"></span></span>
        <span class="row-between f-11 mt-6">
          <span class="muted num">${esc(money(item.used))} de ${esc(money(item.limit))}</span>
          <span class="num ${item.over ? "neg" : "muted"}">${item.over ? `${esc(money(Math.abs(item.left)))} acima` : `${esc(money(item.left))} restante`}</span>
        </span>
      </span>
    </button>`;
  };

  const suggestions = categoriesOf("expense")
    .filter((c) => !rows.some((r) => r.categoryId === c.id))
    .map((c) => {
      const history = [1, 2, 3].map((i) => {
        const list = txOfMonth(addMonths(month, -i));
        return sum(list.filter((tx) => tx.type === "expense" && tx.categoryId === c.id), (tx) => tx.amount);
      }).filter((v) => v > 0);
      return { category: c, average: history.length ? round2(sum(history) / history.length) : 0 };
    })
    .filter((s) => s.average > 0)
    .sort((a, b) => b.average - a.average)
    .slice(0, 5);

  return `
    <div class="page-head">
      <div>
        <h1 class="page-title">${esc(t("budgets"))}</h1>
        <p class="page-sub">Limites por categoria em ${esc(monthLabel(month))}</p>
      </div>
      <div class="row gap-8">
        ${monthNav(month)}
        <button class="btn btn-primary" data-action="new-budget">${icon("plus", 15)} <span class="hide-sm">Orçamento</span></button>
      </div>
    </div>

    <div class="grid grid-kpi keep-2 mb-16">
      ${kpiCard({ label: "Planejado", value: money(planned), iconName: "target", tone: "accent", sub: `<span class="faint">${rows.length} categoria(s)</span>` })}
      ${kpiCard({ label: "Usado", value: money(used), iconName: "arrowDown", tone: used > planned ? "neg" : "pos", sub: `<span class="faint">${esc(pctText(pct(used, planned)))} do planejado</span>` })}
      ${kpiCard({ label: "Disponível", value: money(planned - used), iconName: "wallet", tone: planned - used >= 0 ? "pos" : "neg", sub: `<span class="faint">até o fim do mês</span>` })}
      ${kpiCard({ label: "Sem orçamento", value: money(uncovered), iconName: "alert", tone: "warn", sub: `<span class="faint">gastos sem limite definido</span>` })}
    </div>

    ${over.length ? `
      <div class="card mb-16" style="border-color:var(--expense)">
        <div class="row gap-8">
          <span class="neg">${icon("alert", 17)}</span>
          <div class="grow">
            <strong class="f-13">${over.length} orçamento(s) estourado(s)</strong>
            <div class="f-12 muted mt-4">${esc(over.map((o) => o.category.name).join(", "))} — total de ${esc(money(sum(over, (o) => Math.abs(o.left))))} acima do limite.</div>
          </div>
        </div>
      </div>` : ""}

    <div class="grid grid-main">
      <div class="col gap-16">
        ${sectionCard("Acompanhamento",
          rows.length ? `<div class="list">${rows.map(row).join("")}</div>`
            : emptyState({ iconName: "target", title: "Nenhum orçamento definido", text: "Defina limites mensais por categoria e receba alertas antes de estourar.",
              action: `<button class="btn btn-primary" data-action="new-budget">${icon("plus", 15)} Criar orçamento</button>` }))}
      </div>
      <div class="col gap-16">
        ${rows.length ? sectionCard("Planejado x realizado",
          `<div class="center">${donutChart(rows.map((r) => ({ name: r.category.name, value: r.used, color: r.category.color })),
            { size: 168, center: moneyShort(used), centerSub: `de ${moneyShort(planned)}` })}</div>`) : ""}

        ${suggestions.length ? sectionCard("Sugestões baseadas no seu histórico",
          `<div class="col gap-8">${suggestions.map((s) => `
            <div class="row-between">
              <span class="row gap-8" style="min-width:0">
                <span style="font-size:15px">${esc(s.category.emoji)}</span>
                <span style="min-width:0">
                  <span class="f-13 w-600 truncate" style="display:block">${esc(s.category.name)}</span>
                  <span class="f-11 faint">média de ${esc(money(s.average))}/mês</span>
                </span>
              </span>
              <button class="btn btn-soft btn-sm" data-suggest="${esc(s.category.id)}" data-amount="${s.average}">usar</button>
            </div>`).join("")}</div>`,
          { sub: "Média dos últimos 3 meses com movimento" }) : ""}
      </div>
    </div>`;
}

pageHandlers.budgets = (root) => {
  delegate(root, "click", "[data-budget]", (event, node) => {
    const budget = findById(db().budgets, node.dataset.budget);
    if (budget) openBudgetModal(budget);
  });
  delegate(root, "click", "[data-suggest]", (event, node) => {
    upsert("budgets", { categoryId: node.dataset.suggest, amount: round2(Number(node.dataset.amount)), month: null });
    commit();
    toast(`Orçamento de ${catById(node.dataset.suggest)?.name} criado`);
  });
};

/* --------------------------------------------------------------------------
   METAS E RESERVA
   -------------------------------------------------------------------------- */
function pageGoals() {
  const goals = db().goals;
  const saved = totalSaved();
  const target = sum(goals, (g) => g.target);
  const series = monthlySeries(state.month, 6);
  const avgExpense = series.filter((m) => m.expense > 0);
  const monthlyNeed = avgExpense.length ? sum(avgExpense, (m) => m.expense) / avgExpense.length : 0;
  const coverage = monthlyNeed > 0 ? saved / monthlyNeed : 0;

  const card = (goal) => {
    const progress = goalProgress(goal.id);
    const remaining = goal.deadline ? Math.max(0, Math.ceil(diffDays(goal.deadline, todayKey()) / 30)) : null;
    const perMonth = remaining && remaining > 0 ? progress.left / remaining : null;
    return `<div class="card col gap-12">
      <div class="row gap-12">
        <span class="avatar-icon" style="background:${alpha(goal.color, 0.18)};font-size:18px">${esc(goal.emoji)}</span>
        <span class="grow" style="min-width:0">
          <span class="f-14 w-700 truncate" style="display:block">${esc(goal.name)}</span>
          <span class="f-11 muted">${goal.deadline ? `até ${esc(dateLabel(goal.deadline, { year: true }))}` : "sem prazo"}</span>
        </span>
        <button class="btn btn-ghost btn-icon btn-sm" data-goal-menu="${esc(goal.id)}" aria-label="Ações">${icon("more", 16)}</button>
      </div>

      <div>
        <div class="row-between mb-6">
          <span class="f-20 w-800 num" style="color:${goal.color}">${esc(money(progress.saved))}</span>
          <span class="f-12 muted num">de ${esc(money(goal.target))}</span>
        </div>
        <div class="bar" style="height:9px"><div class="bar-fill" style="width:${progress.share}%;background:${goal.color}"></div></div>
        <div class="row-between f-11 mt-6">
          <span class="w-700" style="color:${goal.color}">${esc(pctText(progress.share, 1))}</span>
          <span class="muted">${progress.done ? "meta batida! 🎉" : `faltam ${esc(money(progress.left))}`}</span>
        </div>
      </div>

      ${perMonth && !progress.done ? `<div class="f-11 faint">Guardando ${esc(money(perMonth))}/mês você chega no prazo.</div>` : ""}

      <div class="row gap-8">
        <button class="btn btn-primary btn-sm grow" data-goal-add="${esc(goal.id)}">${icon("plus", 14)} Guardar</button>
        <button class="btn btn-sm grow" data-goal-take="${esc(goal.id)}" ${progress.saved <= 0 ? "disabled" : ""}>${icon("minus", 14)} Retirar</button>
      </div>
    </div>`;
  };

  const movements = db().transactions
    .filter((tx) => tx.goalId)
    .sort((a, b) => b.date.localeCompare(a.date))
    .slice(0, 10);

  return `
    <div class="page-head">
      <div>
        <h1 class="page-title">${esc(t("goals"))}</h1>
        <p class="page-sub">Reserva total: <b class="num pos">${esc(money(saved))}</b></p>
      </div>
      <button class="btn btn-primary" data-action="new-goal">${icon("plus", 15)} Nova meta</button>
    </div>

    <div class="grid grid-kpi keep-2 mb-16">
      ${kpiCard({ label: "Guardado", value: money(saved), iconName: "piggy", tone: "pos", sub: `<span class="faint">${goals.length} meta(s) ativa(s)</span>` })}
      ${kpiCard({ label: "Objetivo total", value: money(target), iconName: "target", tone: "accent", sub: `<span class="faint">${esc(pctText(pct(saved, target)))} alcançado</span>` })}
      ${kpiCard({ label: "Reserva cobre", value: `${num(coverage, 1)} meses`, iconName: "shield", tone: coverage >= 6 ? "pos" : coverage >= 3 ? "warn" : "neg", sub: `<span class="faint">de despesa média</span>` })}
      ${kpiCard({ label: "Falta juntar", value: money(Math.max(0, target - saved)), iconName: "trendUp", tone: "info", sub: `<span class="faint">para bater todas as metas</span>` })}
    </div>

    ${coverage < 6 && monthlyNeed > 0 ? `
      <div class="card mb-16 install-hint">
        <span style="color:var(--accent);flex:none">${icon("bulb", 18)}</span>
        <div>
          <strong class="f-13">Meta de reserva recomendada: ${esc(money(monthlyNeed * 6))}</strong>
          <div class="f-12 muted mt-4" style="line-height:1.55">
            Equivale a 6 meses da sua despesa média (${esc(money(monthlyNeed))}/mês). Hoje sua reserva cobre ${esc(num(coverage, 1))} ${coverage === 1 ? "mês" : "meses"}.
          </div>
        </div>

            text: "Crie metas como reserva de emergência, viagem ou troca de carro e acompanhe o quanto já juntou.",
            action: `<button class="btn btn-primary" data-action="new-goal">${icon("plus", 15)} Criar primeira meta</button>`,

      </div>
      <div>
        ${sectionCard("Movimentações recentes",

            return `<button class="list-row is-button" data-tx="${esc(tx.id)}">
